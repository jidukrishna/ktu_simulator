<!-- ===== EMAIL ===== -->
<details class="module" open id="email">
<summary>4. Electronic Mail &amp; MIME</summary>
<div class="module-body">

<details class="topic" open><summary>E-mail – Overview &amp; Five Basic Functions <span class="fire">🔥</span></summary><div class="topic-body">
<p>E-mail started as short text-only memos; today it carries <b>multimedia</b> (text, audio, video). It is faster and cheaper than paper mail. A sender saves/sends/forwards; a recipient reads/downloads from the mail server.</p>
<p><b>Required components:</b> user agents (UA), mail transfer agents (MTA), and the protocol controlling delivery (SMTP).</p>
<div class="tw"><table>
<tr><th>Function</th><th>Meaning</th></tr>
<tr><td><b>Composition</b></td><td>Creating messages and replies. System helps with addressing and header fields (e.g. auto-inserting originator's address in a reply).</td></tr>
<tr><td><b>Transfer</b></td><td>Moving the message from originator to recipient – connect, send, release. Automatic.</td></tr>
<tr><td><b>Reporting</b></td><td>Telling the originator what happened – delivered? rejected? lost? May have legal significance.</td></tr>
<tr><td><b>Displaying</b></td><td>Showing incoming mail; may need conversion or special viewer (PostScript, voice).</td></tr>
<tr><td><b>Disposition</b></td><td>What the recipient does after receiving – delete, reply, forward, save.</td></tr>
</table></div>
</div></details>

<details class="topic" open><summary>E-mail Architecture – User Agents, MTAs, Mailbox <span class="fire">🔥</span></summary><div class="topic-body">
<p>Two kinds of subsystems: <b>user agents</b> (read &amp; send) and <b>message transfer agents / mail servers</b> (move messages from source to destination).</p>
<div class="diagram">
<svg viewBox="0 0 720 200" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" font-size="12">
<defs><marker id="a3" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8z" fill="#c4a35a"/></marker></defs>
<g fill="#1e1c22" stroke="#7c9ec9"><rect x="10" y="60" width="110" height="60" rx="8"/><rect x="190" y="60" width="130" height="60" rx="8"/><rect x="400" y="60" width="130" height="60" rx="8"/><rect x="600" y="60" width="110" height="60" rx="8"/></g>
<g fill="#e6e3ea" text-anchor="middle"><text x="65" y="95">Sender UA</text><text x="255" y="85">Sender's</text><text x="255" y="102">Mail Server (MTA)</text><text x="465" y="85">Receiver's</text><text x="465" y="102">Mail Server + mailbox</text><text x="655" y="95">Receiver UA</text></g>
<g stroke="#c4a35a" stroke-width="2" marker-end="url(#a3)"><line x1="120" y1="90" x2="190" y2="90"/><line x1="320" y1="90" x2="400" y2="90"/><line x1="600" y1="100" x2="530" y2="100" stroke="#8dbf8d"/></g>
<g fill="#c4a35a" text-anchor="middle"><text x="155" y="55">Step 1</text><text x="360" y="55">Step 2</text></g>
<text x="565" y="55" fill="#8dbf8d" text-anchor="middle">Step 3</text>
<g fill="#9a96a3" text-anchor="middle" font-size="11"><text x="155" y="150">mail submission</text><text x="360" y="150">message transfer (SMTP)</text><text x="565" y="150">final delivery (IMAP/POP3)</text></g>
</svg>
<div class="cap">Architecture of the e-mail system</div></div>
<div class="grid2">
<div><h4>User Agent (UA)</h4><ul>
<li>Program with a GUI or text interface to compose, reply, display, file, search, discard messages.</li>
<li>Examples: Gmail, Outlook, Thunderbird, Apple Mail.</li>
<li>Shows summary lines: <b>From, Subject, Received</b>.</li>
<li>Sending new mail into the system = <b>mail submission</b>.</li>
<li>May filter spam, auto-reply (vacation).</li>
<li>Runs on the user's computer, maybe only part of the time.</li></ul></div>
<div class="g"><h4>Message Transfer Agent (MTA)</h4><ul>
<li>System processes running in background on mail servers; always available.</li>
<li>Move mail from originator to recipient using <b>SMTP</b>.</li>
<li>Implement mailing lists, Cc, Bcc, priority, secret (encrypted) mail, alternative recipients.</li>
<li>Report delivery status and errors.</li></ul></div>
</div>
<h3>Mailbox</h3>
<ul><li>Stores received e-mail for a user; <b>maintained by mail servers</b>.</li><li>UAs only show a view of it by sending commands to the server (inspect, delete…).</li><li>Retrieval = final delivery (step 3). One user can use different UAs on many computers for the same mailbox.</li></ul>
</div></details>

<details class="topic" open><summary>Mail Format – Envelope, Header, Body (RFC 5322) <span class="fire">🔥</span></summary><div class="topic-body">
<ul>
<li>Original format <b>RFC 822</b> → revised to <b>RFC 5322</b>, extended with multimedia + international text = <b>MIME</b>.</li>
<li><b>Envelope</b> – info for transport (destination address, priority, security level); used by MTAs for routing, like a post office. Separate from the message.</li>
<li><b>Message</b> = <b>header</b> (control info for user agents) + <b>body</b> (for the human; agents don't care).</li>
<li><b>Address format:</b> <code>user@dns-address</code></li>
</ul>
<div class="tw"><table>
<tr><th>Header field</th><th>Meaning</th></tr>
<tr><td><b>To:</b></td><td>Primary recipient(s)</td></tr>
<tr><td><b>Cc:</b></td><td>Secondary recipients (carbon copy). No delivery difference from primary.</td></tr>
<tr><td><b>Bcc:</b></td><td>Blind carbon copy – like Cc but the line is <b>deleted</b> from copies sent to primary/secondary recipients.</td></tr>
<tr><td><b>From:</b></td><td>Who <b>wrote</b> the message</td></tr>
<tr><td><b>Sender:</b></td><td>Who <b>sent</b> the message</td></tr>
<tr><td>Received / Date / Subject / Reply-To / Message-Id</td><td>Other fields useful to user agents</td></tr>
</table></div>
</div></details>

<details class="topic" open><summary>MIME – Multipurpose Internet Mail Extensions <span class="fire">🔥</span></summary><div class="topic-body">
<div class="callout def"><span class="t">Definition</span><b>MIME</b> specifies the format for sending richer <b>multimedia</b> content (image, video, audio) and <b>international (non-ASCII) text</b> through the mail system. Earlier mail supported text only.</div>
<ul>
<li>Adds structure to the message body and defines encoding rules for non-ASCII messages.</li>
<li>Also adopted by the <b>Web</b> to label document content types (browser knows how to display).</li>
<li>Same mail system is used: just extra headers.</li>
</ul>
<h3>MIME defines five new message headers</h3>
<div class="tw"><table>
<tr><th>Header</th><th>Purpose</th></tr>
<tr><td><code>MIME-Version:</code></td><td>Tells UA it's a MIME message and which version. No header ⇒ assumed plain English ASCII text.</td></tr>
<tr><td><code>Content-Description:</code></td><td>ASCII string describing the content – lets recipient decide if worth decoding.</td></tr>
<tr><td><code>Content-Id:</code></td><td>Identifies the content (same format as Message-Id).</td></tr>
<tr><td><code>Content-Transfer-Encoding:</code></td><td>How the body is wrapped for transmission (e.g. base64, 7bit).</td></tr>
<tr><td><code>Content-Type:</code></td><td>Nature of the body: <code>type/subtype</code>.</td></tr>
</table></div>
<h3>Content types &amp; subtypes</h3>
<p>Format: <code>Content-Type: type/subtype</code> (separated by slash). List maintained by <b>IANA</b>.</p>
<div class="tw"><table>
<tr><th>Type</th><th>Subtypes (examples)</th><th>Use</th></tr>
<tr><td><b>text</b></td><td>plain, html, xml</td><td>plain = ordinary messages, no encoding. html added when Web became popular. xml for XML docs.</td></tr>
<tr><td><b>image</b></td><td>gif, jpeg, tiff</td><td>Still pictures</td></tr>
<tr><td><b>audio</b></td><td>basic, mpeg, mp4</td><td>Sound</td></tr>
<tr><td><b>video</b></td><td>mpeg, mp4</td><td>Moving pictures</td></tr>
<tr><td><b>application</b></td><td>pdf, msword, octet-stream…</td><td>Programs / data for helper applications</td></tr>
</table></div>
<div class="callout ex"><span class="t">Example MIME message</span>
<pre>From: alice@example.com
To: bob@example.com
MIME-Version: 1.0
Content-Type: image/jpeg
Content-Transfer-Encoding: base64
Content-Description: Holiday photo</pre></div>
</div></details>

<details class="topic" open><summary>Paper mail vs e-mail – envelope, header, body (slide figure) <span class="fire">🔥</span></summary><div class="topic-body">
<div class="tw"><table>
<tr><th>Part</th><th>Paper mail</th><th>Electronic mail</th></tr>
<tr><td><b>Envelope</b></td><td>Recipient's name and postal address on the envelope</td><td>Name: Mr. Daniel Dumkopf; Street: 18 Willow Lane; City: White Plains; State: NY; Zip code: 10604; <b>Priority: Urgent</b>; <b>Encryption: None</b></td></tr>
<tr><td><b>Header</b></td><td>Sender's letterhead, date, subject line</td><td>From: United Gizmo; Address: 180 Main St.; Location: Boston, MA 02120; Date: Sept. 1, 2010; Subject: Invoice 1081</td></tr>
<tr><td><b>Body</b></td><td>"Dear Mr. Dumkopf, Our computer records show…"</td><td>Same text – for the human reader only</td></tr>
</table></div>
<p>The slide brackets <b>Envelope</b> separately from the <b>Message (= header + body)</b>. Mail address form: <code>user@dns-address</code>.</p>
<h3>RFC 5322 – all header fields (slide tables)</h3>
<div class="tw"><table>
<tr><th>Header</th><th>Meaning</th></tr>
<tr><td>To:</td><td>Email address(es) of primary recipient(s)</td></tr>
<tr><td>Cc:</td><td>Email address(es) of secondary recipient(s)</td></tr>
<tr><td>Bcc:</td><td>Email address(es) for blind carbon copies</td></tr>
<tr><td>From:</td><td>Person or people who created the message</td></tr>
<tr><td>Sender:</td><td>Email address of the actual sender</td></tr>
<tr><td>Received:</td><td>Line added by each transfer agent along the route</td></tr>
<tr><td>Return-Path:</td><td>Can be used to identify a path back to the sender</td></tr>
</table></div>
<p><b>Other header fields useful for user agents:</b></p>
<div class="tw"><table>
<tr><th>Header</th><th>Meaning</th></tr>
<tr><td>Date:</td><td>The date and time the message was sent</td></tr>
<tr><td>Reply-To:</td><td>Email address to which replies should be sent</td></tr>
<tr><td>Message-Id:</td><td>Unique number for referencing this message later</td></tr>
<tr><td>In-Reply-To:</td><td>Message-Id of the message to which this is a reply</td></tr>
<tr><td>References:</td><td>Other relevant Message-Ids</td></tr>
<tr><td>Keywords:</td><td>User-chosen keywords</td></tr>
<tr><td>Subject:</td><td>Short summary of the message for the one-line display</td></tr>
</table></div>
<div class="callout note"><span class="t">User agent figure</span>A user agent's functions: <b>composing, reading, replying to, forwarding</b> messages and <b>handling mailboxes</b>.</div>
</div></details>

<details class="topic" open><summary>MIME – multipart message example &amp; full content-type table (slides) <span class="fire">🔥</span></summary><div class="topic-body">
<h3>Full content types table</h3>
<div class="tw"><table>
<tr><th>Type</th><th>Example subtypes</th><th>Description</th></tr>
<tr><td>text</td><td>plain, html, xml, css</td><td>Text in various formats</td></tr>
<tr><td>image</td><td>gif, jpeg, tiff</td><td>Pictures</td></tr>
<tr><td>audio</td><td>basic, mpeg, mp4</td><td>Sounds</td></tr>
<tr><td>video</td><td>mpeg, mp4, quicktime</td><td>Movies</td></tr>
<tr><td>model</td><td>vrml</td><td>3D model</td></tr>
<tr><td>application</td><td>octet-stream, pdf, javascript, zip</td><td>Data produced by applications</td></tr>
<tr><td>message</td><td>http, rfc822</td><td>Encapsulated message</td></tr>
<tr><td>multipart</td><td>mixed, alternative, parallel, digest</td><td>Combination of multiple types</td></tr>
</table></div>
<h3>MIME headers table (slide wording)</h3>
<div class="tw"><table>
<tr><th>Header</th><th>Meaning</th></tr>
<tr><td>MIME-Version:</td><td>Identifies the MIME version</td></tr>
<tr><td>Content-Description:</td><td>Human-readable string telling what is in the message</td></tr>
<tr><td>Content-Id:</td><td>Unique identifier</td></tr>
<tr><td>Content-Transfer-Encoding:</td><td>How the body is wrapped for transmission</td></tr>
<tr><td>Content-Type:</td><td>Type and format of the content</td></tr>
</table></div>
<h3>"Putting it all together" – multipart message with HTML and audio alternatives</h3>
<pre>From: alice@cs.washington.edu
To: bob@ee.uwa.edu.au
MIME-Version: 1.0
Message-Id: &lt;0704760941.AA00747@cs.washington.edu&gt;
Content-Type: multipart/alternative; boundary=qwertyuiopasdfghjklzxcvbnm
Subject: Earth orbits sun integral number of times

This is the preamble. The user agent ignores it. Have a nice day.

--qwertyuiopasdfghjklzxcvbnm              &lt;- ONE PART (HTML)
Content-Type: text/html

&lt;p&gt;Happy birthday to you&lt;br&gt;
Happy birthday to you&lt;br&gt;
Happy birthday dear &lt;b&gt;Bob&lt;/b&gt;&lt;br&gt;
Happy birthday to you&lt;/p&gt;

--qwertyuiopasdfghjklzxcvbnm              &lt;- ANOTHER (audio)
Content-Type: message/external-body;
   access-type="anon-ftp";
   site="bicycle.cs.washington.edu";
   directory="pub";
   name="birthday.snd"

content-type: audio/basic
content-transfer-encoding: base64
--qwertyuiopasdfghjklzxcvbnm--            &lt;- closing boundary</pre>
<ul>
<li><b>multipart/alternative</b> – same content in different forms; the UA shows the best one it can.</li>
<li>Parts are separated by a <b>boundary string</b> declared in Content-Type; the final boundary ends with <code>--</code>.</li>
<li>Text before the first boundary is the <b>preamble</b>; user agents ignore it.</li>
<li><b>message/external-body</b> – the audio isn't included; it's fetched by anonymous FTP from the named site.</li>
</ul>
</div></details>

</div></details>

<!-- ===== SNMP ===== -->
<details class="module" open id="snmp">
<summary>5. Simple Network Management Protocol (SNMP)</summary>
<div class="module-body">

<details class="topic" open><summary>Network Management &amp; Manager–Agent Model <span class="fire">🔥</span></summary><div class="topic-body">
<div class="callout def"><span class="t">Definition</span><b>Network management</b> = monitoring, testing, configuring and troubleshooting network components to meet an organisation's requirements. <b>SNMP</b> is a framework for managing devices in an internet using the TCP/IP suite, giving fundamental operations for monitoring and maintaining it.</div>
<div class="diagram">
<svg viewBox="0 0 700 220" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" font-size="12">
<defs><marker id="a4" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8z" fill="#c4a35a"/></marker></defs>
<rect x="20" y="70" width="170" height="80" rx="10" fill="#1e1c22" stroke="#7c9ec9"/><text x="105" y="100" fill="#7c9ec9" text-anchor="middle" font-weight="bold">MANAGER</text><text x="105" y="120" fill="#9a96a3" text-anchor="middle">host, SNMP client</text><text x="105" y="136" fill="#9a96a3" text-anchor="middle" font-size="10">UDP port 162</text>
<rect x="500" y="40" width="180" height="140" rx="10" fill="#1e1c22" stroke="#8dbf8d"/><text x="590" y="65" fill="#8dbf8d" text-anchor="middle" font-weight="bold">AGENT (router)</text><text x="590" y="83" fill="#9a96a3" text-anchor="middle">SNMP server, port 161</text>
<rect x="520" y="100" width="140" height="60" rx="6" fill="#26232c" stroke="#2e2c35"/><text x="590" y="125" fill="#c4a35a" text-anchor="middle">Database (MIB)</text><text x="590" y="143" fill="#9a96a3" text-anchor="middle" font-size="10">variables &amp; values</text>
<g stroke="#c4a35a" stroke-width="2" marker-end="url(#a4)"><line x1="190" y1="90" x2="500" y2="90"/><line x1="500" y1="130" x2="190" y2="130" stroke="#8dbf8d"/><line x1="500" y1="160" x2="190" y2="160" stroke="#c98a7c" stroke-dasharray="5 4"/></g>
<text x="345" y="82" fill="#c4a35a" text-anchor="middle">GetRequest / SetRequest</text>
<text x="345" y="124" fill="#8dbf8d" text-anchor="middle">Response</text>
<text x="345" y="176" fill="#c98a7c" text-anchor="middle">Trap (agent warns manager)</text>
</svg>
<div class="cap">SNMP manager–agent interaction</div></div>
<ul>
<li><b>Manager</b> – a host running the SNMP <b>client</b> program; controls and monitors agents.</li>
<li><b>Agent</b> – a router (or host) running the SNMP <b>server</b> program; keeps performance info in a database.</li>
</ul>
<div class="callout ex"><span class="t">Examples</span><b>Monitor:</b> router stores number of packets received &amp; forwarded; manager fetches and compares them to see if the router is congested.<br><b>Control:</b> router checks a reboot counter and reboots when it is 0; manager can remotely reboot it by forcing the counter to 0.</div>
<h3>Three basic ideas of SNMP management</h3>
<ol>
<li>Manager checks an agent by <b>requesting information</b> reflecting its behaviour.</li>
<li>Manager <b>forces an agent to perform a task</b> by resetting values in its database.</li>
<li>Agent contributes by <b>warning the manager</b> of an unusual situation – message called a <b>trap</b>.</li>
</ol>
</div></details>

<details class="topic" open><summary>SNMP, SMI and MIB – Management Components <span class="fire">🔥</span></summary><div class="topic-body">
<p>Management on the Internet is done through the cooperation of three protocols: <b>SNMP, SMI and MIB</b>.</p>
<div class="tw"><table>
<tr><th>Component</th><th>Role</th></tr>
<tr><td><b>SNMP</b></td><td>Defines the <b>format of packets</b> exchanged between manager and agent; reads/changes object values; interprets results and creates statistics (with other software). Packets carry object names and values.</td></tr>
<tr><td><b>SMI</b> (Structure of Management Information)</td><td>A <b>guideline</b> for SNMP. Defines general rules for <b>naming objects</b>, object <b>types</b> (range, length), and how to <b>encode</b> objects and values. Objects form a hierarchy (parent/children, name inherited from parent).</td></tr>
<tr><td><b>MIB</b> (Management Information Base)</td><td>For each managed entity: defines the <b>number of objects</b>, <b>names</b> them using SMI rules, and associates a <b>type</b>. A collection of named objects, types and relationships – mostly metadata (names and types, no values).</td></tr>
</table></div>
<div class="callout note"><span class="t">Memory trick</span>SMI = rules (how to name, type, encode). MIB = the actual list of objects. SNMP = the messages that read/write them.</div>
</div></details>

<details class="topic" open><summary>SMI Object Attributes – Name, Type, Encoding <span class="fire">🔥</span></summary><div class="topic-body">
<ul>
<li><b>Name:</b> each managed object has a unique name – an <b>object identifier (OID)</b>, hierarchical, tree-based, starting from an unnamed root. Written as integers separated by dots (used by SNMP) or text names separated by dots (used by people).</li>
<li><b>Type:</b> data type stored. SMI uses <b>ASN.1</b> (Abstract Syntax Notation 1) and adds definitions – SMI is both a subset and superset of ASN.1. Two categories: <b>simple</b> and <b>structured</b>.</li>
<li><b>Encoding:</b> SMI uses <b>BER</b> (Basic Encoding Rules); every piece of data is encoded as a <b>triplet: tag, length, value</b>.</li>
</ul>
<div class="callout ex"><span class="t">OID example</span>Same object in two notations:
<pre>iso.org.dod.internet.mgmt.mib-2   =   1.3.6.1.2.1</pre></div>
</div></details>

<details class="topic" open><summary>SNMP PDUs – Eight Packet Types <span class="fire">🔥</span></summary><div class="topic-body">
<p>The SNMP application lets (1) a manager <b>retrieve</b> an agent object's value, (2) a manager <b>store</b> a value in an agent object, (3) an agent send an <b>alarm</b> to the manager. <b>SNMPv3</b> defines eight PDUs:</p>
<div class="tw"><table>
<tr><th>#</th><th>PDU</th><th>Direction</th><th>Description</th></tr>
<tr><td>1</td><td><b>GetRequest</b></td><td>Manager → Agent</td><td>Retrieve value of a variable or set of variables</td></tr>
<tr><td>2</td><td><b>GetNextRequest</b></td><td>Manager → Agent</td><td>Retrieve value of the object <i>following</i> the given OID; used for table entries</td></tr>
<tr><td>3</td><td><b>GetBulkRequest</b></td><td>Manager → Agent</td><td>Retrieve large amounts of data; replaces many Get/GetNext PDUs</td></tr>
<tr><td>4</td><td><b>Response</b></td><td>Agent → Manager</td><td>Reply to Get/GetNext containing the requested values</td></tr>
<tr><td>5</td><td><b>SetRequest</b></td><td>Manager → Agent</td><td>Set (store) a value in a variable</td></tr>
<tr><td>6</td><td><b>Trap</b></td><td>Agent → Manager</td><td>Report an event, e.g. agent rebooted + time of reboot</td></tr>
<tr><td>7</td><td><b>InformRequest</b></td><td>Manager → Manager</td><td>Get values of variables from agents under a remote manager; answered with Response</td></tr>
<tr><td>8</td><td><b>Report</b></td><td>Manager ↔ Manager</td><td>Report certain types of errors between managers</td></tr>
</table></div>
<h3>PDU format – fields</h3>
<ul>
<li><b>PDU type</b> – which of the eight.</li>
<li><b>Request ID</b> – sequence number set by manager, repeated by agent; matches request to response.</li>
<li><b>Error status</b> – used only in Response PDUs (0 in requests); type of error.</li>
<li><b>Error index</b> – offset telling which variable caused the error.</li>
<li><b>Non-repeaters</b> and <b>Max-repetition</b> – only in GetBulkRequest; replace error status and error index respectively.</li>
<li><b>VarBind list</b> – variables and values to get/set. Values are <b>null</b> in GetRequest/GetNextRequest.</li>
</ul>
</div></details>

<details class="topic" open><summary>SNMP Message &amp; Ports <span class="fire">🔥</span></summary><div class="topic-body">
<p>SNMP doesn't send just a PDU – it embeds it in a <b>message</b>. An SNMPv3 message has four elements:</p>
<div class="diagram">
<svg viewBox="0 0 680 80" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" font-size="12">
<g fill="#1e1c22" stroke="#c4a35a"><rect x="10" y="20" width="140" height="44"/><rect x="150" y="20" width="160" height="44"/><rect x="310" y="20" width="190" height="44"/><rect x="500" y="20" width="170" height="44"/></g>
<g fill="#e6e3ea" text-anchor="middle"><text x="80" y="47">Version (3)</text><text x="230" y="47">Header</text><text x="405" y="47">Security parameters</text><text x="585" y="47">Data (encoded PDU)</text></g>
</svg>
<div class="cap">SNMPv3 message – each element is encoded with BER</div></div>
<ul>
<li><b>Header:</b> message ID, max message size (of reply), message flag (1 octet; bits define privacy/authentication), security model.</li>
<li><b>Security parameters:</b> used to create a <b>message digest</b>.</li>
<li><b>Data:</b> the PDU. If encrypted, includes encrypting engine + context info before the encrypted PDU.</li>
<li>PDU type tag: class = context-sensitive, format = structured; tag numbers 0, 1, 2, 3, 5, 6, 7, 8.</li>
</ul>
<div class="grid2">
<div><h4>Port 161</h4><p>Used by the <b>server (agent)</b> – requests (Get/Set).</p></div>
<div class="g"><h4>Port 162</h4><p>Used by the <b>client (manager)</b> – receives Traps.</p></div>
</div>
<div class="callout warn"><span class="t">Remember</span>SNMP runs over <b>UDP</b> (161 &amp; 162), not TCP.</div>
</div></details>

<ul>
<li>The <b>manager</b> station sends <b>queries</b> and receives <b>replies</b> and <b>traps</b>; the <b>agent</b> accesses MIB objects, supplies data, and sends traps.</li>
<li>The "agent variables" figure shows the manager reaching a set of variables on the agent across the Internet.</li>
<li>SNMP management = cooperation of <b>SNMP, SMI and MIB</b> (Management figure).</li>
</ul>

<details class="topic" open><summary>SNMP – OID tree, data types and BER tag (slide figures) <span class="fire">🔥</span></summary><div class="topic-body">
<div class="diagram">
<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" font-size="12">
<g stroke="#2e2c35" stroke-width="1.5"><line x1="280" y1="28" x2="170" y2="75"/><line x1="280" y1="28" x2="280" y2="75"/><line x1="280" y1="28" x2="390" y2="75"/><line x1="280" y1="95" x2="280" y2="125"/><line x1="280" y1="145" x2="280" y2="175"/><line x1="280" y1="195" x2="280" y2="225"/><line x1="280" y1="245" x2="280" y2="270"/></g>

<details class="topic" open><summary>SNMP – PDU format, error status table, message structure &amp; port usage (slides) <span class="fire">🔥</span></summary><div class="topic-body">
<h3>PDU format</h3>
<pre>PDU type | Request ID | Error status | Error index | VarBind list
                                                       (Variable, Value) (Variable, Value) ...</pre>
<div class="callout note"><span class="t">Differences for GetBulkRequest</span>1. Error status and error index are <b>zero in all request messages</b> except GetBulkRequest.<br>2. In GetBulkRequest, <b>error status is replaced by non-repeaters</b> and <b>error index by max-repetitions</b>.</div>
<h3>Error status values</h3>
<div class="tw"><table>
<tr><th>Status</th><th>Name</th><th>Meaning</th></tr>
<tr><td>0</td><td>noError</td><td>No error</td></tr>
<tr><td>1</td><td>tooBig</td><td>Response too big to fit in one message</td></tr>
<tr><td>2</td><td>noSuchName</td><td>Variable does not exist</td></tr>
<tr><td>3</td><td>badValue</td><td>The value to be stored is invalid</td></tr>
<tr><td>4</td><td>readOnly</td><td>The value cannot be modified</td></tr>
<tr><td>5</td><td>genErr</td><td>Other errors</td></tr>
</table></div>
<h3>SNMP message structure (nested)</h3>
<pre>Message
 ├─ Version
 ├─ Header
 ├─ Security parameter
 └─ Data
     ├─ Context engine ID
     ├─ Context name
     └─ PDU
         ├─ Request ID
         ├─ Error status
         ├─ Error index
         └─ VarBind list ── [ Object identifier | Value to be stored ] ...</pre>
<h3>Port numbers – three cases (figure)</h3>
<div class="tw"><table>
<tr><th>Case</th><th>What happens</th></tr>
<tr><td>a. Passive open by both</td><td>Client opens <b>162</b> and server opens <b>161</b> – both wait.</td></tr>
<tr><td>b. Request / response</td><td>Client (ephemeral port, e.g. <b>58000</b>) actively opens a request to server port <b>161</b>; the response comes back to the client's ephemeral port.</td></tr>
<tr><td>c. Trap message</td><td>Server (ephemeral port, e.g. <b>61150</b>) actively sends a trap to the client's well-known port <b>162</b>.</td></tr>
</table></div>
<p>The UDP arrows figure shows requests (GetRequest, GetNextRequest, GetBulkRequest, SetRequest) going manager → agent, Response and Trap going agent → manager, and InformRequest / Report going between managers.</p>
</div></details>

</div></details>

<details class="module" open id="www">
<summary>6. World Wide Web (WWW) &amp; HTTP</summary>
<div class="module-body">

<details class="topic" open><summary>WWW – Architectural Overview <span class="fire">🔥</span></summary><div class="topic-body">
<div class="callout def"><span class="t">Definition</span>The <b>Web</b> is an architectural framework that lets information on the Internet be linked using <b>hyperlinks</b>, giving access to linked content spread over millions of machines.</div>
<ul>
<li>Designed so a user anywhere can search for and retrieve documents from many document-serving computers.</li>
<li>Examples: Wikipedia, Amazon, Facebook. Father of the Web: <b>Tim Berners-Lee</b>.</li>
<li><b>W3C</b> (World Wide Web Consortium) set up in <b>1994</b> to develop the Web, standardise protocols, encourage interoperability.</li>
<li>Web = vast collection of <b>pages</b>; each can link to other pages worldwide – idea of one page pointing to another is <b>hypertext</b>.</li>
<li>Pages are viewed with a <b>browser</b> (Chrome, Firefox, IE). Browser fetches the page, interprets text/images/formatting commands/video/programs, and displays it.</li>
</ul>
<div class="diagram">
<svg viewBox="0 0 700 220" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" font-size="12">
<defs><marker id="a5" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8z" fill="#c4a35a"/></marker></defs>
<rect x="20" y="70" width="150" height="80" rx="10" fill="#1e1c22" stroke="#7c9ec9"/><text x="95" y="105" fill="#7c9ec9" text-anchor="middle" font-weight="bold">Browser</text><text x="95" y="123" fill="#9a96a3" text-anchor="middle">(client)</text>
<rect x="500" y="10" width="180" height="55" rx="10" fill="#1e1c22" stroke="#8dbf8d"/><text x="590" y="42" fill="#8dbf8d" text-anchor="middle">Web server 1 (page)</text>
<rect x="500" y="82" width="180" height="55" rx="10" fill="#1e1c22" stroke="#8dbf8d"/><text x="590" y="114" fill="#8dbf8d" text-anchor="middle">Web server 2 (video)</text>
<rect x="500" y="155" width="180" height="55" rx="10" fill="#1e1c22" stroke="#8dbf8d"/><text x="590" y="187" fill="#8dbf8d" text-anchor="middle">Web server 3 (analytics)</text>
<g stroke="#c4a35a" stroke-width="2" marker-end="url(#a5)"><line x1="170" y1="95" x2="500" y2="40"/><line x1="170" y1="110" x2="500" y2="108"/><line x1="170" y1="125" x2="500" y2="180"/></g>
<text x="335" y="60" fill="#c4a35a" text-anchor="middle" font-size="11">HTTP request / response (over TCP)</text>
</svg>
<div class="cap">Architecture of the Web – HTTP transfers pages from servers to browsers</div></div>
<ul>
<li>A page may combine content from several servers, e.g. cs.washington.edu supplies the page, youtube.com an embedded video, google-analytics.com an invisible tracker.</li>
<li><b>Static page</b> – same document every time. <b>Dynamic page</b> – generated on demand by a program or contains a program; looks different each time.</li>
</ul>
</div></details>

<details class="topic" open><summary>URL – Uniform Resource Locator <span class="fire">🔥</span></summary><div class="topic-body">
<p>Each page has a <b>URL</b> that serves as its worldwide name. It has <b>three parts</b>:</p>
<pre>http://www.cs.washington.edu/index.html
 |            |                  |
protocol   DNS name of host    path (file / program)</pre>
<ul><li><b>Protocol</b> (scheme), <b>DNS name</b> of machine, <b>path</b> to the specific page (hierarchical, like a directory structure).</li></ul>
</div></details>

<details class="topic" open><summary>Client Side – Steps to follow a hyperlink <span class="fire">🔥</span></summary><div class="topic-body">
<ol>
<li>Browser determines the <b>URL</b> (from what was clicked).</li>
<li>Browser asks <b>DNS</b> for the server's IP address (www.cs.washington.edu).</li>
<li>DNS replies (e.g. 128.208.3.88).</li>
<li>Browser makes a <b>TCP connection to port 80</b> on that IP.</li>
<li>Sends an <b>HTTP request</b> for <code>/index.html</code>.</li>
<li>Server sends the page as an <b>HTTP response</b>.</li>
<li>If the page has embedded URLs (images, video, script), browser fetches them the same way.</li>
<li>Browser <b>displays</b> the page.</li>
<li>TCP connections are released if no more requests to those servers shortly.</li>
</ol>
<h3>MIME types in the browser</h3>
<p>Server returns the page's <b>MIME type</b> along with it. <code>text/html</code> and a few built-in types are shown directly. Otherwise the browser consults its MIME table:</p>
<div class="grid2">
<div><h4>Plug-in</h4><ul><li>Third-party <b>code module</b> installed as a browser extension (PDF, Flash, QuickTime).</li><li>Runs <b>inside</b> the browser; can access/modify the current page.</li><li>Must be installed first; browsers come with popular ones.</li></ul></div>
<div class="g"><h4>Helper application</h4><ul><li>A <b>complete separate program/process</b> (Word, PowerPoint).</li><li>Usually gets a <b>scratch file</b> with the content, opens and displays it.</li><li>Exists independently of the browser; often MIME type <code>application</code>.</li></ul></div>
</div>
</div></details>

<details class="topic" open><summary>Server Side – Main loop &amp; Improvements <span class="fire">🔥</span></summary><div class="topic-body">
<h3>Simple server main loop</h3>
<ol><li>Accept a TCP connection from a client.</li><li>Get the path (name of file requested).</li><li>Get the file from disk.</li><li>Send the contents to the client.</li><li>Release the TCP connection.</li></ol>
<h3>Problems &amp; fixes</h3>
<div class="tw"><table>
<tr><th>Problem</th><th>Solution</th></tr>
<tr><td>Disk access is slow; same files read repeatedly</td><td>Keep an in-memory <b>cache</b> of the n most recently read files</td></tr>
<tr><td>Only one request processed at a time; big files block others</td><td>Make the server <b>multithreaded</b>: one <b>front-end</b> module accepts requests, k <b>processing modules</b> handle them (k+1 threads, one process, shared cache). Improves throughput.</td></tr>
</table></div>
<h3>Steps in a modern server's processing module</h3>
<p>(after TCP and any SSL/TLS)</p>
<ol><li>Resolve the name of the page requested.</li><li>Perform <b>access control</b>.</li><li>Check the <b>cache</b>.</li><li>Fetch the page from disk or <b>run a program</b> to build it.</li><li>Determine the rest of the response (e.g. MIME type).</li><li>Return the response.</li><li>Make an entry in the <b>server log</b>.</li></ol>
</div></details>

<details class="topic" open><summary>HTTP – HyperText Transfer Protocol <span class="fire">🔥</span></summary><div class="topic-body">
<div class="callout def"><span class="t">Definition</span><b>HTTP</b> is the simple, text-based <b>request–response</b> protocol used to fetch Web pages. It runs over <b>TCP</b>; servers listen on well-known <b>port 80</b>.</div>
<ul>
<li>Browser (client) sends a request; server replies with page content (a file from disk or the result of a program/database query).</li>
<li>Content type is labelled with a MIME type so the browser knows how to render it.</li>
</ul>
<div class="callout note"><span class="t">Beyond the PDF (standard textbook knowledge)</span>The PDF only introduces HTTP. The extras below are commonly asked in exams.</div>
<h3>Typical request &amp; response</h3>
<pre>GET /index.html HTTP/1.1          &lt;- request line
Host: www.cs.washington.edu       &lt;- header
                                   &lt;- blank line

HTTP/1.1 200 OK                   &lt;- status line
Content-Type: text/html           &lt;- tells browser the MIME type
Content-Length: 2048

&lt;html&gt; ... &lt;/html&gt;                &lt;- body</pre>
<div class="tw"><table>
<tr><th>Common methods</th><th>Use</th></tr>
<tr><td>GET</td><td>Read a page</td></tr><tr><td>HEAD</td><td>Read only the header</td></tr><tr><td>POST</td><td>Append / submit data (forms)</td></tr><tr><td>PUT</td><td>Store a page</td></tr><tr><td>DELETE</td><td>Remove a page</td></tr>
</table></div>
<div class="tw"><table>
<tr><th>Status code</th><th>Meaning</th></tr>
<tr><td>1xx</td><td>Informational</td></tr><tr><td>2xx (200 OK)</td><td>Success</td></tr><tr><td>3xx (301 Moved)</td><td>Redirection</td></tr><tr><td>4xx (404 Not Found)</td><td>Client error</td></tr><tr><td>5xx (500)</td><td>Server error</td></tr>
</table></div>
</div></details>

<details class="topic" open><summary>Cookies <span class="fire">🔥</span></summary><div class="topic-body">
<p>When a client requests a page, the server may supply a <b>cookie</b> – a small named string (<b>at most 4 KB</b>) associated with the browser. Used to <b>track users and preferences</b> for a customised feel. Stored in a cookie directory on the client's disk so they persist across browser sessions (unless cookies are disabled).</p>
<div class="tw"><table>
<tr><th>Field</th><th>Meaning</th></tr>
<tr><td><b>Domain</b></td><td>Where the cookie came from (browsers verify servers aren't lying).</td></tr>
<tr><td><b>Path</b></td><td>Part of the server's file tree allowed to use the cookie; often <code>/</code> = whole tree.</td></tr>
<tr><td><b>Content</b></td><td><code>name = value</code> – anything the server wants.</td></tr>
<tr><td><b>Expires</b></td><td>When it expires (in GMT). Absent ⇒ <b>nonpersistent</b> (discarded when browser exits). Given ⇒ <b>persistent</b> (kept until expiry).</td></tr>
<tr><td><b>Secure</b></td><td>(Fifth field in the textbook) – send only over a secure connection.</td></tr>
</table></div>
<div class="callout ex"><span class="t">Deleting a cookie</span>Server sends the same cookie again with an expiration time <b>in the past</b>.</div>
<div class="callout warn"><span class="t">Check your syllabus</span>The slides list "up to five fields" but name only four (Domain, Path, Content, Expires). The fifth in Tanenbaum is <b>Secure</b>.</div>
</div></details>

http://www.phdcomics.com/comics.php

Protocol   Server          Page on server</pre>

<details class="topic" open><summary>HTTP in more depth <span class="fire">🔥</span></summary><div class="topic-body">
<div class="callout note"><span class="t">Beyond the PDF (standard textbook knowledge)</span>The slides only say HTTP is a text-based request-response protocol over TCP. The points below are commonly asked in exams.</div>
<div class="grid2">
<div><h4>Non-persistent HTTP (HTTP/1.0)</h4><ul><li>New TCP connection for <b>each</b> object.</li><li>Costs: connection setup + 1 RTT per object.</li><li>Page with 1 HTML + 10 images = 11 connections.</li></ul></div>
<div class="g"><h4>Persistent HTTP (HTTP/1.1 default)</h4><ul><li>Connection stays open for several requests.</li><li>Saves repeated TCP set-up/teardown.</li><li>Can <b>pipeline</b> requests.</li></ul></div>
</div>
<ul>
<li><b>HTTP is stateless</b> – the server keeps no memory of past requests; <b>cookies</b> add state.</li>
<li><b>Request line:</b> method + URL + version. <b>Common headers:</b> Host, User-Agent, Accept, Cookie. <b>Response headers:</b> Content-Type (MIME type), Content-Length, Set-Cookie, Date.</li>
<li><b>HTTPS</b> = HTTP over SSL/TLS (port 443).</li>
</ul>
</div></details>

</div></details>

<!-- ===== REVISION ===== -->
<details class="module" open id="revision">
<summary>Quick Revision &amp; Comparisons</summary>
<div class="module-body">
<details class="topic" open><summary>One-page cheat sheet <span class="fire">🔥</span></summary><div class="topic-body">
<div class="tw"><table>
<tr><th>Protocol</th><th>Key facts</th></tr>
<tr><td>FTP</td><td>2 connections: control (21, persistent) + data (20, per file). Out-of-band control. Modes: stream/block/compressed. Types: ASCII/EBCDIC/image.</td></tr>
<tr><td>SMTP</td><td>Push, TCP, ASCII. Ports 25/587/465. HELO/EHLO → MAIL FROM → RCPT TO → DATA → . → QUIT. Codes 220, 250, 354, 221, 550.</td></tr>
<tr><td>DNS</td><td>UDP 53. Hierarchical, distributed. 13 root servers. RR = (name, TTL, class, type, value). Recursive + iterative. Caching.</td></tr>
<tr><td>MIME</td><td>5 headers; Content-Type: type/subtype; supports non-ASCII &amp; multimedia.</td></tr>
<tr><td>SNMP</td><td>Manager/agent. UDP 161/162. SMI + MIB. 8 PDUs. BER = tag-length-value. OID 1.3.6.1.2.1 = mib-2.</td></tr>
<tr><td>HTTP/WWW</td><td>TCP 80. URL = protocol + DNS name + path. Static vs dynamic. Plug-in vs helper. Cookies ≤ 4 KB.</td></tr>
</table></div>
<h3>Key comparisons</h3>
<div class="grid2">
<div><h4>TCP-based</h4><p>FTP, SMTP, HTTP</p></div>

<li>Explain e-mail architecture, SMTP commands &amp; sample dialog.</li>
<li>Explain MIME headers and content types.</li>
<li>Explain SNMP: manager/agent, SMI, MIB, 8 PDUs.</li>
<li>Explain how a browser fetches a page (client side + server side), cookies.</li>

</ul></div>

<details class="topic" open><summary>Practice questions with short model answers <span class="fire">🔥</span></summary><div class="topic-body">
<div class="tw"><table>
<tr><th>Question</th><th>Model answer (key points)</th></tr>
<tr><td>Why does FTP use two connections?</td><td>Control (port 21, persistent, commands/replies) and data (port 20, per file, file contents) are separated: simpler rules for commands, efficient data transfer, control sent out-of-band.</td></tr>
<tr><td>Name the FTP transmission modes.</td><td>Stream (default), block (3-byte header: 1 descriptor + 2 size), compressed (run-length encoding).</td></tr>
<tr><td>Is SMTP a push or pull protocol? Which protocols pull?</td><td>Push. POP3 and IMAP pull mail from the server to the user agent.</td></tr>
<tr><td>List the SMTP commands in order for sending one message.</td><td>HELO/EHLO → MAIL FROM → RCPT TO → DATA → (body) . → QUIT, with replies 220, 250, 250, 250, 354, 250, 221.</td></tr>
<tr><td>Differentiate recursive and iterative resolution.</td><td>Recursive: contacted server resolves on the client's behalf and returns the final answer. Iterative: server returns the next server's address and the client repeats the query.</td></tr>
<tr><td>What are the five fields of a DNS resource record?</td><td>Domain name, Time to live, Class (IN), Type, Value.</td></tr>
<tr><td>Which RR gives the mail server of a domain?</td><td>MX (with priority; lowest number tried first).</td></tr>
<tr><td>What is the purpose of MIME?</td><td>To send multimedia and non-ASCII content through the text-only mail system using extra headers (MIME-Version, Content-Type, Content-Transfer-Encoding, Content-Id, Content-Description).</td></tr>
<tr><td>Explain Bcc.</td><td>Blind carbon copy – recipients listed in Bcc get the message but the line is removed from the copies sent to primary and secondary recipients.</td></tr>
<tr><td>Roles of SMI and MIB?</td><td>SMI defines rules for naming, typing and encoding (BER) objects; MIB defines the set of named objects and their types for a managed entity.</td></tr>
<tr><td>Which SNMP PDU is sent by an agent without being asked?</td><td>Trap (to manager port 162).</td></tr>
<tr><td>What are the parts of a URL?</td><td>Protocol, host (DNS name), optional port, and path.</td></tr>
<tr><td>Plug-in vs helper application?</td><td>Plug-in runs inside the browser process; helper is a separate program/process that opens a scratch file.</td></tr>
<tr><td>Steps when you click a link?</td><td>Determine URL → DNS lookup → TCP connection to port 80 → HTTP request → server response → fetch embedded objects → display → release connection.</td></tr>
</table></div>

{id:'m3',t:'Module 3 · Network Layer',c:[

D('Four classic design issues for the network layer: (1) store-and-forward packet switching, (2) services offered to the transport layer, (3) implementation of connectionless service, (4) implementation of connection-oriented service.')+

['Services Provided to the Transport Layer &amp; How They Are Implemented',1,

U(['Two services are offered: <b>connectionless</b> service (used in the Internet) and <b>connection-oriented</b> service (used in ATM networks).'])+

D('Packets are injected into the subnet and routed <b>independently of each other</b> – no advance setup phase is required. These packets are called <b>datagrams</b> and the subnet is called a <b>datagram subnet</b>.')+
U(['Example: H1 sends a message to H2; the message is broken down into (say) 4 packets.','Each packet is routed based on the current entry in the router\'s routing table.','The <b>routing algorithm</b> is the algorithm that manages these tables and makes the routing decisions – different packets of the same message may even take different routes if the table changes mid-stream.'])+

Q('Give two real-world examples matching each subnet type.','Datagram subnet: the Internet (IP) — every IP packet is routed hop-by-hop independently. Virtual-circuit subnet: traditional ATM networks and MPLS — a path is set up once and every packet reuses the same short label.')],
