D('Dijkstra\'s algorithm finds the shortest path between a source and <b>all</b> destinations in the network. Initially every node is labelled with infinity and all labels are <i>tentative</i>; the source node is set to 0. As the algorithm proceeds, nodes are labelled with their distance from the source along the best known path. When a label represents the truly shortest possible path from the source, it is made <b>permanent</b>.')+
H('Principle')+U(['Every router knows the <b>complete network topology</b> (this is what link-state routing provides it with).','Each link has a <b>cost</b> (weight) – could be hop count, distance, delay, bandwidth or money.','The router computes the <b>shortest-path tree</b> with itself as the root.','The routing table is created from this shortest-path tree.'])+
H('Steps (suppose the source router is A)')+P('1. Assign a distance of 0 to the source node.\n2. Assign ∞ (infinity) to all other nodes.\n3. Mark all nodes as unvisited.\n4. Select the unvisited node with the smallest tentative distance.\n5. Update the distances of all its neighbouring nodes:\n     New Distance = Current Distance + Link Cost\n   If the new distance is smaller than the existing one, update it.\n6. Mark the selected node as visited (its distance is now permanent).\n7. Repeat steps 4–6 until all nodes are visited.')+
dj+
E('Links: A-B=2, A-C=5, B-C=1, B-D=4, C-D=1. Source A.'+T([['Step','Pick (permanent)','B','C','D'],['0','A','2','5','∞'],['1','B(2)','2','3 (via B)','6'],['2','C(3)','2','3','4 (via C)'],['3','D(4)','2','3','4']])+'A→D shortest path = A-B-C-D, cost 4.')+
G('<h5>Advantages</h5>'+U(['Guaranteed correct shortest paths with non-negative weights','Produces the whole shortest-path tree in one run']),'<h5>Disadvantages</h5>'+U(['It is a <b>blind/greedy search</b> – wastes time because it computes the shortest path to <i>every</i> node even if only one destination is needed.','<b>Cannot handle negative edges</b> – it constructs an acyclic shortest-path tree, which is only correct when all edge weights are non-negative.','Needs to keep track of which vertices have already been visited.']))+
Q('How do I solve a Dijkstra question step by step in the exam?','Draw a table with one column per node; start the source at 0 and everything else at ∞; at each step pick the smallest unvisited (tentative) label, relax (update) its neighbours using New = Current + Link Cost, mark it permanent, and repeat until every node is permanent. Finally trace back through the predecessors to list the shortest path.')],
['Flooding – Working Principle, Controlled vs Uncontrolled, Problems &amp; Control Techniques',1,
D('<b>Flooding</b> is a routing algorithm in which every incoming packet is forwarded through <b>all outgoing links except the one on which it arrived</b>. Unlike other routing algorithms, flooding does not require a routing table or any knowledge of network topology – it simply sends copies of the packet in every possible direction, guaranteeing that at least one copy reaches the destination if any path exists.')+
H('Uncontrolled vs Controlled flooding')+T([['Uncontrolled flooding','Controlled flooding'],['Every incoming packet is sent out on <b>every</b> outgoing line except the one it arrived on, with no restriction','Flooding is done with certain <b>control measures</b> applied (TTL/hop-count, sequence numbers, selective flooding) to limit the damage']])+
H('Problems caused by flooding')+U(['Since every router forwards to all neighbours, the network may generate <b>multiple copies</b> of the same packet.','<b>Excessive bandwidth usage</b> – wasteful since the packet is delivered to every node even though only one destination needs it.','<b>Network congestion</b> from the flood of duplicates.','<b>Infinite looping</b> of packets in networks that contain cycles, unless checked.'])+
H('Techniques to control flooding')+U(['<b>1. Hop count (TTL – Time To Live):</b> each packet carries a hop-count value, decreased by 1 at every router; when it reaches 0 the packet is discarded. Example: Initial TTL = 4 → A(4) → B(3) → C(2) → D(1) → Discard(0).','<b>2. Sequence numbers:</b> each packet carries a unique sequence number; every router keeps a list of packets it has already seen; a duplicate that arrives is discarded instead of being forwarded again – this reduces duplicate transmissions.','<b>3. Selective flooding:</b> instead of forwarding through all outgoing links, a router forwards only through the links that are likely to lead toward the destination, significantly cutting unnecessary traffic.'])+
G('<h5>Advantages</h5>'+U(['Very simple to implement','No routing tables required','Ensures a packet is delivered to every node – effective for broadcasting','Tremendously robust: guarantees delivery if a path exists and the network is connected','Robust against router/link failures since multiple paths are explored in parallel','Easy to set up – routers only need to know their neighbours','Always finds the shortest path, because it explores every possible path in parallel; can be used as a metric for comparison']),'<h5>Disadvantages</h5>'+U(['Generates an enormous number of duplicate packets unless damped','Wastes bandwidth – delivers data to all nodes even if only one destination needs it','Can clog the network with duplicate/unwanted packets, hampering other traffic']))+
E('Numerical: TTL starts at 3, and each router has 3 neighbours on average. Packet copies in flood ≈ 3 + 9 + 27 = 39 for just a 3-hop flood — illustrating why uncontrolled flooding is so bandwidth-heavy.')+
Q('Why is flooding still used anywhere if it is so wasteful?','It is extremely robust and needs no topology knowledge, so it is used for broadcasting routing-update packets themselves (e.g. flooding link-state packets) and in highly dynamic / military networks where paths may be destroyed at any moment.')],
['Inter-Domain and Intra-Domain Routing',1,
D('The Internet is divided into <b>autonomous systems (AS)</b>. An AS is a group of networks and routers that are under the authority of a <b>single administration</b> (e.g. a university, an ISP, a large company).')+
U(['<b>Intra-domain routing</b>: routing <i>inside</i> one autonomous system — the AS\'s own administration chooses the protocol freely.','<b>Inter-domain routing</b>: routing <i>between</i> different autonomous systems — needs a common, standardized protocol so unrelated organizations can exchange routes.'])+
H('Routing protocols used in each')+T([['Scope','Typical protocols','Routing type'],['Intra-domain (interior gateway)','RIP (distance vector), OSPF (link state)','Distance vector or link state'],['Inter-domain (exterior gateway)','BGP (Border Gateway Protocol)','Path-vector routing']])+
N('BGP (inter-domain) cares about policy — which AS a route passes through — more than pure shortest distance, since different organizations may have business agreements about whose traffic they will carry.')+
Q('Why can\'t the whole Internet just run one routing protocol end to end?','Scale and autonomy: no single algorithm could keep a table for billions of hosts, and every AS wants control over its own internal routing policy while still exchanging just enough summary information with the outside world — hence two tiers of routing.')],
['Distance Vector Routing (RIP) &amp; the Bellman-Ford Algorithm',1,
D('<b>Distance Vector Routing</b> is a dynamic routing algorithm, also known as the <b>Bellman-Ford</b> routing algorithm (or Ford-Fulkerson algorithm). It is used in the Internet under the name <b>Routing Information Protocol (RIP)</b>.')+
U(['Each router maintains a routing table with one entry for each router in the network.','Each entry keeps three pieces of information: the <b>destination router</b>, the <b>distance/cost</b> (hop count or another metric), and the <b>next hop</b> (preferred outgoing line).'])+
H('Working')+U(['Every router knows the distance to each of its immediate neighbours.','Each router builds a list (vector) of distances to all other nodes and <b>distributes this to its immediate neighbours</b> at regular intervals.','A router receives this vector from all its neighbours and <b>updates its own table</b>.','After updating, it sends the result onward to its own neighbours, so the information propagates.'])+
H('Bellman-Ford principle')+P('If every neighbour of node i knows the shortest distance to node j, then:\n  shortest distance(i, j) = min over all neighbours k of\n        [ cost(i, k) + shortest distance(k, j) ]')+
H('Steps')+U(['<b>Initialization:</b> each node knows the distance to itself (0) and to its immediate neighbours only; everything else starts at ∞.','<b>Sharing:</b> nodes share their routing table with immediate neighbours periodically (classic period ≈30 s) or when there is a change (triggered update).','<b>Updating:</b> use the new information to replace the infinity (or stale) values — see the rule below.'])+
H('Updating the routing table')+U(['<b>If the new route\'s next hop is different</b> from the current one: calculate the new cost through that neighbour. If it is smaller than the current cost, update the route; if equal, keep the existing route; if the destination isn\'t in the table yet, add it.','<b>If the next hop is the same</b> as the one already in the table: the existing route <i>depends</i> on this neighbour, so accept the new information and update the cost <i>even if it is worse (even ∞)</i> — this is how a router detects that a route has become unreachable.'])+
dvrG+
E('Worked example (from the slides): links A-B=5, A-C=2, A-D=3, C-B=4, C-E=4, B-E=3. After initialization each router only knows its direct neighbours (e.g. A\'s table: B=5, C=2, D=3, E=∞). After rounds of exchange the tables converge — A\'s final table becomes B=5 (direct), C=2 (direct), D=3 (direct), <b>E=6 via C</b> (because A-C=2 plus C-E=4 beats any other combination). Similarly D\'s table learns B=8 via A, C=5 via A and E=9 via A, since D only connects directly to A.')+
H('When to share')+T([['Periodic update','Triggered update'],['A node sends its routing table normally every 30 s (the exact period depends on the protocol in use)','A node sends its routing table to its neighbours immediately whenever there is a change in its own table']])+
Q('In the worked example, why is A\'s cost to E exactly 6, not 5 or 4?','A has no direct link to E. The only routes are A-C-E (2+4=6) and A-B-E (5+3=8); Bellman-Ford picks the minimum, 6, via next-hop C.')],
['Count-to-Infinity Problem &amp; Its Solutions',1,
D('Distance vector routing <b>reacts rapidly to good news</b> (a shorter route) but <b>reacts very slowly to bad news</b> (a route becoming worse or unreachable) — this is the <b>count-to-infinity</b> problem.')+
U(['An increase in cost (e.g. a link failure) propagates <b>slowly</b> through the network because routers keep believing stale information from each other.','This is also called the <b>two-node instability</b> problem.','<b>Convergence</b> = the settling of all routes to the best path across the network; distance vector converges to the correct answer slowly, especially after a failure.'])+
E('Numerical: A-B cost 1, B-C cost 1 (so A\'s cost to C is 2, next-hop B). Now the B-C link fails. If B still hears A say "I can reach C in 2 hops" (because A learned it from B before the failure and hasn\'t updated yet), B recomputes its own cost to C as 1(to A)+2 = 3. Then A hears B\'s new value 3, updates to 4, and so on — the count creeps up slowly instead of immediately recognising C as unreachable.')+
H('Solutions')+U(['<b>Defining infinity:</b> most implementations define <b>16</b> as infinity, so a route is declared dead once the hop count reaches 16 — but this caps RIP to a maximum of <b>15 usable hops</b>, so DVR/RIP cannot be used in very large networks.','<b>Split horizon:</b> instead of sending the whole table out every interface, a node sends only part of its table through each interface — specifically, it never advertises a route back out the interface it learned that route from. This stops some false confirmations.','<b>Split horizon with poison reverse:</b> goes further — the node still advertises the route back the way it came, but marks its cost as infinity, actively warning the neighbour that the route came from them and should not be trusted back.'])+
W('Split horizon alone handles two-node loops; it does not fully solve loops that involve three or more nodes.')],
['Link State Routing – Building and Distributing Link State Packets',1,
D('If every node in the domain has information about the <b>entire topology</b> of the domain — the list of nodes, links, how they are connected, their type, cost, and condition — then Dijkstra\'s algorithm can be used directly to build the routing table. Since the topology is dynamic, a partial, continuously refreshed knowledge of it is kept at every node — this is called <b>link-state knowledge</b>, built from <b>Link State Packets (LSPs)</b>.')+
H('5 steps of Link State Routing')+U(['<b>1. Discover neighbours &amp; learn their addresses</b> — send a <b>HELLO</b> packet on each link; the neighbour replies, confirming it is alive and giving its identity.','<b>2. Measure the cost/delay to each neighbour</b> — send an <b>ECHO</b> packet and measure the round-trip time; the line cost = RTT ÷ 2. (Two options for starting the timer: when the ECHO packet is queued — which factors in load — or when it reaches the front of the queue — which ignores load.)','<b>3. Build the link-state packet (LSP)</b> — containing the sender\'s id, a <b>sequence number</b>, an <b>age</b> field, and the list of neighbours with the cost to each. Built either periodically or when a significant event occurs (e.g. a link goes up/down).','<b>4. Distribute the LSPs to all other routers</b> — described in detail below.','<b>5. Compute the new routes</b> — once a router has the full set of LSPs (i.e. the whole topology), it runs <b>Dijkstra\'s algorithm</b> to find the shortest path to every destination, then builds its routing table from that.'])+
H('Distributing the Link State Packets (step 4 in detail)')+U(['<b>Flooding</b> is used to disseminate LSPs.','A node sends its own LSP out on all its directly connected links.','Each node that <i>receives</i> an LSP checks whether it already has a copy of that LSP (same sender).','If it does <b>not</b> have a copy, it stores it and forwards it out on all its own links.','If it <b>already</b> has a copy, it compares the <b>sequence number (SEQNO)</b>: if the new LSP has a <i>larger</i> SEQNO, it is more recent — so it is stored and re-flooded; if the new LSP has a <i>smaller or equal</i> SEQNO, it is discarded (it is stale or a duplicate).'])+
H('Computing the new routes')+U(['Once a router has collected the full set of LSPs from every other router, it constructs the complete routing table.','Dijkstra\'s algorithm is run to find the shortest path to all destinations.','The resulting shortest-path tree becomes the routing table.'])+
H('Distance Vector vs Link State')+T([['','Distance Vector','Link State'],['Knowledge used','Only neighbours\' vectors','Entire network topology'],['Shares with','Neighbours only','All routers (via flooding)'],['Underlying algorithm','Bellman-Ford','Dijkstra'],['Convergence speed','Slow, count-to-infinity possible','Fast, loop-free'],['Resources needed','Low CPU/memory','More memory &amp; CPU'],['Example protocol','RIP','OSPF']])+
N('Limitations of link state routing: needs more memory/CPU than DVR, needs a hierarchical design (areas, as in OSPF) for very large networks, needs skilled administration, and causes a flood of LSPs at start-up.')+
E('Numerical: link costs are measured as RTT/2. If a HELLO+ECHO round trip measures 8 ms, the cost assigned to that link = 4 ms, and that value is used directly as the edge weight in Dijkstra\'s computation.')+
Q('Why does a link-state router need a sequence number but a distance-vector router does not share one?','Link state floods the same LSP across the whole network from multiple directions, so routers need the sequence number to tell a newer LSP from an old duplicate and avoid flooding forever; distance vector never floods — it only exchanges with direct neighbours — so this problem doesn\'t arise the same way.')],
['Bellman-Ford vs Dijkstra – Comparison',1,
T([['Parameter','Bellman-Ford','Dijkstra'],['Overheads','More','Less'],['Scalability','Less','More'],['Quality of the best available route','Less','More'],['Negative edges allowed?','Yes','No'],['Delay','More','Less']])+
N('This is the exact comparison table given in the slides. Bellman-Ford (used in Distance Vector/RIP) is simpler to run per-neighbour but converges slowly and tolerates negative weights; Dijkstra (used in Link State/OSPF) needs full topology knowledge up front but converges fast and gives better-quality routes — at the cost of never working correctly with negative edges.')+
Q('Which algorithm would you use on a network with a negative-cost link (e.g. representing an incentive/subsidy)?','Bellman-Ford — Dijkstra\'s greedy, make-permanent-once approach breaks down with negative edges, while Bellman-Ford\'s repeated relaxation can still converge correctly (as long as there is no negative cycle).')],
['Design Principles for the Internet (RFC 1958)',0,
D('The principles that drove the design of the network layer made it a success. They are enumerated in <b>RFC 1958</b>, considered mandatory learning for all protocol designers.')+
U(['<b>1. Make sure it works</b> — do not finalize a design or standard until multiple prototypes have successfully communicated with each other.','<b>2. Keep it simple</b> — when in doubt, use the simplest solution; if a feature isn\'t essential, leave it out, especially if the same effect can be achieved by combining other features.','<b>3. Make clear choices</b> — if there are several ways to do the same thing, choose one; having two or more ways invites trouble.','<b>4. Exploit modularity</b> — leads to protocol stacks, where each layer is independent of the others, so changing one layer doesn\'t force changes elsewhere.','<b>5. Expect heterogeneity</b> — different hardware, transmission facilities and applications will occur on any network, so the design must stay simple, general and flexible.','<b>6. Avoid static options and parameters</b> — if parameters are unavoidable (e.g. max packet size), it\'s best to let sender and receiver negotiate a value rather than fix it.','<b>7. Look for a good design; it need not be perfect</b> — a good design that can\'t handle some weird special case shouldn\'t be redesigned around that case; put the burden on whoever has the strange requirement.','<b>8. Be strict when sending and tolerant when receiving</b> — only send packets that rigorously comply with the standard, but accept and try to handle incoming packets that may not be fully conformant.','<b>9. Think about scalability</b> — the system should be designed to handle millions of hosts and billions of users.','<b>10. Consider performance and cost</b> — the overall goal is a design that is both efficient and economical to deploy at Internet scale.'])+
Q('Give one real-world example of "be strict when sending, tolerant when receiving".','Many web servers and browsers accept slightly malformed HTML or HTTP headers from the other side even though they would never generate such malformed output themselves — this keeps the Internet working despite imperfect implementations.')],
['The IP Protocol – Brief Overview',1,
D('The <b>Internet Protocol (IP)</b> defines and enables internetworking at the internet layer of the Internet Protocol Suite — in essence, it forms the Internet. It uses a <b>logical addressing</b> system and performs <b>routing</b> — forwarding packets from a source host to the next router that is one hop closer to the destination host on another network.')+
U(['<b>IPv4 is connectionless</b> and operates on a <b>best-effort delivery model</b>: it does not guarantee delivery, nor does it assure proper sequencing or avoidance of duplicate delivery.','These missing guarantees (reliability, ordering, data integrity) are provided instead by an <b>upper-layer transport protocol</b>, such as TCP.'])+
Q('If IP itself gives no guarantees, why does the Internet feel reliable?','Because TCP sits on top of IP and adds the guarantees IP lacks — sequencing, acknowledgment, retransmission — so an unreliable network layer plus a reliable transport layer together deliver a reliable service to the application.')],
['IPv4 Datagram, Header Fields &amp; Addressing',1,
U(['An IPv4 datagram consists of a <b>header</b> part and a <b>body/payload</b> part.','The header has a <b>20-byte fixed part</b> and a <b>variable-length optional part</b>.','It is transmitted in <b>big-endian order</b> — left to right, top to bottom, with the high-order bit of the Version field going first.'])+
hdr4+
H('Header fields explained')+T([['Field','Size','Meaning'],['Version','4 bits','Which IP version the datagram belongs to (4 here); IPv5 was an experimental real-time stream protocol never widely used'],['IHL','4 bits','Header length in 32-bit words; min 5 (no options), max 15 (60-byte header, 40 bytes of options)'],['DiffServ / old ToS','8 bits','Distinguishes classes of service (e.g. real-time voice wants low delay, file transfer wants error-free delivery); originally a 3-bit Precedence field plus D/T/R flags for {Delay, Throughput, Reliability}'],['Total length','16 bits','Header + data, max 65,535 bytes (2¹⁶)'],['Identification','16 bits','Lets the destination know which datagram a newly arrived fragment belongs to — all fragments of one datagram share this value'],['DF (Don\'t Fragment)','1 bit','Instructs routers not to fragment; forces the datagram to avoid small-MTU networks, possibly taking a suboptimal route'],['MF (More Fragments)','1 bit','Set on every fragment except the last one'],['Fragment offset','13 bits','Where in the original datagram this fragment belongs, in units of 8 bytes; max 8192 fragments per datagram'],['TTL (Time To Live)','8 bits','A hop counter; decremented at each router; when it hits 0 the packet is discarded and a warning sent to the source — prevents packets wandering forever'],['Protocol','8 bits','Tells the network layer which transport-layer protocol to hand the payload to (TCP=6, UDP=17, ICMP=1); numbered globally via IANA'],['Header checksum','16 bits','Detects errors in the header only; one\'s-complement sum of all 16-bit halfwords, recomputed at every hop since TTL always changes'],['Source / Destination address','32 bits each','IPv4 address of the source and destination']])+
E('Numerical – fragmentation: a 4000-byte datagram (20-byte header + 3980 data bytes) must cross a link with MTU 1500. Max data per fragment = 1480 bytes (must be a multiple of 8). The three fragments carry 1480+1480+1020 data bytes, with Fragment Offset 0, 185 (=1480/8) and 370 (=2960/8); MF = 1,1,0.')+
H('IPv4 Addressing')+U(['An IPv4 address is <b>32 bits</b>, giving an address space of 2³² ≈ 4.29 billion addresses.','It is written in <b>dotted-decimal notation</b>: four decimal octets (0–255) separated by dots — easy and compact to manage; it can also be written in binary (32 bits), which is time-consuming and error-prone.','An IP address does not just name a host — it really names a <b>network interface</b>. If a host is on two networks, it needs two IP addresses. Most hosts sit on one network (one address); routers have multiple interfaces and thus multiple addresses.','An address <b>uniquely and universally</b> defines the connection of a device to the Internet.'])+
E('C22F1582 (hex) = 1100 0010.0010 1111.0001 0101.1000 0010 = <b>194.47.21.130</b>')+
Q('Why must the header checksum be recomputed at every router, not just at the source?','Because the TTL field changes at every hop (decremented by 1), the checksum — which covers the whole header — is no longer valid unless recalculated each time.')],
['IPv4 Header Options: Source Routing, Record Route, Timestamp &amp; Security',0,
D('The <b>Options field</b> is of variable length. Each option begins with a 1-byte code identifying it; some are followed by a 1-byte option-length field and then data bytes. The field is padded to a multiple of 4 bytes. It was designed as an escape hatch — to let future protocol versions include information not present in the original design, let experimenters try new ideas, and avoid allocating fixed header bits to rarely-needed information. In practice, IP options are rarely used today.')+
U(['<b>Strict Source Routing</b> — the sender specifies the <i>complete</i> path from source to destination as a sequence of IP addresses; the datagram is required to follow that exact route. Most useful for system managers sending emergency packets when routing tables are corrupted, or for making timing measurements.','<b>Loose Source Routing</b> — requires the packet to traverse the listed routers, in the order specified, but it is allowed to pass through other routers along the way too. Normally only a few routers are given, to force a particular general path (e.g. forcing a packet from X to Y to go west instead of east). Most useful when political or economic considerations dictate passing through — or avoiding — certain countries.','<b>Security option</b> — tells how secret the information is. In theory a military router could use this to avoid routing through countries it considers hostile; in practice, all routers ignore it (and it mostly just helps spies find the interesting traffic more easily).','<b>Record Route option</b> — tells every router along the path to append its own IP address to the option field, letting system managers track down bugs in routing algorithms. When the ARPANET was first built, no packet ever passed through more than 9 routers, so 40 bytes of option space was enough — today it is far too small.','<b>Timestamp option</b> — similar to Record Route, except that in addition to recording its 32-bit IP address, each router also records a 32-bit timestamp. Mostly used for debugging routing algorithms.'])+
Q('Why are IP options rarely used today, if they sound useful for debugging?','They add processing overhead at every router (which must parse variable-length options instead of a fixed header), many routers and firewalls simply drop or ignore packets carrying them for performance and security reasons, and tools like <code>traceroute</code> achieve the same path-discovery goal using TTL and ICMP instead.')],
['Classful Addressing',1,
D('The original IP addressing scheme, called <b>classful addressing</b>, divides the address space into five classes — A, B, C, D and E. It is now <b>obsolete</b>, replaced by classless addressing, but still core exam material.')+
cls+
H('Finding the class of an address')+U(['Examine the <b>first few bits</b> of the binary value, or equivalently the <b>first decimal octet</b>.'])+
H('Prefixes – Net ID and Host ID')+U(['An IP address is <b>hierarchical</b>: it has two parts, <b>NET ID</b> and <b>HOST ID</b>.','NET ID (prefix) is the initial bits identifying the network the host is attached to; all hosts on the same network (e.g. one Ethernet LAN) share the same prefix, so a network corresponds to a contiguous block of address space.','HOST ID (suffix) is the remaining bits identifying a unique host on that network.','Example: 141.14.192.2 → Network address = 141.14.0.0, Host address = 141.14.192.2 (for a class B address).'])+
H('Blocks in Class A, Class B, Class C &amp; restrictions')+T([['Class','Format','First address','Last address','Networks','Hosts/network'],['A','N.H.H.H','0.0.0.0','127.255.255.255','2⁷−2 = 126 (0 and 127 reserved)','2²⁴−2 = 16,777,214'],['B','N.N.H.H','128.0.0.0','191.255.255.255','2¹⁴ = 16,384','2¹⁶−2 = 65,534'],['C','N.N.N.H','192.0.0.0','223.255.255.255','2²¹ = 2,097,152','2⁸−2 = 254'],['D','Multicast','224.0.0.0','239.255.255.255','–','2²⁸ addresses, not assigned to orgs'],['E','Experimental','240.0.0.0','255.255.255.255','–','2²⁸ addresses, reserved, not public']])+
U(['Class A: a <i>small</i> number of networks (~2⁷), each with a <i>huge</i> number of hosts (~2²⁴) — up to 128 networks, 16 million hosts each.','Class B: a <i>medium</i> number of networks (~2¹⁴), each with a medium number of hosts (~2¹⁶) — 16,384 networks, up to 64K hosts each.','Class C: a <i>large</i> number of networks (~2²¹), each with a <i>small</i> number of hosts (~2⁸) — 2 million networks, up to 256 hosts each.','Addresses are given out in <b>blocks</b>; the network address (first address in the block) is not assigned to any device, only to the organization as a whole — the full range is then inferred automatically from it.'])+
H('Why "−2" hosts?')+U(['The <b>first</b> address (all host bits 0) in any network is the <b>network address</b> itself — not assignable to a device.','The <b>last</b> address (all host bits 1) is the <b>directed broadcast address</b> for that network — also not assignable.','So with N host bits, only 2<sup>N</sup>−2 usable host addresses remain.'])+
H('Other restrictions on net/host IDs')+U(['0 cannot be used as a network id — an IP address with 0 as the network number means "this" (current) network.','Addresses starting with <b>127</b> (01111111) are reserved for <b>loopback</b>/internal testing — <code>ping 127.0.0.1</code> always points back to yourself.','A host-id part cannot be all 0s (means "this host", referring to the network itself) or all 1s (the directed broadcast, sends to all hosts on that network).'])+
H('Default Masks for the Classful Scheme (32 bits)')+U(['A <b>mask</b> can be used to compute the netid and hostid of a given address: it is a 32-bit number made of contiguous 1s followed by contiguous 0s.','Network bits are shown by the 1s in the mask; host bits by the 0s.','Written as /n (<i>slash notation</i>, also called CIDR notation), where n = number of 1s: Class A → /8 (255.0.0.0), Class B → /16 (255.255.0.0), Class C → /24 (255.255.255.0).'])+
H('Masking Process (finding the Network ID)')+P('Network ID = IP address  AND (bitwise)  default mask')+
E('Find the Net ID for 140.179.240.200 → first octet 140 is in 128–191, so Class B → apply mask 255.255.0.0:\n10001100.10110011.11110000.11001000\n11111111.11111111.00000000.00000000\n------------------------------------\n10001100.10110011.00000000.00000000  →  Network Address = 140.179.0.0')+
E('Given 201.20.30.40, find network id, 4th host id, last host id and broadcast id. First octet 201 is in 192–223 → Class C → mask 255.255.255.0 → AND gives network id <b>201.20.30.0</b>. Hosts range from .1 to .254 (since .0 is the netid), so the 4th host id = <b>201.20.30.4</b>, the last host id = <b>201.20.30.254</b>, and the broadcast (last) address = <b>201.20.30.255</b>.')+
W('Never apply the default mask of one class to an address belonging to another class — always identify the class first from the leading bits/first octet.')+
E('Numerical: total Class C networks and hosts. Net bits = 21 → 2²¹ = 2,097,152 networks; host bits = 8 → 2⁸−2 = 254 usable hosts per network.')+
Q('Class of 201.20.30.40; its network, first host, last host, broadcast?','Class C. Network 201.20.30.0, first host .1, last host .254, broadcast 201.20.30.255.')],
['Need for Classless Addressing &amp; Classless Addressing (CIDR)',1,
H('Need for classless addressing')+U(['Classful addressing has <b>limited flexibility</b> — the netid/hostid split is fixed at 8, 16 or 24 bits only.','The Internet grew fast while classful addressing wasted millions of the nearly 4 billion (2³²) possible addresses, leading to <b>address depletion</b>.','Class A and B addresses ran out; a Class A (16 million addresses) was far too big for most organizations, Class B (65,536) was often "just right" but still wasted a lot, and Class C (256) was too small for most mid-size firms — this is the <b>"three bears problem"</b> in Internet folklore.','Problems: wastage of IP addresses, time-consuming maintenance, more prone to configuration errors.'])+
D('<b>Classless addressing (CIDR — Classless Inter-Domain Routing)</b>: addresses are allocated in variable-sized blocks, ignoring the old classes, to overcome address depletion and let more organizations access the Internet.')+
U(['No address classes — only <b>blocks</b>, whose size can vary (must be a power of 2) based on the size of the requesting organization.','A household may get only 2 addresses; a large organization may get thousands.','Addresses within a block must be <b>contiguous</b>.','Written as <code>a.b.c.d/n</code> where n = prefix length = number of network (1) bits; the remaining 32−n bits are host bits.'])+
E('192.0.2.0/18 → 18 is the prefix length, so the first 18 bits are the network address and the remaining 14 bits are available for host addresses.')+
E('A client needs 1000 addresses. Classful scheme: assign a Class B address → wastes 65,534−1000 = 64,534 addresses; or assign 4 Class Cs → introduces 4 new routes into the global routing tables. Classless: assign a <b>/22</b> block of 1024 (2¹⁰) addresses → far less wastage, one route.')+
H('Finding the Network ID in CIDR')+E('192.168.10.75/26 → /26 means mask 11111111.11111111.11111111.11000000 = 255.255.255.192.\n192.168.10.75  = 11000000.10101000.00001010.01001011\n255.255.255.192= 11111111.11111111.11111111.11000000\n--------------------------------------------------\nNetwork ID     = 192.168.10.64')+
E('172.16.35.75/20 → mask 255.255.240.0; block size 16 in the 3rd octet; 35 → largest multiple of 16 ≤ 35 is 32. Network ID = <b>172.16.32.0</b>.')+
E('10.15.200.9/12 → prefix 12 falls in the 2nd octet, mask octet = 240, block = 16. Octet-2 value 15 → largest multiple of 16 ≤ 15 is 0. Network = <b>10.0.0.0/12</b>, range 10.0.0.0–10.15.255.255.')+
G('<h5>Advantages</h5>'+U(['Less address wastage, flexible block sizes','Route aggregation (supernetting) — backbone ISPs get one large block and sub-allocate to customers','Fewer entries needed in global routing tables']),'<h5>Disadvantages</h5>'+U(['Address-matching at routers becomes complicated — multiple table entries with different prefix lengths can match the same address (e.g. 190.23.8.0/21 and 190.23.0.0/16 both match 190.23.8.1); routers must use <b>longest-prefix match</b>','No fixed network sizes — admins must work with arbitrary prefixes like /19, /21, /26 and compute network id/broadcast/host range carefully','Needs CIDR-aware routers/protocols — older classful-only routing protocols and devices may not handle it']))+
Q('Given two matching table entries 190.23.8.0/21 and 190.23.0.0/16 for address 190.23.8.1, which route wins?','The <b>longest prefix match</b> wins — 190.23.8.0/21, because /21 is more specific than /16.')],
['Subnets &amp; Subnet Masks',1,
D('<b>Subnetting</b> allows one network to be split into several smaller parts (subnets) for internal use, while the network as a whole still looks like a single network to the outside world — i.e. the same network prefix is shared by multiple physical networks internally. This split need not be even.')+
E('Scenario: a university started with one Class B address for the CS department. A year later, Electrical and Art departments also want to join, and more follow. Getting a fresh block per department is hard (addresses are scarce/expensive) and the Class B already has room for 60,000+ hosts — so the university subnets its one Class B network instead of requesting new blocks, and the main router forwards packets to the correct subnet without needing a giant host-by-host table.')+
H('Hierarchical addressing – 3 levels')+U(['The 32-bit address is subdivided into <b>network id</b>, <b>subnet id</b>, and <b>host id</b> (analogous to a telephone number: country code + area code + local number).','<b>Default masking</b> extracts the netid; <b>subnet masking</b> extracts the subnet id too — each subnet effectively gets its own mask.','Subnetting <i>increases</i> the number of 1s in the mask beyond the classful default; how many extra bits depends on the number of subnets needed (e.g. 8 subnets = 2³ → 3 extra bits).'])+
sub+
H('Routing with subnets')+U(['A packet to host 128.10.1.2 reaches router R; the address is Class B, default mask /16, so 128.10 is the netid and 1.2 is the host.','When it arrives at R, the interpretation changes — R knows the network 128.10 is physically divided into subnets, so it masks with the <b>subnet</b> mask to find the matching subnet id and forwards the packet to that subnet alone.'])+
H('Exam recipe: subnet a network for N subnets')+U(['1. Bits needed b = ⌈log₂ N⌉.','2. New prefix = default classful prefix + b.','3. Write the new mask; block size = 256 − mask-octet value.','4. List subnets by repeatedly adding the block size; each subnet\'s usable range = network+1 … broadcast−1.'])+
E('Example 1 — 192.168.10.0/25: Class C → default mask 255.255.255.0 (24 ones). CIDR value 25 means 25 network bits, but Class C gives only 24, so <b>1 bit is borrowed</b> from the host part. New mask = 255.255.255.128. Subnets created = 2¹ = <b>2</b> (192.168.10.0 and 192.168.10.128). Addresses per subnet = 128; usable hosts per subnet = 126.')+
E('Example 2 — 192.168.10.0/28: Class C default mask 255.255.255.0 (24 ones). CIDR value 28 means <b>4 bits borrowed</b> from the host part. New mask = 255.255.255.240. Subnets created = 2⁴ = <b>16</b>; addresses per subnet = 16; usable hosts per subnet = 14. Subnets begin at .0, .16, .32, .48 … .240.')+
E('Example 3 — a university has a Class B address and needs 45 department subnets: 6 subnet bits give 2⁶ = 64 subnets (≥45, enough with room to grow), leaving 10 host bits → 2¹⁰−2 = 1022 usable hosts per department.')+
H('Supernetting')+D('<b>Supernetting</b> is the reverse of subnetting — it combines several contiguous smaller blocks into one larger block (route aggregation under CIDR), reducing the number of routes an ISP needs to advertise.')+
E('Four contiguous /24 blocks 200.1.0.0–200.1.3.0 aggregate into one <b>200.1.0.0/22</b> (2²=4 blocks). Condition: the blocks must be contiguous, their count must be a power of 2, and the first block\'s address must be exactly divisible by the combined block size.')+
E('An ISP has 172.16.0.0/24 through 172.16.7.0/24 (8 blocks, 8=2³) → supernetted to <b>172.16.0.0/21</b> (mask 255.255.248.0), advertised as one route instead of 8.')+
Q('Formula summary for subnetting numericals?','Subnets created = 2^(borrowed bits); Addresses/subnet = 2^(32−new prefix); Usable hosts = 2^(32−new prefix)−2; Block size = 256 − (mask value of the octet where the prefix ends).')],
['IPv6 (syllabus item)',0,
N('The lecture PDF only lists IPv6 in the syllabus slide and briefly mentions the IPv4→IPv6 transition; the points below are standard textbook content – verify against your class notes.')+
U(['<b>128-bit</b> addresses (2¹²⁸), written in hex groups: <code>2001:0db8:0000:0000:0000:ff00:0042:8329</code> → shortened to <code>2001:db8::ff00:42:8329</code>.','Fixed 40-byte header, no checksum, no router-side fragmentation (only the source may fragment).','Fields: version, traffic class, flow label, payload length, next header, hop limit, source, destination.','Built-in security (IPsec), auto-configuration, multicast/anycast support, no broadcast address type.'])+
Q('Why IPv6?','IPv4 address exhaustion; IPv6 also simplifies the header for faster router processing and improves QoS/security support.')],
['ICMP – Internet Control Message Protocol',1,
D('<b>ICMP</b> is IP\'s companion protocol: IP itself has no error-reporting or query mechanism, so ICMP messages are carried <i>inside</i> IP datagrams (protocol field = 1) to report problems and support diagnostics. Header is 8 bytes: Type, Code, Checksum, plus message-specific data.')+
T([['Error-reporting message','When sent'],['Destination unreachable','A router/host can\'t deliver the datagram; sent to the source'],['Source quench','A datagram had to be dropped due to congestion — tells the sender to slow down'],['Time exceeded','TTL hit 0 at a router, or reassembly timer expired at the destination'],['Parameter problem','A router or destination host finds an ambiguous/missing header field; can be created by a router or the destination host (Code 0: error in a field, pointer shows the byte; Code 1: a required option part is missing)'],['Redirection','A better route exists; updates the host\'s own routing table']])+
T([['Query pair','Use'],['Echo request / reply','Reachability test — <b>ping</b>'],['Timestamp request / reply','Round-trip time measurement / clock sync'],['Address-mask request / reply','Lets a host learn its own subnet mask'],['Router solicitation / advertisement','Lets a host discover routers on its network']])+
W('ICMP error messages are always reported back to the <b>original source</b>, one of ICMP\'s main responsibilities — never to an intermediate router. <code>traceroute</code> exploits this by sending packets with increasing TTLs and reading the "time exceeded" replies from each hop in turn.')+
E('Numerical: traceroute to a destination 5 hops away sends packets with TTL = 1, 2, 3, 4, 5 in turn. Each router along the way returns "time exceeded" until the TTL=5 packet finally reaches the destination and gets a normal reply — revealing all 5 hop addresses and their round-trip times.')],
['Logical Address &amp; Physical Address',1,
D('Delivery of a packet to a host or router requires <b>two levels of addressing</b>: logical and physical.')+
T([['Logical Address','Physical Address'],['A combination — an "Internet" of physical networks connected by routers; hosts and routers are recognized at the network level by their logical addresses','At the physical (data-link) level, hosts are recognized by their physical addresses — the local address'],['Logical addresses are the <b>IP addresses</b> — 32 bits long, unique <i>globally</i>','Physical address example: the 48-bit <b>MAC address</b> used on Ethernet, unique only within its own network segment']])+
Q('Why do we need both kinds of address at all?','Logical (IP) addresses give every host a globally unique, hierarchical identity so routing can scale across the whole Internet; physical (MAC) addresses are what the actual network hardware (NIC) understands and uses to deliver a frame on one physical link — ARP is the bridge between the two.')],
['ARP – Address Resolution Protocol (full explanation)',1,
D('Although every machine on the Internet has one (or more) IP addresses, these cannot actually be used to send a frame, because the <b>data link layer hardware does not understand IP addresses</b> — most hosts are attached to a LAN via an interface board (e.g. an Ethernet card) that only understands its own 48-bit <b>Ethernet (MAC) address</b>. Manufacturers request blocks of these addresses from a central authority so no two boards collide. <b>ARP</b> dynamically maps a known IP address to its corresponding MAC address on the same physical network — efficient and easy to maintain.')+
H('How a packet actually gets sent (the full story)')+U(['A user on host 1 wants to reach xyz@cs.uni.edu on host 2.','First, <b>DNS</b> resolves the name to an IP address, say 192.31.65.5.','The upper-layer software on host 1 builds a packet with 192.31.65.5 as the destination and hands it to the IP software.','IP sees the destination is on its own network — but it still needs the destination\'s <b>Ethernet address</b> to actually frame and send the packet.','<b>Weak solution:</b> a configuration file mapping IP→Ethernet addresses — error-prone and hard to keep updated for large organizations.','<b>Better solution (ARP):</b> broadcast a packet onto the LAN asking "Who owns IP address 192.31.65.5?" — every machine on that Ethernet receives it and checks its own IP address; only host 2 responds, with its Ethernet address (E2).'])+
H('ARP Requests and Replies — step by step')+arp+U(['Host A wants to resolve IP address I<sub>B</sub>.','Host A <b>broadcasts</b> a special ARP packet asking the host with IP I<sub>B</sub> to respond with its physical address P<sub>B</sub> — <b>all</b> hosts on the LAN receive the request.','Host B alone recognizes its own IP address.','Host B sends a <b>unicast</b> reply containing its physical address P<sub>B</sub>.','Host A now uses P<sub>B</sub> to send the actual IP packet directly to B.'])+
E('Named example from the slides: Argon (IP 128.143.137.144, MAC 00:a0:24:71:e4:44) broadcasts "What is the MAC address of 128.143.71.1?" Router137 (IP 128.143.137.1, MAC 00:e0:f9:23:a8:20) replies "The MAC address of 128.143.71.1 is 00:e0:f9:23:a8:20".')+
W('Address resolution is always restricted to a <b>single physical network</b> — one computer can resolve another only if both are attached to the same network; a host never ARPs directly for a computer on a remote network (it ARPs for its own router\'s MAC instead).')+
H('ARP Cache (Address Resolution Cache)')+U(['Broadcasting an ARP request for <i>every single packet</i> sent would be far too expensive.','Computers using ARP maintain a <b>cache</b> of recently learned IP-to-physical address bindings, used for successive lookups to reduce communication cost.','Before sending, a host always checks the cache first; only if the binding is missing does it broadcast a new ARP request.','Two communicating computers typically do one ARP request/response, then exchange many packets afterward without repeating ARP — so even a small cache is very worthwhile.'])+
H('ARP Packet Format')+P('Hardware type (16) | Protocol type (16) | HW addr len (8) | Proto addr len (8)\nOperation (16: 1=request, 2=reply)\nSender hardware (MAC) address (var.)\nSender protocol (IP) address (var.)\nTarget hardware (MAC) address (var.)\nTarget protocol (IP) address (var.)')+
U(['<b>Hardware type</b> (16 bits): type of network ARP is running on — Ethernet = 1.','<b>Protocol type</b> (16 bits): which protocol\'s address is being resolved — IPv4 = 0800h.','<b>Hardware length</b> (8 bits): length of the physical address in bytes — 6 for Ethernet.','<b>Protocol length</b> (8 bits): length of the logical address in bytes — 4 for IPv4.','<b>Operation</b> (16 bits): ARP request (1) or ARP reply (2).','<b>Sender hardware/protocol address</b>: the sender\'s own MAC and IP.','<b>Target hardware address</b>: in a <i>request</i>, this field is all 0s, since the sender doesn\'t know it yet; in the <i>reply</i>, it is filled in.'])+
H('Steps in the ARP process (full 7-step version)')+U(['1. The sender knows the target\'s IP address.','2. IP asks ARP to build a request message, filling in sender\'s physical and IP addresses and the target\'s IP address; the target physical-address field is all 0s.','3. The message is handed to the data link layer, which encapsulates it in a frame using the sender\'s physical address as source and the <b>broadcast</b> address as destination.','4. Every host or router on the LAN receives the frame because its destination is the broadcast address; all pass the ARP message up to their own ARP module, and every machine except the target silently drops it.','5. The target machine recognizes its own IP address and replies with an ARP reply message containing its physical address — this reply is <b>unicast</b>.','6. The original sender receives the reply and now knows the target\'s physical address.','7. The actual IP datagram carrying real data is now encapsulated in a frame and <b>unicast</b> to the destination.'])+
N('An ARP packet is itself encapsulated inside an Ethernet frame, exactly like any other network-layer payload.')+
Q('Why use an ARP cache at all instead of resolving fresh every time?','Broadcasting for every single packet would be hugely expensive in bandwidth and latency; caching gives fast repeat lookups, cuts broadcast traffic, and works well because most communication involves many packets per ARP resolution.')],
['RARP, BOOTP &amp; DHCP',1,
H('RARP – Reverse Address Resolution Protocol')+
D('RARP answers the opposite question to ARP: <b>given an Ethernet (MAC) address, what is the corresponding IP address?</b> This problem arises when a <b>diskless workstation</b> boots — it can read its own physical address off its network interface, but has no IP address yet, and normally needs to fetch its OS image from a remote file server.')+
U(['Source device generates and <b>broadcasts</b> a RARP request message on the local network.','Every local device processes the message; devices not configured as RARP servers simply ignore it.','A <b>RARP server</b> on the network generates a RARP reply, looking up the Ethernet address in its configuration file.','The RARP server sends the reply as a <b>unicast</b> message back to the requesting device.','The source device configures itself using the IP address supplied in the reply\'s Target protocol address field.'])+
G('<h5>Disadvantages of RARP</h5>'+U(['Broadcasting happens at the <b>data-link layer</b> using the all-1s limited broadcast — such broadcasts are <b>not forwarded by routers</b>, so a RARP server is needed on <i>every single</i> network/subnet','Gives only the IP address — no subnet mask, default gateway, DNS server, etc.','Cannot be used with dynamic IP assignment','Obsolete since 1985, replaced by BOOTP then DHCP']),'<h5>Evolution timeline</h5>'+U(['<b>RARP</b> — used until 1985, no longer used','<b>BOOTP</b> (BOOTstrap Protocol) — replaced RARP, used 1985–1993','<b>DHCP</b> — used since 1993, still used today']))+
H('BOOTP (Bootstrap Protocol)')+
D('BOOTP is a networking protocol used by network administrators to give each member of the network an IP address for participating with other devices, via a main BOOTP server. It runs during the bootstrap process when a computer is starting up (hence the name), and was originally intended for diskless systems.')+
U(['When a BOOTP client starts, it has no IP address, so it <b>broadcasts</b> a message (sent to 255.255.255.255) containing its MAC address — the <b>BOOTP request</b>.','The BOOTP server replies with the client\'s IP address, subnet mask and default gateway; the IP address and hostname of the BOOTP server itself; and the IP address of the server holding the boot image (loaded via <b>TFTP</b>) the client needs to load its OS.','Follows a client-server paradigm; needs only a single packet exchange (request/response); runs over <b>UDP and IP</b>.'])+
G('<h5>Issue with BOOTP</h5>'+U(['Requires <b>manual configuration</b> of tables mapping MAC address to IP address','When a new host joins a LAN it cannot use BOOTP until an administrator manually enters its (MAC, IP) pair into the server\'s configuration tables — tedious, error-prone','Assignment of addresses is <b>static</b>']),'<h5>Fix</h5>'+U(['BOOTP was extended and renamed <b>DHCP (Dynamic Host Configuration Protocol)</b> to eliminate the manual-configuration step','DHCP uses the same port numbers as BOOTP and can interoperate with BOOTP clients','DHCP adds <b>leasing</b> (temporary allocation) of addresses on top of BOOTP\'s approach']))+
H('DHCP – Dynamic Host Configuration Protocol')+
D('DHCP lets a computer obtain its IP address, subnet mask, default gateway and DNS server <b>automatically and dynamically</b> at startup — it is largely an extension of BOOTP and has replaced both RARP and BOOTP in most systems.')+
U(['Supports both <b>manual</b> (static reservation) and <b>automatic/dynamic</b> IP address assignment.','The DHCP server need not be on the same LAN as the requesting host; since broadcasts don\'t cross routers, a <b>DHCP relay agent</b> on each LAN forwards DISCOVER broadcasts as unicast to a (possibly distant) DHCP server.','Permits temporary Internet connections — important for mobile devices that move between networks.'])+
H('DORA process')+dhcp+P('Client ── DISCOVER (broadcast) ──────▶ Server\nClient ◀── OFFER (IP + lease) ────────── Server\nClient ── REQUEST (accept offer) ────────▶ Server\nClient ◀── ACK (confirmed) ───────────── Server')+
U(['When a computer boots, it broadcasts a <b>DHCP DISCOVER</b> packet to find its IP address.','The relay agent on its LAN captures broadcasts and forwards the DISCOVER as unicast to the DHCP server.','The server replies with a <b>DHCP OFFER</b> — "offering" an address to the client.','The client accepts with a <b>REQUEST</b>, and the server confirms with an <b>ACK</b>.'])+
H('DHCP Lease concept')+U(['Problem with automatic assignment: how long should an address be allocated? If a host leaves the network without returning its address, that address is permanently lost — over time, many addresses could be lost this way.','Solution: <b>leasing</b> — the server specifies a lease period when allocating the address.','Just before the lease expires, the host must ask the server for <b>renewal</b>; if it fails to ask, or the request is denied, the host may no longer use that address.','When a lease expires, the host can either hand over the address or renegotiate to extend the lease; DHCP grants <b>absolute control of leasing to the server</b>, which may normally approve renewal or deny it for administrative/technical reasons.'])+
T([['','RARP','BOOTP','DHCP'],['Layer used for broadcast','Data link','UDP/IP','UDP/IP'],['Gives','IP address only','IP, mask, gateway, boot file','IP, mask, gateway, DNS…'],['Assignment','Static table lookup','Static table lookup','Dynamic, with lease'],['Works across routers?','No','Yes (relay)','Yes (relay agent)']])+
E('Numerical: lease time = 24 h. The client sends a renewal REQUEST at 50% of the lease (T1 = 12 h); if there\'s no reply, it retries at 87.5% (T2 = 21 h); if still no reply, it must restart with a full DISCOVER before the 24 h mark, or lose the address.')+
Q('What happens when the lease expires without renewal?','The client either releases the address or must ask the DHCP server to extend it; the server normally approves lease extensions, but may deny them for administrative or technical reasons.')]
]},
{id:'m4',t:'Module 4 · Transport Layer',c:[
['Transport Service &amp; Services to Upper Layers',1,
D('The transport layer provides efficient, reliable, cost-effective <b>process-to-process</b> delivery to application processes, using a transport entity (in OS kernel / NIC / user process).')+
U(['Why separate from network layer? Network service is run by routers users can\'t control; transport adds reliability and gives programmers a standard set of primitives.','Services: process-to-process delivery, <b>ports</b>, encapsulation/decapsulation, multiplexing/demultiplexing, flow control, error control, congestion control, connectionless or connection-oriented service.','<b>Port</b> = 16-bit number (0–65535): well-known 0–1023 (HTTP 80, DNS 53, SMTP 25), registered 1024–49151, dynamic 49152+.','<b>Socket address = IP address + port number</b>.','Unit of data: <b>segment</b> (TCP) / <b>user datagram</b> (UDP) → inside a packet → inside a frame.'])+
enc+H('Transport service primitives')+T([['Primitive','Segment sent','Meaning'],['LISTEN','–','Server blocks, waits for a client'],['CONNECT','CONNECTION REQUEST','Client tries to connect'],['SEND','DATA','Send data'],['RECEIVE','–','Block until data arrives'],['DISCONNECT','DISCONNECT REQUEST','Release connection']])+
N('<b>Berkeley sockets</b> (4.2BSD, 1983) for TCP: SOCKET → BIND → LISTEN → ACCEPT (server) and SOCKET → CONNECT (client) → SEND/RECEIVE → CLOSE.')+
E('Numerical: a web server socket = 203.0.113.5:80. A client socket = 198.51.100.9:51000. The pair of sockets (source+dest IP and port) uniquely identifies this one TCP connection, even though the server\'s port 80 is shared by every client.')+Q('Difference between IP address and port?','IP identifies a host (node); port identifies a process on that host.')],
['UDP',1,
D('<b>UDP</b> = connectionless, unreliable, minimum-overhead transport protocol with process-to-process delivery. Fixed <b>8-byte header</b>.')+
T([['Field','Size'],['Source port','16 bits'],['Destination port','16 bits'],['Total length (header+data)','16 bits'],['Checksum (pseudo-header + header + data)','16 bits']])+
udph+U(['No connection setup, no numbering, no ACK, <b>no flow control, no congestion control</b>.','Error control only via checksum – bad datagram is silently discarded. Checksum optional (all 0s).','Max data = 65,535 − 8 (UDP) − 20 (IP) = <b>65,507 bytes</b>.','<b>Uses:</b> DNS, DHCP, streaming/VoIP, RPC, multicast, SNMP. <b>Not for</b> e-mail (SMTP), FTP – need reliability.'])+
E('Numerical: a UDP payload of 65,000 bytes needs an IP layer that allows it (65000+8+20=65028 &lt; 65535, OK), but it will be <b>fragmented</b> by IP into multiple pieces since it exceeds the typical 1500-byte MTU — UDP itself does not fragment, IP does.')+Q('Why is UDP used for video streaming?','Retransmitting old frames would break synchronisation; occasional loss is acceptable and low overhead/delay matters more.')],
['TCP – Features &amp; Segment Header',1,
D('<b>TCP</b> = connection-oriented, reliable, <b>stream-oriented</b> (byte stream), full-duplex protocol with flow, error and congestion control.')+
U(['Sending/receiving <b>buffers</b>; bytes grouped into <b>segments</b>.','<b>Sequence no.</b> = number of first byte in segment. <b>Ack no.</b> = next byte expected (cumulative): ack 5641 ⇒ bytes ≤5640 received.','Piggybacking ACK with data.'])+

/* ---- one shadow root per source file; each keeps its own CSS + JS ---- */
var roots={};
KEYS.forEach(function(k){
  var host=document.getElementById('host-'+k);
  var root=host.attachShadow({mode:'open'});
  root.appendChild(document.getElementById('tpl-'+k).content.cloneNode(true));
  roots[k]=root;
  MODS[k].init(root);
  wireAnchors(root,MODS[k].nav);
});

/* in-page anchors can't see into shadow roots natively: open collapsed ancestors, then scroll */
function wireAnchors(root,navSel){
  root.addEventListener('click',function(e){
    var a=e.target.closest&&e.target.closest('a[href^="#"]');
    if(!a)return;
    var id=decodeURIComponent(a.getAttribute('href').slice(1));
    var t=id&&root.getElementById(id);
    if(!t)return;
    e.preventDefault();
    for(var n=t;n&&n.nodeType===1;n=n.parentElement){
      if(n.tagName==='DETAILS')n.open=true;
      if(n.classList.contains('shut'))n.classList.remove('shut');
    }
    if(t.tagName!=='DETAILS'){var d=t.querySelector(':scope > details');if(d)d.open=true;}
    /* collapse any open mobile menu belonging to the module's own nav */
    root.querySelectorAll('nav.open,#links.open').forEach(function(x){x.classList.remove('open');});
    var nav=root.querySelector(navSel),off=document.getElementById('gbar').offsetHeight+(nav?nav.offsetHeight:0)+10;
    window.scrollTo({top:t.getBoundingClientRect().top+window.pageYOffset-off,behavior:'smooth'});
  });
}

/* ---- tabs ---- */
var cur=null;
function show(k,opts){
  opts=opts||{};
  if(KEYS.indexOf(k)<0)k=KEYS[0];
  KEYS.forEach(function(x){
    document.getElementById('host-'+x).classList.toggle('on',x===k);
    var t=document.getElementById('tab-'+x);
    t.setAttribute('aria-selected',x===k?'true':'false');
    t.tabIndex=x===k?0:-1;
  });
  var i=KEYS.indexOf(k),p=document.getElementById('pgPrev'),n=document.getElementById('pgNext');
  p.hidden=i===0;n.hidden=i===KEYS.length-1;
  if(i>0){p.textContent='← '+META[KEYS[i-1]].label;p.dataset.key=KEYS[i-1];}
  if(i<KEYS.length-1){n.textContent=META[KEYS[i+1]].label+' →';n.dataset.key=KEYS[i+1];}
  document.title=META[k].label+' – '+META[k].sub+' | Computer Networks Study Notes';
  document.getElementById('gcur').innerHTML='📚 <b>'+META[k].label+'</b> · '+META[k].sub;
  if(cur!==k){
    cur=k;
    try{localStorage.setItem('cn-notes-tab',k);}catch(_){}
    if(!opts.initial){
      history.replaceState(null,'','#'+k);
      var de=document.documentElement,old=de.style.scrollBehavior;
      de.style.scrollBehavior='auto';window.scrollTo(0,0);de.style.scrollBehavior=old;
    }
    var tb=document.getElementById('tab-'+k);
    if(tb.scrollIntoView)tb.scrollIntoView({block:'nearest',inline:'center'});
  }
}
document.getElementById('gtabs').addEventListener('click',function(e){
  var b=e.target.closest('.gtab');if(b)show(b.dataset.key);
});
document.getElementById('gtabs').addEventListener('keydown',function(e){
  var i=KEYS.indexOf(cur),j=e.key==='ArrowRight'?i+1:e.key==='ArrowLeft'?i-1:-1;
  if(j<0||j>=KEYS.length)return;
  e.preventDefault();show(KEYS[j]);document.getElementById('tab-'+KEYS[j]).focus();
});
['pgPrev','pgNext'].forEach(function(id){
  document.getElementById(id).addEventListener('click',function(){show(this.dataset.key);});
});
/* ---- collapsible top bar (remembered between visits) ---- */
function setBar(collapsed,save){
  document.documentElement.classList.toggle('gc',collapsed);
  var b=document.getElementById('gtoggle');
  b.setAttribute('aria-expanded',collapsed?'false':'true');
  b.querySelector('.arrow').textContent=collapsed?'▼':'▲';
  b.querySelector('.lbl').textContent=collapsed?' Show bar':' Hide bar';
  if(save){try{localStorage.setItem('cn-notes-bar',collapsed?'1':'0');}catch(_){}}
}
document.getElementById('gtoggle').addEventListener('click',function(){
  setBar(!document.documentElement.classList.contains('gc'),true);
});
try{setBar(localStorage.getItem('cn-notes-bar')==='1',false);}catch(_){}

window.addEventListener('hashchange',function(){
  var h=location.hash.slice(1);if(KEYS.indexOf(h)>=0)show(h);
});
var start=location.hash.slice(1);
if(KEYS.indexOf(start)<0){try{start=localStorage.getItem('cn-notes-tab');}catch(_){start=null;}}
show(start,{initial:true});
})();
