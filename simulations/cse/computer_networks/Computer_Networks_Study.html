<h4>Sliding Window Protocols — Core Idea 🔥</h4>
<div class="callout def"><span class="co-label">Definition</span>
The <strong>sliding window</strong> is a flow-control &amp; reliability technique in which the sender is permitted to transmit <em>several</em> frames — up to a fixed number called the <strong>window size</strong> — before it must stop and wait for acknowledgements, instead of stopping after every single frame like Stop-and-Wait. Both sender and receiver maintain a "window": a range of sequence numbers they are currently allowed to send (sender) or accept (receiver). As frames are sent and acknowledged, this window <strong>slides forward</strong> along the sequence-number space — hence the name.
</div>
<ul>
  <li>Applies <strong>pipelining</strong> — sender can transmit multiple frames before needing an ACK, keeping the link continuously busy instead of idling after each frame (this is exactly what fixes Stop-and-Wait's bandwidth-inefficiency problem).</li>
  <li><strong>Sender's window</strong> = set of sequence numbers it's permitted to send (unacknowledged/outstanding frames it has sent but not yet had confirmed).</li>
  <li><strong>Receiver's window</strong> = set of sequence numbers it's willing to accept.</li>
  <li>Sequence numbers use <em>m</em> header bits → range 0 to 2ᵐ−1, and wrap around (modulo 2ᵐ) once they reach the top.</li>
  <li>Window slides forward as ACKs arrive (lower edge advances) and new frames are sent (upper edge advances) — the window size caps how many frames can be "in flight" (sent but unacknowledged) at once.</li>
  <li>Two concrete implementations exist, differing in exactly how they recover from errors: <strong>Go-Back-N ARQ</strong> and <strong>Selective Repeat ARQ</strong> (below).</li>
</ul>

<h4>All Conditions a Sliding Window Protocol Must Handle 🔥🔥</h4>
<p>Just like Stop-and-Wait ARQ needed to correctly handle 4 scenarios, any working sliding-window protocol must have well-defined rules for <em>every</em> one of these conditions — this is the complete list examiners expect:</p>
<table>
<thead><tr><th>Condition</th><th>What the protocol must do</th></tr></thead>
<tbody>
<tr><td><strong>Normal operation</strong></td><td>Frames flow continuously within the window; receiver sends (cumulative) ACKs as frames arrive in order; window slides forward smoothly on both ends.</td></tr>
<tr><td><strong>Frame is lost in transit</strong></td><td>The frame never reaches the receiver. Go-Back-N: receiver silently discards every subsequent out-of-order frame until the missing one is resent. Selective Repeat: receiver buffers the later frames and NAKs the specific missing one.</td></tr>
<tr><td><strong>Frame arrives damaged (corrupted)</strong></td><td>Detected via the frame's error-check field (CRC/checksum) — treated identically to a lost frame: the receiver simply doesn't acknowledge a bad frame; it waits for a good retransmission.</td></tr>
<tr><td><strong>ACK is lost</strong></td><td>Since ACKs in sliding window are typically <strong>cumulative</strong> (ACK n acknowledges everything up to n), a single lost ACK is often "healed" automatically by the next ACK that does arrive — this is a major advantage over Stop-and-Wait, where every lost ACK forces a retransmission.</td></tr>
<tr><td><strong>Timeout expires with no ACK</strong></td><td>Sender assumes the oldest outstanding frame (or, in Selective Repeat, the specific unacknowledged frame) was lost, and retransmits per the protocol's specific rule (all of them for Go-Back-N; just the one for Selective Repeat).</td></tr>
<tr><td><strong>Frames arrive out of order</strong></td><td>Go-Back-N's receiver window size of 1 means it <em>cannot</em> accept out-of-order frames at all — they're discarded. Selective Repeat's receiver window &gt; 1 means it <em>can</em> buffer and later reorder them.</td></tr>
<tr><td><strong>Duplicate frame/ACK arrives</strong></td><td>Sequence numbers let both sender and receiver recognize and silently discard duplicates caused by premature timeouts or delayed messages, exactly as in Stop-and-Wait.</td></tr>
<tr><td><strong>Window full (sender)</strong></td><td>Once the sender's window is exhausted (as many unacknowledged frames outstanding as the window size allows), it <strong>must stop</strong> sending new frames — this is the actual flow-control mechanism at work — until an ACK slides the window forward again.</td></tr>
</tbody>
</table>

<h4>Go-Back-N ARQ</h4>

  <line x1="100" y1="80" x2="270" y2="92" stroke="#c98a7c" stroke-width="1.6" stroke-dasharray="4,3"></line><text x="105" y="77" font-size="10" fill="#c98a7c">F2 (lost)</text>
  <text x="255" y="87" font-size="13" fill="#c98a7c" font-weight="700">✕</text>
  <line x1="100" y1="105" x2="440" y2="130" stroke="#7c9ec9" stroke-width="1.6" marker-end="url(#arwSW)"></line><text x="105" y="102" font-size="10" fill="#7c9ec9">F3</text>
  <line x1="100" y1="130" x2="440" y2="155" stroke="#7c9ec9" stroke-width="1.6" marker-end="url(#arwSW)"></line><text x="105" y="127" font-size="10" fill="#7c9ec9">F4</text>

  <line x1="440" y1="60" x2="100" y2="85" stroke="#8dbf8d" stroke-width="1.6" marker-end="url(#arwAK)"></line><text x="390" y="57" font-size="10" fill="#8dbf8d">ACK0</text>
  <line x1="440" y1="85" x2="100" y2="110" stroke="#8dbf8d" stroke-width="1.6" marker-end="url(#arwAK)"></line><text x="390" y="82" font-size="10" fill="#8dbf8d">ACK1</text>

  <text x="445" y="134" font-size="9.5" fill="#c98a7c">discard (out of order)</text>
  <text x="445" y="159" font-size="9.5" fill="#c98a7c">discard (out of order)</text>

  <line x1="30" y1="175" x2="530" y2="175" stroke="#c4a35a" stroke-dasharray="5,3"></line>
  <text x="285" y="190" text-anchor="middle" font-size="10.5" fill="#c4a35a">Timeout for F2 expires at sender</text>

  <line x1="100" y1="205" x2="440" y2="230" stroke="#7c9ec9" stroke-width="1.6" marker-end="url(#arwSW)"></line><text x="105" y="202" font-size="10" fill="#7c9ec9">F2</text>
  <line x1="100" y1="230" x2="440" y2="255" stroke="#7c9ec9" stroke-width="1.6" marker-end="url(#arwSW)"></line><text x="105" y="227" font-size="10" fill="#7c9ec9">F3</text>
  <line x1="100" y1="255" x2="440" y2="280" stroke="#7c9ec9" stroke-width="1.6" marker-end="url(#arwSW)"></line><text x="105" y="252" font-size="10" fill="#7c9ec9">F4</text>
  <text x="270" y="300" text-anchor="middle" font-size="11" fill="#e6e4ea" font-weight="600">Go-Back-N: sender resends F2, F3 &amp; F4</text>
</svg>
<div class="diagram-caption">F2 is lost in transit. The receiver silently discards the out-of-order frames F3 and F4 that follow. When the sender's timer for F2 expires, it goes back and resends F2, F3, F4 — even though F3 and F4 were sent correctly the first time.</div>
</div>

<ul>
  <li>Sender window size = <code>2^m − 1</code>; Receiver window size = <strong>1</strong>.</li>
  <li>One timer for the oldest outstanding (unacknowledged) frame.</li>
  <li>Receiver sends a positive ACK only for frames arriving safe &amp; in order; if a frame is damaged/out-of-order, receiver stays silent and <strong>discards all subsequent frames</strong> (no buffering of out-of-order frames).</li>
  <li>On timeout, sender resends <strong>all frames starting from the one with the expired timer</strong> — hence "Go Back N".</li>
  <li>Supports <strong>cumulative ACK</strong> — ACK2 implicitly acknowledges ACK1 too.</li>
</ul>

<h4>Selective Repeat ARQ</h4>

<div class="diagram-wrap">
<svg viewBox="0 0 560 220" xmlns="http://www.w3.org/2000/svg">
  <text x="100" y="15" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#c4a35a">Sender</text>
  <text x="440" y="15" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#c4a35a">Receiver</text>
  <line x1="100" y1="22" x2="100" y2="200" stroke="#2e2c35"></line>
  <line x1="440" y1="22" x2="440" y2="200" stroke="#2e2c35"></line>

  <defs><marker id="arwSR" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#7c9ec9"></path></marker>
  <marker id="arwSRnak" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#c98a7c"></path></marker></defs>

  <line x1="100" y1="30" x2="440" y2="55" stroke="#7c9ec9" stroke-width="1.6" marker-end="url(#arwSR)"></line><text x="105" y="27" font-size="10" fill="#7c9ec9">F0</text>
  <line x1="100" y1="55" x2="270" y2="67" stroke="#c98a7c" stroke-width="1.6" stroke-dasharray="4,3"></line><text x="105" y="52" font-size="10" fill="#c98a7c">F1 (lost)</text>
  <text x="255" y="62" font-size="13" fill="#c98a7c" font-weight="700">✕</text>
  <line x1="100" y1="80" x2="440" y2="105" stroke="#7c9ec9" stroke-width="1.6" marker-end="url(#arwSR)"></line><text x="105" y="77" font-size="10" fill="#7c9ec9">F2</text>
  <line x1="100" y1="105" x2="440" y2="130" stroke="#7c9ec9" stroke-width="1.6" marker-end="url(#arwSR)"></line><text x="105" y="102" font-size="10" fill="#7c9ec9">F3</text>

  <text x="445" y="60" font-size="9.5" fill="#8dbf8d">buffered</text>
  <text x="445" y="110" font-size="9.5" fill="#8dbf8d">F2 buffered ✓</text>
  <text x="445" y="135" font-size="9.5" fill="#8dbf8d">F3 buffered ✓</text>

  <line x1="440" y1="110" x2="100" y2="135" stroke="#c98a7c" stroke-width="1.6" marker-end="url(#arwSRnak)"></line><text x="380" y="107" font-size="10" fill="#c98a7c">NAK1</text>

  <line x1="100" y1="155" x2="440" y2="180" stroke="#7c9ec9" stroke-width="1.6" marker-end="url(#arwSR)"></line><text x="105" y="152" font-size="10" fill="#7c9ec9">F1 resent</text>
  <text x="270" y="200" text-anchor="middle" font-size="11" fill="#e6e4ea" font-weight="600">Only F1 is retransmitted — F2, F3 are NOT resent</text>
</svg>
<div class="diagram-caption">Unlike Go-Back-N, the receiver <strong>keeps</strong> F2 and F3 in a buffer instead of discarding them, and tells the sender exactly which frame (F1) is missing via a NAK — so only that one frame needs to be resent.</div>
</div>

<ul>
  <li>Window size (sender = receiver) reduced to <code>2^m / 2</code>.</li>
  <li>Uses <strong>NAK</strong> (negative ACK) reporting the sequence number of a damaged frame, before the timer expires.</li>
  <li>Receiver buffers correctly-received out-of-order frames; only resends the specific missing/damaged frame.</li>
  <li>More efficient over noisy links, but needs more receiver memory/complexity.</li>
  <li>Delivery to network layer requires: (1) a set of consecutive frames has arrived, (2) that set starts from the window's beginning.</li>
</ul>

<h4>Go-Back-N vs Selective Repeat 🔥🔥</h4>
<table>
<thead><tr><th>Go-Back-N</th><th>Selective Repeat</th></tr></thead>
<tbody>
<tr><td>Discards all subsequent frames on error</td><td>Discards only the bad frame, buffers good ones</td></tr>
<tr><td>Sends no ACK for discarded frames</td><td>Sends a NAK when it detects an error</td></tr>
<tr><td>Receiver window size = 1</td><td>Receiver window size &gt; 1</td></tr>
<tr><td>Won't accept any frame except the next expected one</td><td>Buffers remaining received frames</td></tr>
<tr><td>Resends ALL unacknowledged frames from the lost one onward</td><td>Resends only the oldest unacknowledged frame</td></tr>
<tr><td>Wastes bandwidth</td><td>Better bandwidth use, but needs more memory</td></tr>
<tr><td>Good when error rate is high</td><td>Good when error rate is low but must be robust</td></tr>
</tbody>
</table>

<div class="callout example"><span class="co-label">Solved Example — Window Sizes (5-bit sequence numbers, n=5)</span>
<code>Stop-and-Wait:      sender/receiver window = 1</code><br>
<code>Go-Back-N:          sender window = 2^5 − 1 = 31, receiver window = 1</code><br>
<code>Selective Repeat:   window = 2^5 / 2 = 16</code>
</div>

<div class="callout example"><span class="co-label">Solved Example — Sequence Number After N Packets</span>
5-bit sequence numbers → range 0–31 (32 values), starting at 0. After sending <strong>100 packets</strong>:<br>
100 mod 32 = 4 → <strong>sequence number after 100 packets = 4</strong>
</div>
</div>
</details>

<!-- HDLC -->
<details class="card" id="m2-hdlc">
<summary><span class="stitle"><span class="chev">▶</span> HDLC (High-Level Data Link Control) Protocol <span class="badge">🔥 High Yield</span></span></summary>
<div class="card-body">
<p>HDLC is a <strong>bit-oriented, synchronous</strong> data link layer protocol by ISO, used over point-to-point and multipoint links. Implements Stop-and-Wait; supports error &amp; flow control.</p>

<h4>Station Types &amp; Transfer Modes</h4>
<ul>
  <li>Station types: <strong>Primary, Secondary, Combined</strong>.</li>
  <li><strong>Normal Response Mode (NRM):</strong> unbalanced configuration — 1 primary + multiple secondary stations. Primary sends commands; secondaries only respond. Used point-to-point &amp; multipoint.</li>
  <li><strong>Asynchronous Balanced Mode (ABM):</strong> point-to-point only; each station acts as both primary &amp; secondary (peers). The commonly used mode.</li>
</ul>

<h4>Frame Types</h4>
<ul>
  <li><strong>I-frames</strong> (Information) — carry user data + control info (piggybacking)</li>
  <li><strong>S-frames</strong> (Supervisory) — carry control information only</li>
  <li><strong>U-frames</strong> (Unnumbered) — reserved for link/system management</li>
</ul>

<h4>Frame Format</h4>

<div class="diagram-wrap">
<svg viewBox="0 0 680 130" xmlns="http://www.w3.org/2000/svg">
  <g font-family="Segoe UI,sans-serif" font-size="11.5" text-anchor="middle">
    <rect x="20" y="35" width="55" height="55" fill="#c98a7c"></rect><text x="47" y="58" font-size="10" fill="#0f0e11" font-weight="700">Flag</text><text x="47" y="72" font-size="10" fill="#0f0e11">8b</text>
    <rect x="75" y="35" width="75" height="55" fill="#c4a35a"></rect><text x="112" y="58" fill="#0f0e11" font-weight="700">Address</text><text x="112" y="72" fill="#0f0e11">8+ b</text>
    <rect x="150" y="35" width="80" height="55" fill="#7c9ec9"></rect><text x="190" y="58" fill="#0f0e11" font-weight="700">Control</text><text x="190" y="72" fill="#0f0e11">8/16 b</text>
    <rect x="230" y="35" width="250" height="55" fill="#8dbf8d"></rect><text x="355" y="58" fill="#0f0e11" font-weight="700">Information</text><text x="355" y="72" fill="#0f0e11">variable (user data)</text>
    <rect x="480" y="35" width="80" height="55" fill="#7c9ec9"></rect><text x="520" y="58" fill="#0f0e11" font-weight="700">FCS</text><text x="520" y="72" fill="#0f0e11">16/32 b</text>
    <rect x="560" y="35" width="55" height="55" fill="#c98a7c"></rect><text x="587" y="58" font-size="10" fill="#0f0e11" font-weight="700">Flag</text><text x="587" y="72" font-size="10" fill="#0f0e11">8b</text>
  </g>
  <g stroke="#2e2c35" fill="none"><rect x="20" y="35" width="55" height="55"></rect><rect x="75" y="35" width="75" height="55"></rect><rect x="150" y="35" width="80" height="55"></rect><rect x="230" y="35" width="250" height="55"></rect><rect x="480" y="35" width="80" height="55"></rect><rect x="560" y="35" width="55" height="55"></rect></g>
  <text x="20" y="20" font-size="11" fill="#9a97a3">HDLC Frame — flag pattern 01111110 marks start &amp; end</text>
</svg>
</div>

<table>
<thead><tr><th>Field</th><th>Size</th><th>Use</th></tr></thead>
<tbody>
<tr><td>Flag</td><td>8 bits</td><td><code>01111110</code> — marks frame start/end</td></tr>
<tr><td>Address</td><td>1+ byte(s)</td><td>To/From address depending on primary/secondary; last bit of last byte = 1</td></tr>
<tr><td>Control</td><td>1–2 bytes</td><td>Frame &amp; error control; interpretation differs by frame type</td></tr>
<tr><td>Information</td><td>variable</td><td>User data from network layer</td></tr>
<tr><td>FCS</td><td>2 or 4 bytes</td><td>Frame Check Sequence — error detection</td></tr>
</tbody>
</table>

<h4>Control Field Formats</h4>

<div class="diagram-wrap">
<svg viewBox="0 0 520 170" xmlns="http://www.w3.org/2000/svg">
  <g font-family="monospace" font-size="10" text-anchor="middle" font-weight="700">
    <text x="10" y="30" text-anchor="start" font-family="Segoe UI,sans-serif" font-size="11" fill="#c4a35a">I-frame</text>
    <rect x="90" y="15" width="30" height="26" fill="#7c9ec9"></rect><text x="105" y="32" fill="#0f0e11">0</text>
    <rect x="120" y="15" width="70" height="26" fill="#8dbf8d"></rect><text x="155" y="32" fill="#0f0e11">N(S)</text>
    <rect x="190" y="15" width="30" height="26" fill="#c4a35a"></rect><text x="205" y="32" fill="#0f0e11">P/F</text>
    <rect x="220" y="15" width="70" height="26" fill="#c98a7c"></rect><text x="255" y="32" fill="#0f0e11">N(R)</text>
    <text x="300" y="32" text-anchor="start" font-family="Segoe UI,sans-serif" font-size="9.5" fill="#9a97a3" font-weight="400">data + piggyback ACK</text>

    <text x="10" y="75" text-anchor="start" font-family="Segoe UI,sans-serif" font-size="11" fill="#c4a35a">S-frame</text>
    <rect x="90" y="60" width="30" height="26" fill="#7c9ec9"></rect><text x="105" y="77" fill="#0f0e11">10</text>
    <rect x="120" y="60" width="45" height="26" fill="#8dbf8d"></rect><text x="142" y="77" fill="#0f0e11">code</text>
    <rect x="165" y="60" width="30" height="26" fill="#c4a35a"></rect><text x="180" y="77" fill="#0f0e11">P/F</text>
    <rect x="195" y="60" width="70" height="26" fill="#c98a7c"></rect><text x="230" y="77" fill="#0f0e11">N(R)</text>
    <text x="300" y="77" text-anchor="start" font-family="Segoe UI,sans-serif" font-size="9.5" fill="#9a97a3" font-weight="400">RR / RNR / REJ / SREJ</text>

    <text x="10" y="120" text-anchor="start" font-family="Segoe UI,sans-serif" font-size="11" fill="#c4a35a">U-frame</text>
    <rect x="90" y="105" width="30" height="26" fill="#7c9ec9"></rect><text x="105" y="122" fill="#0f0e11">11</text>
    <rect x="120" y="105" width="45" height="26" fill="#8dbf8d"></rect><text x="142" y="122" fill="#0f0e11">code</text>
    <rect x="165" y="105" width="30" height="26" fill="#c4a35a"></rect><text x="180" y="122" fill="#0f0e11">P/F</text>
    <rect x="195" y="105" width="70" height="26" fill="#8dbf8d"></rect><text x="230" y="122" fill="#0f0e11">code</text>
    <text x="300" y="122" text-anchor="start" font-family="Segoe UI,sans-serif" font-size="9.5" fill="#9a97a3" font-weight="400">session mgmt (SABM, DISC, UA…)</text>
  </g>
  <text x="10" y="155" font-family="Segoe UI,sans-serif" font-size="9.5" fill="#9a97a3">The leading bit(s) tell the receiver which of the 3 formats to parse — 0 → I-frame, 10 → S-frame, 11 → U-frame.</text>
</svg>
</div>

<ul>
  <li><strong>I-frame:</strong> bit 0 = 0 (type flag); next 3 bits = N(S) sequence number; last 3 bits = N(R) piggyback ack number; includes P/F (Poll/Final) bit.</li>
  <li><strong>S-frame:</strong> first 2 bits = <code>10</code>; last 3 bits = N(R); bits 3–4 = code identifying S-frame type:</li>
</ul>
<table>
<thead><tr><th>Code</th><th>Type</th><th>Purpose</th></tr></thead>
<tbody>
<tr><td>00</td><td>RR (Receive Ready)</td><td>Acknowledges safe receipt</td></tr>
<tr><td>10</td><td>RNR (Receive Not Ready)</td><td>ACK + "I'm busy" (congestion control)</td></tr>
<tr><td>01</td><td>REJ (Reject)</td><td>NAK used in Go-Back-N ARQ</td></tr>
<tr><td>11</td><td>SREJ (Selective Reject)</td><td>NAK used in Selective Repeat ARQ</td></tr>
</tbody>
</table>
<ul>
  <li><strong>U-frame:</strong> first 2 bits = <code>11</code>; used for session management (32 different types possible).</li>
</ul>

<div class="callout example"><span class="co-label">Example — Piggybacking in Action</span>
Station A sends I-frame with N(S)=2 (its 3rd frame) to B. B has data to send back too, so instead of a bare ACK, B replies with an I-frame carrying N(S)=0 (its own data) <em>and</em> N(R)=3 (acknowledging it has correctly received A's frames up through sequence 2) — one frame does double duty as data + ACK.
</div>
</div>
</details>

<!-- MAC SUBLAYER -->
<details class="card" id="m2-mac" open="">
<summary><span class="stitle"><span class="chev">▶</span> MAC Sublayer: Channel Allocation, ALOHA, CSMA/CD <span class="badge">🔥🔥 Very High Yield</span></span></summary>
<div class="card-body">
<p>DLL splits into <strong>LLC</strong> (Logical Link Control — one protocol for all IEEE LANs) and <strong>MAC</strong> (Medium Access Control — different per LAN type). MAC solves: <em>who gets to use a shared/broadcast channel?</em></p>

<h4>Channel Allocation: Static vs Dynamic</h4>
<table>
<thead><tr><th>Static Allocation</th><th>Dynamic Allocation</th></tr></thead>
<tbody>
<tr><td><strong>FDM</strong> (Frequency Division Multiplexing) — bandwidth split into N fixed bands; used in FM radio, GSM</td><td>Allocation adapts to current demand; called <strong>Multiple Access Protocols</strong></td></tr>
<tr><td><strong>TDM</strong> (Time Division Multiplexing) — each user gets every Nth time slot; used in POTS, GSM</td><td>Split into: <strong>Contention protocols</strong> (resolve collision after it happens — ALOHA, CSMA, CSMA/CD) and <strong>Collision-free protocols</strong> (avoid collisions entirely — Bit-Map, Token Passing, Binary Countdown)</td></tr>
<tr><td>Wastes bandwidth if fewer than N users are active, or blocks users if more than N want to communicate</td><td>Efficient for bursty/varying traffic</td></tr>
</tbody>
</table>

<h4>ALOHA 🔥</h4>
<p>Developed by Norman Abramson (1970) for radio LANs; applicable to any shared-channel system.</p>

<div class="diagram-wrap">
<svg viewBox="0 0 560 220" xmlns="http://www.w3.org/2000/svg">
  <text x="280" y="16" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#c4a35a">Pure ALOHA — stations transmit whenever ready</text>
  <line x1="20" y1="55" x2="540" y2="55" stroke="#2e2c35"></line>
  <rect x="40" y="40" width="55" height="30" fill="#7c9ec9"></rect><text x="67" y="59" text-anchor="middle" font-size="9.5" fill="#0f0e11" font-weight="700">A</text>
  <rect x="120" y="40" width="55" height="30" fill="#8dbf8d"></rect><text x="147" y="59" text-anchor="middle" font-size="9.5" fill="#0f0e11" font-weight="700">B</text>
  <rect x="155" y="40" width="55" height="30" fill="#c98a7c" opacity="0.9"></rect><text x="182" y="59" text-anchor="middle" font-size="9" fill="#0f0e11" font-weight="700">✕ C</text>
  <rect x="260" y="40" width="55" height="30" fill="#7c9ec9"></rect><text x="287" y="59" text-anchor="middle" font-size="9.5" fill="#0f0e11" font-weight="700">D</text>
  <rect x="390" y="40" width="55" height="30" fill="#8dbf8d"></rect><text x="417" y="59" text-anchor="middle" font-size="9.5" fill="#0f0e11" font-weight="700">E</text>
  <rect x="420" y="40" width="55" height="30" fill="#c98a7c" opacity="0.9"></rect><text x="447" y="59" text-anchor="middle" font-size="9" fill="#0f0e11" font-weight="700">✕ F</text>
  <text x="280" y="90" text-anchor="middle" font-size="10" fill="#9a97a3">Frames start at random instants — any overlap, however small, destroys both frames</text>

  <text x="280" y="125" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#c4a35a">Slotted ALOHA — transmission only allowed at slot boundaries</text>
  <line x1="20" y1="165" x2="540" y2="165" stroke="#2e2c35"></line>
  <g stroke="#2e2c35" stroke-dasharray="2,2">
    <line x1="40" y1="150" x2="40" y2="180"></line><line x1="105" y1="150" x2="105" y2="180"></line><line x1="170" y1="150" x2="170" y2="180"></line><line x1="235" y1="150" x2="235" y2="180"></line><line x1="300" y1="150" x2="300" y2="180"></line><line x1="365" y1="150" x2="365" y2="180"></line><line x1="430" y1="150" x2="430" y2="180"></line><line x1="495" y1="150" x2="495" y2="180"></line>
  </g>
  <rect x="42" y="150" width="61" height="30" fill="#7c9ec9"></rect><text x="72" y="169" text-anchor="middle" font-size="9.5" fill="#0f0e11" font-weight="700">A</text>
  <rect x="172" y="150" width="61" height="30" fill="#8dbf8d"></rect><text x="202" y="169" text-anchor="middle" font-size="9.5" fill="#0f0e11" font-weight="700">B</text>
  <rect x="302" y="150" width="61" height="30" fill="#7c9ec9"></rect><text x="332" y="169" text-anchor="middle" font-size="9.5" fill="#0f0e11" font-weight="700">D</text>
  <text x="280" y="205" text-anchor="middle" font-size="10" fill="#9a97a3">Every station must wait for the next slot to start — frames either fully overlap (collide) or don't overlap at all</text>
</svg>
<div class="diagram-caption">Pure ALOHA's free-for-all timing doubles the danger window compared to Slotted ALOHA's synchronized slots — this is exactly why vulnerable time is 2t vs t.</div>
</div>

<table>
<thead><tr><th>Pure ALOHA</th><th>Slotted ALOHA</th></tr></thead>
<tbody>
<tr><td>Transmit whenever data is ready — continuous time</td><td>Time divided into discrete slots; must wait for slot boundary — discrete time</td></tr>
<tr><td>No global time synchronization required</td><td>Requires synchronization (clocks)</td></tr>
<tr><td>Higher collision probability</td><td>Improved efficiency over pure ALOHA</td></tr>
<tr><td><strong>Vulnerable time = 2t</strong> (t = frame transmission time)</td><td><strong>Vulnerable time = t</strong> (frame transmission time only)</td></tr>
</tbody>
</table>
<p>On collision, sender waits a <strong>random</strong> time before retrying (a "contention system") — different wait times reduce repeated collision probability.</p>

<div class="diagram-wrap">
<svg viewBox="0 0 520 150" xmlns="http://www.w3.org/2000/svg">
  <text x="260" y="18" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="12" fill="#9a97a3">Pure ALOHA — vulnerable period for frame B</text>
  <line x1="20" y1="80" x2="500" y2="80" stroke="#2e2c35"></line>
  <rect x="180" y="65" width="100" height="28" fill="#8dbf8d"></rect><text x="230" y="83" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0f0e11">Frame B</text>
  <rect x="90" y="65" width="100" height="28" fill="#7c9ec9" opacity="0.85"></rect><text x="140" y="83" text-anchor="middle" font-size="10" font-weight="700" fill="#0f0e11">starts before B</text>
  <rect x="270" y="65" width="100" height="28" fill="#c98a7c" opacity="0.85"></rect><text x="320" y="83" text-anchor="middle" font-size="10" font-weight="700" fill="#0f0e11">starts during B</text>
  <path d="M90,105 L370,105" stroke="#c4a35a" stroke-width="1.5"></path>
  <path d="M90,100 L90,110 M370,100 L370,110" stroke="#c4a35a" stroke-width="1.5"></path>
  <text x="230" y="122" text-anchor="middle" font-size="11" fill="#c4a35a" font-weight="700">Vulnerable time = 2t</text>
  <text x="230" y="138" text-anchor="middle" font-size="9.5" fill="#9a97a3">any frame starting in this 2t window collides with B</text>
</svg>
</div>

<div class="callout example"><span class="co-label">Example — Vulnerable Time</span>
A LAN sends 1000-bit frames at 1 Mbps → frame transmission time t = 1000/1,000,000 = 1 ms.<br>
<strong>Pure ALOHA</strong> vulnerable time = 2t = <strong>2 ms</strong>. <strong>Slotted ALOHA</strong> vulnerable time = t = <strong>1 ms</strong> — half the risk, because transmissions can only begin at slot boundaries.
</div>

<h4>Carrier Sense Multiple Access (CSMA)</h4>
<p>Improves on ALOHA — station senses the medium <em>before</em> transmitting. Reduces (but can't eliminate) collisions due to propagation delay.</p>
<table>
<thead><tr><th>Variant</th><th>Behavior</th></tr></thead>
<tbody>
<tr><td><strong>1-Persistent CSMA</strong></td><td>If channel busy, keep sensing continuously; transmit with probability 1 the instant it's idle. Higher collision risk if 2 stations were both waiting.</td></tr>
<tr><td><strong>Non-Persistent CSMA</strong></td><td>If busy, don't keep sensing — wait a <em>random</em> time, then re-check. Better utilization, longer delays than 1-persistent.</td></tr>
<tr><td><strong>p-Persistent CSMA</strong></td><td>If idle, transmit with probability <em>p</em>; defer to next slot with probability <em>q=1−p</em>. Repeats until sent or channel busy.</td></tr>
</tbody>
</table>

<h4>CSMA/CD (Collision Detection) 🔥🔥</h4>

<div class="diagram-wrap">
<svg viewBox="0 0 600 220" xmlns="http://www.w3.org/2000/svg">
  <text x="10" y="55" font-family="Segoe UI,sans-serif" font-size="12" font-weight="600" fill="#e6e4ea">Station A</text>
  <rect x="90" y="35" width="250" height="30" fill="#7c9ec9"></rect><text x="215" y="55" text-anchor="middle" font-size="11" fill="#0f0e11" font-weight="700">A transmitting</text>

  <text x="10" y="115" font-family="Segoe UI,sans-serif" font-size="12" font-weight="600" fill="#e6e4ea">Station B</text>
  <rect x="240" y="95" width="250" height="30" fill="#8dbf8d"></rect><text x="365" y="115" text-anchor="middle" font-size="11" fill="#0f0e11" font-weight="700">B transmits (senses idle, unaware of A)</text>

  <rect x="240" y="35" width="100" height="90" fill="#c98a7c" opacity="0.35"></rect>
  <line x1="240" y1="30" x2="240" y2="130" stroke="#c98a7c" stroke-dasharray="3,3"></line>
  <line x1="340" y1="30" x2="340" y2="130" stroke="#c98a7c" stroke-dasharray="3,3"></line>
  <text x="290" y="150" text-anchor="middle" font-size="12" font-weight="700" fill="#c98a7c">COLLISION</text>

  <rect x="340" y="165" width="60" height="24" fill="#c98a7c"></rect><text x="370" y="181" text-anchor="middle" font-size="10" fill="#0f0e11" font-weight="700">JAM</text>
  <line x1="400" y1="177" x2="480" y2="177" stroke="#9a97a3" stroke-width="2" marker-end="url(#arwCD)"></line>
  <defs><marker id="arwCD" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#9a97a3"></path></marker></defs>
  <text x="440" y="200" text-anchor="middle" font-size="10" fill="#9a97a3">random backoff → retry</text>
</svg>
<div class="diagram-caption">Both stations sense the channel idle and transmit almost simultaneously → signals overlap (collision) → both send a jam signal and back off for a random time before retrying.</div>
</div>

<ul>
  <li>Station continues listening <em>while transmitting</em> — aborts immediately on detecting a collision, saving time/bandwidth.</li>
  <li>Basis of classical Ethernet. Uses signal power/pulse-width to detect collisions. <strong>No ACK used.</strong></li>
  <li><strong>Steps:</strong> (1) Check ready → (2) sense channel idle → (3) transmit + monitor for collision; if collision, stop, send <strong>jam signal</strong>, wait random time, retry → (4) if no collision, complete transmission.</li>
  <li>CSMA/CD can be in one of 3 states: <strong>contention, transmission, idle</strong>.</li>
</ul>

<h4>Collision-Free Protocols</h4>
<table>
<thead><tr><th>Protocol</th><th>How it works</th></tr></thead>
<tbody>
<tr><td><strong>Bit-Map Protocol</strong></td><td>Each contention period has N slots; station <em>j</em> announces intent by placing a 1 bit in slot <em>j</em>. After N slots, all stations know who wants to transmit — they go in numerical order (a "reservation protocol")</td></tr>
<tr><td><strong>Binary Countdown</strong></td><td>Stations broadcast their binary address bit-by-bit (high-order first); bits are OR-ed on the channel. If a station sees its 0-bit overwritten with 1, it withdraws. Scales better than bit-map (avoids 1-bit-per-station overhead)</td></tr>
<tr><td><strong>Token Passing</strong></td><td>A "token" message circulates in a fixed order; only the token holder may transmit, then passes the token on</td></tr>
</tbody>
</table>

<div class="callout example"><span class="co-label">Example — Binary Countdown</span>
Stations with addresses <code>1001</code>, <code>1010</code>, and <code>0111</code> all want to transmit. They broadcast their address bit by bit, high-order first, and the channel OR-combines the bits: after bit 1, the combined value is <strong>1</strong> (since 1001 and 1010 both send 1) — station 0111 sees its 0 overwritten by a 1 and immediately withdraws. After bit 2, both remaining stations send 0, so both continue. After bit 3, 1001 sends 0 and 1010 sends 1 — 1001 sees its bit overwritten and withdraws. <strong>Station 1010 wins</strong> (highest address) and transmits first.
</div>

<div class="callout warn"><span class="co-label">Common Mistake</span>
CSMA/CD ≠ CSMA/CA. CSMA/CD (Collision <strong>Detection</strong>) is for wired Ethernet; CSMA/CA (Collision <strong>Avoidance</strong>, via RTS/CTS like MACA) is for wireless — because wireless stations often can't detect their own collisions.
</div>
</div>
</details>

<!-- ETHERNET -->
<details class="card" id="m2-ethernet" open="">
<summary><span class="stitle"><span class="chev">▶</span> Ethernet (IEEE 802.3) <span class="badge">🔥🔥 Very High Yield</span></span></summary>
<div class="card-body">
<p>The first LAN technology — jointly defined by DEC, Intel &amp; Xerox (1978). "Ether" = thick coaxial cable. Uses bus topology traditionally.</p>

<h4>IEEE 802 Standards Family</h4>
<table>
<thead><tr><th>Standard</th><th>Covers</th></tr></thead>
<tbody>
<tr><td>802.3</td><td>Ethernet</td></tr>
<tr><td>802.4</td><td>Token Bus</td></tr>
<tr><td>802.5</td><td>Token Ring</td></tr>
<tr><td>802.11</td><td>Wireless LAN (Wi-Fi)</td></tr>
<tr><td>802.15</td><td>Bluetooth</td></tr>
<tr><td>802.16</td><td>Wireless MAN</td></tr>
</tbody>
</table>

<h4>Ethernet Versions &amp; Cabling</h4>
<table>
<thead><tr><th>Variant</th><th>Speed / Length</th><th>Cable / Topology</th></tr></thead>
<tbody>
<tr><td>10Base5 (Thick coax)</td><td>10 Mbps, ≤500 m/segment</td><td>Thick coax, bus</td></tr>
<tr><td>10Base2 (Thin coax)</td><td>10 Mbps, ≤180 m</td><td>Thin coax, bus</td></tr>
<tr><td>10Base-T</td><td>10 Mbps, ≤100 m</td><td>UTP, star</td></tr>
<tr><td>10Base-F</td><td>10 Mbps, ≤2000 m</td><td>Fiber, star</td></tr>
</tbody>
</table>
<p>Later speeds: 100 Mbps (Fast Ethernet), 1000 Mbps (Gigabit Ethernet), 10000 Mbps (10 Gigabit Ethernet).</p>

<div class="callout note"><span class="co-label">Note</span>
"10Base5" decodes as: <strong>10</strong> = Mbps speed, <strong>Base</strong> = baseband signaling, <strong>5</strong> = max segment length (×100m). Max 4 repeaters between any pair of hosts on classic Ethernet → total reach 2500m.
</div>

<h4>Ethernet Addressing (MAC Address)</h4>
<ul>
  <li>6-byte address, burnt into ROM on the adaptor, written as 6 hex-pairs separated by colons (e.g. <code>8:0:2b:e4:b1:2</code>).</li>
  <li>Manufacturer prefix allocated per vendor (e.g. AMD = <code>8:0:20</code>).</li>
  <li><strong>Unicast</strong> — 2nd hex digit from left is even.</li>
  <li><strong>Multicast</strong> — 2nd hex digit from left is odd.</li>
  <li><strong>Broadcast</strong> — all digits are F (<code>FF:FF:FF:FF:FF:FF</code>).</li>
  <li>MAC addresses can be altered — known as <strong>MAC spoofing</strong>.</li>
</ul>

<div class="callout example"><span class="co-label">Example — Reading a MAC Address</span>
Address <code>01:00:5E:00:00:01</code>: the first byte is <code>01</code> = binary <code>00000001</code> — the low-order bit of the first byte is 1, marking it as a <strong>multicast</strong> address (this specific one is IPv4 multicast). Address <code>FF:FF:FF:FF:FF:FF</code> is the reserved <strong>broadcast</strong> address — every station on the LAN accepts it.
</div>

<h4>Ethernet Frame Format</h4>

<div class="diagram-wrap">
<svg viewBox="0 0 760 130" xmlns="http://www.w3.org/2000/svg">
  <g font-family="Segoe UI,sans-serif" font-size="11.5" fill="#0f0e11" text-anchor="middle">
    <rect x="20" y="35" width="70" height="55" fill="#7c9ec9"></rect><text x="55" y="58" fill="#0f0e11" font-weight="700">Preamble</text><text x="55" y="72" fill="#0f0e11">7 B</text>
    <rect x="90" y="35" width="40" height="55" fill="#8dbf8d"></rect><text x="110" y="58" font-size="10" fill="#0f0e11" font-weight="700">SFD</text><text x="110" y="72" font-size="10" fill="#0f0e11">1 B</text>
    <rect x="130" y="35" width="95" height="55" fill="#c4a35a"></rect><text x="177" y="58" fill="#0f0e11" font-weight="700">Dest Addr</text><text x="177" y="72" fill="#0f0e11">6 B</text>
    <rect x="225" y="35" width="95" height="55" fill="#c4a35a"></rect><text x="272" y="58" fill="#0f0e11" font-weight="700">Src Addr</text><text x="272" y="72" fill="#0f0e11">6 B</text>
    <rect x="320" y="35" width="60" height="55" fill="#7c9ec9"></rect><text x="350" y="58" fill="#0f0e11" font-weight="700">Length</text><text x="350" y="72" fill="#0f0e11">2 B</text>
    <rect x="380" y="35" width="290" height="55" fill="#c98a7c"></rect><text x="525" y="58" fill="#0f0e11" font-weight="700">Data (Payload)</text><text x="525" y="72" fill="#0f0e11">46–1500 B, padded if short</text>
    <rect x="670" y="35" width="60" height="55" fill="#8dbf8d"></rect><text x="700" y="58" font-size="10" fill="#0f0e11" font-weight="700">CRC</text><text x="700" y="72" font-size="10" fill="#0f0e11">4 B</text>
  </g>
  <g stroke="#2e2c35"><rect x="20" y="35" width="70" height="55" fill="none"></rect><rect x="90" y="35" width="40" height="55" fill="none"></rect><rect x="130" y="35" width="95" height="55" fill="none"></rect><rect x="225" y="35" width="95" height="55" fill="none"></rect><rect x="320" y="35" width="60" height="55" fill="none"></rect><rect x="380" y="35" width="290" height="55" fill="none"></rect><rect x="670" y="35" width="60" height="55" fill="none"></rect></g>
  <text x="20" y="20" font-size="11" fill="#9a97a3">← Ethernet Frame (min 64 bytes, max ~1518 bytes) →</text>
</svg>
</div>

<table>
<thead><tr><th>Field</th><th>Size</th><th>Purpose</th></tr></thead>
<tbody>
<tr><td>Preamble</td><td>7 bytes</td><td>Alternating 0s/1s for bit synchronization</td></tr>
<tr><td>SFD</td><td>1 byte</td><td><code>10101011</code> — signals start of destination address</td></tr>
<tr><td>Destination Address</td><td>6 bytes</td><td>MAC of receiving machine</td></tr>
<tr><td>Source Address</td><td>6 bytes</td><td>MAC of sending machine</td></tr>
<tr><td>Length</td><td>2 bytes</td><td>Length of the entire frame</td></tr>
<tr><td>Data</td><td>46–1500 bytes</td><td>Payload; padded with 0s if &lt; 46 bytes; fragmented if too large</td></tr>
<tr><td>CRC</td><td>4 bytes</td><td>32-bit hash over Dest/Src/Length/Data for error detection</td></tr>
</tbody>
</table>

<h4>Transmitter Algorithm &amp; Collisions 🔥</h4>
<ul>
  <li>If line idle → transmit immediately. If busy → wait until idle, then transmit.</li>
  <li>On collision detection: send a <strong>32-bit jamming sequence</strong>, then stop. Minimum sent during collision = 96 bits (64-bit preamble + 32-bit jam).</li>
  <li>Worst-case round-trip propagation time on 10Mbps Ethernet = <strong>51.2 μs</strong> (defines the collision slot time).</li>
  <li>To guarantee detecting a collision on its own frame, a transmitter needs to send ≥512 bits → hence <strong>minimum Ethernet frame = 512 bits = 64 bytes</strong> (14 header + 46 data + 4 CRC).</li>
</ul>
<pre><code>Minimum frame size derivation:
Delay × Bandwidth = 51.2 × 10⁻⁶ s × 10 × 10⁶ bps = 512 bits = 64 bytes</code></pre>

<h4>Binary Exponential Backoff Algorithm 🔥🔥</h4>
<pre><code>After collision number n, wait k × 51.2 μs,
where k is randomly chosen from 0 to (2ⁿ − 1)

Collision 1: choose k from {0,1}         → range 2^1
Collision 2: choose k from {0,1,2,3}     → range 2^2
Collision 3: choose k from {0..7}        → range 2^3
...
After 10 collisions: randomization interval frozen at 1023 slots (2^10)
After 16 collisions: controller reports failure to computer</code></pre>

<div class="diagram-wrap">
<svg viewBox="0 0 520 130" xmlns="http://www.w3.org/2000/svg">
  <text x="260" y="16" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="12" fill="#9a97a3">Backoff range doubles with every collision</text>
  <g font-family="monospace" font-size="10.5" fill="#0f0e11" text-anchor="middle">
    <rect x="20" y="35" width="60" height="60" fill="#7c9ec9"></rect><text x="50" y="60" font-weight="700">n=1</text><text x="50" y="76">{0,1}</text>
    <rect x="100" y="35" width="80" height="60" fill="#8dbf8d"></rect><text x="140" y="60" font-weight="700">n=2</text><text x="140" y="76">{0..3}</text>
    <rect x="200" y="35" width="100" height="60" fill="#c4a35a"></rect><text x="250" y="60" font-weight="700">n=3</text><text x="250" y="76">{0..7}</text>
    <rect x="320" y="35" width="120" height="60" fill="#c98a7c"></rect><text x="380" y="60" font-weight="700">n=4</text><text x="380" y="76">{0..15}</text>
  </g>
  <text x="460" y="70" font-size="14" fill="#9a97a3">…</text>
  <text x="260" y="118" text-anchor="middle" font-size="10" fill="#9a97a3">wait = k × 51.2 μs, where k is randomly picked from the widening range</text>
</svg>
</div>

<div class="callout example"><span class="co-label">Worked Example — Backoff Delay</span>
After the <strong>3rd</strong> collision, a station picks k randomly from {0,1,2,...,7} (range 2³). If it picks k=5, it waits <code>5 × 51.2 μs = 256 μs</code> before its next attempt. Two stations colliding repeatedly become increasingly unlikely to pick the same k as the range widens — this is what makes the algorithm converge.
</div>

<h4>Switched Ethernet</h4>
<ul>
  <li>A switch has a high-speed backplane with 4–32 plug-in line cards, 1–8 connectors each.</li>
  <li>Each connector = 10Base-T twisted-pair connection to a single host.</li>
  <li>Frame is copied locally if destined for the same card; otherwise sent over the backplane (many Gbps, proprietary protocol) to the destination card.</li>
</ul>
</div>
</details>

<!-- WIRELESS LAN -->
<details class="card" id="m2-wireless" open="">
<summary><span class="stitle"><span class="chev">▶</span> Wireless LAN &amp; IEEE 802.11 <span class="badge">🔥 High Yield</span></span></summary>
<div class="card-body">

<h4>Why Wireless is Different</h4>
<ul>
  <li>In wired LAN, when one station sends, all others receive it. In wireless, limited radio range means a station may not reach every other station.</li>
  <li>Radio signals reflect off objects (<strong>multipath fading</strong>); mobility requires reconfiguration when moving between base stations.</li>
</ul>

<h4>Hidden Terminal &amp; Exposed Terminal Problems 🔥🔥</h4>

<div class="diagram-wrap">
<svg viewBox="0 0 560 250" xmlns="http://www.w3.org/2000/svg">
  <text x="130" y="18" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="12.5" font-weight="700" fill="#c4a35a">Hidden Terminal</text>
  <circle cx="60" cy="140" r="80" fill="none" stroke="#7c9ec9" stroke-dasharray="4,3"></circle>
  <circle cx="200" cy="140" r="80" fill="none" stroke="#8dbf8d" stroke-dasharray="4,3"></circle>
  <circle cx="60" cy="140" r="8" fill="#7c9ec9"></circle><text x="60" y="165" text-anchor="middle" font-size="11" fill="#e6e4ea">A</text>
  <circle cx="130" cy="140" r="8" fill="#c4a35a"></circle><text x="130" y="165" text-anchor="middle" font-size="11" fill="#e6e4ea">B</text>
  <circle cx="200" cy="140" r="8" fill="#8dbf8d"></circle><text x="200" y="165" text-anchor="middle" font-size="11" fill="#e6e4ea">C</text>
  <line x1="68" y1="138" x2="122" y2="138" stroke="#7c9ec9" stroke-width="1.6"></line>
  <line x1="192" y1="142" x2="138" y2="142" stroke="#8dbf8d" stroke-width="1.6"></line>
  <text x="130" y="225" text-anchor="middle" font-size="10" fill="#9a97a3">A &amp; C can't hear each other — both</text>
  <text x="130" y="238" text-anchor="middle" font-size="10" fill="#9a97a3">send to B at once → collision at B</text>

  <g transform="translate(280,0)">
    <text x="130" y="18" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="12.5" font-weight="700" fill="#c4a35a">Exposed Terminal</text>
    <circle cx="130" cy="140" r="80" fill="none" stroke="#c4a35a" stroke-dasharray="4,3"></circle>
    <circle cx="60" cy="140" r="8" fill="#7c9ec9"></circle><text x="60" y="165" text-anchor="middle" font-size="11" fill="#e6e4ea">A</text>
    <circle cx="130" cy="140" r="8" fill="#c4a35a"></circle><text x="130" y="165" text-anchor="middle" font-size="11" fill="#e6e4ea">B</text>
    <circle cx="200" cy="140" r="8" fill="#8dbf8d"></circle><text x="200" y="165" text-anchor="middle" font-size="11" fill="#e6e4ea">C</text>
    <circle cx="245" cy="90" r="8" fill="#c98a7c"></circle><text x="245" y="115" text-anchor="middle" font-size="11" fill="#e6e4ea">D</text>
    <line x1="122" y1="138" x2="68" y2="138" stroke="#c4a35a" stroke-width="1.6"></line>
    <line x1="207" y1="132" x2="238" y2="98" stroke="#c98a7c" stroke-width="1.6" stroke-dasharray="3,2"></line>
    <text x="130" y="225" text-anchor="middle" font-size="10" fill="#9a97a3">C hears B→A and stays silent, though</text>
    <text x="130" y="238" text-anchor="middle" font-size="10" fill="#9a97a3">C→D would not have interfered</text>
  </g>
</svg>
</div>

<div class="grid2">
  <div class="col cons">
    <h5>Hidden Terminal Problem</h5>
    <p style="font-size:0.87rem; margin:0;">A talks to C. B can't hear A (out of range) and thinks C is idle, so B also transmits to C — causing a <strong>collision at C</strong>. B is "hidden" from A.</p>
  </div>
  <div class="col cons">
    <h5>Exposed Terminal Problem</h5>
    <p style="font-size:0.87rem; margin:0;">A is talking to some other station. C is in range of A and senses the channel busy, so C refrains from talking to B — even though B and C could safely communicate. A is "exposed" to C.</p>
  </div>
</div>

<h4>MACA (Multiple Access with Collision Avoidance)</h4>

<div class="diagram-wrap">
<svg viewBox="0 0 460 190" xmlns="http://www.w3.org/2000/svg">
  <text x="70" y="18" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#c4a35a">A</text>
  <text x="230" y="18" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#c4a35a">B (receiver)</text>
  <text x="390" y="18" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#c4a35a">C (nearby)</text>
  <line x1="70" y1="25" x2="70" y2="175" stroke="#2e2c35"></line>
  <line x1="230" y1="25" x2="230" y2="175" stroke="#2e2c35"></line>
  <line x1="390" y1="25" x2="390" y2="175" stroke="#2e2c35"></line>

  <defs><marker id="arwM" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#7c9ec9"></path></marker></defs>

  <line x1="70" y1="45" x2="226" y2="45" stroke="#7c9ec9" stroke-width="1.6" marker-end="url(#arwM)"></line><text x="150" y="40" text-anchor="middle" font-size="10" fill="#7c9ec9">RTS</text>
  <line x1="70" y1="45" x2="386" y2="45" stroke="#7c9ec9" stroke-width="1" stroke-dasharray="2,2" opacity="0.5"></line>
  <text x="390" y="60" text-anchor="middle" font-size="9" fill="#9a97a3">hears RTS → stays silent</text>

  <line x1="230" y1="85" x2="74" y2="85" stroke="#8dbf8d" stroke-width="1.6" marker-end="url(#arwM)"></line><text x="150" y="80" text-anchor="middle" font-size="10" fill="#8dbf8d">CTS</text>
  <line x1="230" y1="85" x2="386" y2="85" stroke="#8dbf8d" stroke-width="1.6" marker-end="url(#arwM)"></line><text x="310" y="80" text-anchor="middle" font-size="10" fill="#8dbf8d">CTS</text>
  <text x="390" y="102" text-anchor="middle" font-size="9" fill="#9a97a3">hears CTS → stays silent too</text>

  <rect x="70" y="120" width="160" height="26" fill="#c4a35a"></rect><text x="150" y="137" text-anchor="middle" font-size="10.5" fill="#0f0e11" font-weight="700">A transmits DATA to B</text>
  <text x="150" y="165" text-anchor="middle" font-size="9.5" fill="#9a97a3">C now knows to stay silent for the whole exchange — collision avoided</text>
</svg>
</div>

<ul>
  <li>Sender stimulates the receiver into sending a short frame first, alerting nearby stations to stay silent.</li>
  <li><strong>RTS</strong> (Request To Send, ~30 bytes, contains data length) sent by A → <strong>CTS</strong> (Clear To Send, echoes data length) sent back by B → A then transmits data.</li>
  <li>Stations hearing RTS stay silent (near A); stations hearing CTS stay silent (near B) — solves the <strong>hidden terminal</strong> problem only.</li>
  <li>Collisions still possible if RTS frames from 2 senders collide — resolved via random backoff.</li>
</ul>

<h4>MACAW (MACA for Wireless)</h4>
<ul>
  <li>Improves MACA: adds <strong>ACK frames</strong> at DLL for each successful data frame.</li>
  <li>Adds carrier sensing (avoids simultaneous RTS).</li>
  <li>Runs backoff separately per source-destination stream.</li>
  <li>Solves <strong>both</strong> hidden and exposed terminal problems.</li>
</ul>

<div class="callout example"><span class="co-label">Example</span>
In plain MACA, C (exposed to A but wanting to talk to D) would still stay silent after overhearing A's RTS — even though a C→D exchange wouldn't disturb A/B's link. MACAW's added carrier sensing and ACK-based bookkeeping let C recognize this and transmit safely, recovering wasted capacity.
</div>

<h4>IEEE 802.11 (Wi-Fi) Basics</h4>
<ul>
  <li>Operates on 2.4 GHz, 5 GHz, 6 GHz, and 60 GHz frequency bands.</li>
  <li><strong>BSS</strong> (Basic Service Set) — building block: wireless stations + optional central <strong>AP</strong> (Access Point).</li>
  <li><strong>ESS</strong> (Extended Service Set) — 2+ BSSs connected via a distribution system (usually a wired LAN).</li>
  <li>Two configurations: <strong>infrastructure mode</strong> (with AP/base station) and <strong>ad-hoc mode</strong> (without one).</li>
</ul>

<h4>802.11 MAC Modes</h4>
<table>
<thead><tr><th>Mode</th><th>Description</th></tr></thead>
<tbody>
<tr><td><strong>DCF</strong> (Distributed Coordination Function)</td><td>No central control; uses physical + virtual channel sensing. <strong>Mandatory</strong> in all implementations</td></tr>
<tr><td><strong>PCF</strong> (Point Coordination Function)</td><td>Base station controls all activity in its cell. <strong>Optional</strong></td></tr>
</tbody>
</table>

<h4>802.11 Frame Structure</h4>

<div class="diagram-wrap">
<svg viewBox="0 0 780 130" xmlns="http://www.w3.org/2000/svg">
  <g font-family="Segoe UI,sans-serif" font-size="10.5" text-anchor="middle">

    <rect x="110" y="35" width="70" height="55" fill="#8dbf8d"></rect><text x="145" y="60" fill="#0f0e11" font-weight="700">Duration</text><text x="145" y="72" fill="#0f0e11" font-size="9">2 B</text>
    <rect x="180" y="35" width="90" height="55" fill="#c4a35a"></rect><text x="225" y="60" fill="#0f0e11" font-weight="700">Address 1</text><text x="225" y="72" fill="#0f0e11" font-size="9">6 B</text>
    <rect x="270" y="35" width="90" height="55" fill="#c4a35a"></rect><text x="315" y="60" fill="#0f0e11" font-weight="700">Address 2</text><text x="315" y="72" fill="#0f0e11" font-size="9">6 B</text>
    <rect x="360" y="35" width="90" height="55" fill="#c4a35a"></rect><text x="405" y="60" fill="#0f0e11" font-weight="700">Address 3</text><text x="405" y="72" fill="#0f0e11" font-size="9">6 B</text>
    <rect x="450" y="35" width="70" height="55" fill="#7c9ec9"></rect><text x="485" y="60" fill="#0f0e11" font-weight="700">Sequence</text><text x="485" y="72" fill="#0f0e11" font-size="9">2 B</text>
    <rect x="520" y="35" width="90" height="55" fill="#c4a35a"></rect><text x="565" y="60" fill="#0f0e11" font-weight="700">Address 4</text><text x="565" y="72" fill="#0f0e11" font-size="9">6 B</text>
    <rect x="610" y="35" width="100" height="55" fill="#c98a7c"></rect><text x="660" y="60" fill="#0f0e11" font-weight="700">Data</text><text x="660" y="72" fill="#0f0e11" font-size="9">0–2312 B</text>
    <rect x="710" y="35" width="60" height="55" fill="#8dbf8d"></rect><text x="740" y="60" fill="#0f0e11" font-weight="700">CRC</text><text x="740" y="72" fill="#0f0e11" font-size="9">4 B</text>
  </g>
  <g stroke="#2e2c35" fill="none"><rect x="20" y="35" width="90" height="55"></rect><rect x="110" y="35" width="70" height="55"></rect><rect x="180" y="35" width="90" height="55"></rect><rect x="270" y="35" width="90" height="55"></rect><rect x="360" y="35" width="90" height="55"></rect><rect x="450" y="35" width="70" height="55"></rect><rect x="520" y="35" width="90" height="55"></rect><rect x="610" y="35" width="100" height="55"></rect><rect x="710" y="35" width="60" height="55"></rect></g>
  <text x="20" y="20" font-size="11" fill="#9a97a3">802.11 MAC Frame — the unusual part is 4 address fields, not 2 (needed for AP-relayed traffic)</text>
  <text x="20" y="112" font-size="10" fill="#9a97a3">Addr 1/2 = immediate sender/receiver (may be an AP) · Addr 3 = original source or final dest · Addr 4 = used only in AP-to-AP wireless bridging</text>
</svg>
</div>

<ul>
  <li><strong>Frame Control</strong> fields: Version, Type (Data/Control/Management), Subtype (RTS/CTS), To-DS, From-DS, More Fragments, Retry, Power, More Data, WEP encryption flag, Strict Order flag.</li>
  <li><strong>Duration</strong> — channel occupation time; <strong>Four Address fields</strong> (source, dest, + 2 base station addresses); <strong>Sequence</strong> (16 bits: 12 for frame ID, 4 for fragment); <strong>Data</strong> (up to 2312 bytes); <strong>Checksum</strong> (4-byte CRC).</li>
  <li><strong>Frame types:</strong> Management (single-cell only), Control (RTS/CTS/ACK — short, few addresses), Data (actual payload).</li>
</ul>

<div class="callout note"><span class="co-label">Note — Why 4 Addresses?</span>
A wired Ethernet frame only ever needs source + destination. In infrastructure-mode Wi-Fi, a frame often bounces through an <strong>Access Point</strong>, so the MAC layer needs to separately track "who physically sent this hop" and "who is the original/final endpoint." The 4th address only comes into play for AP-to-AP wireless distribution links.
</div>

<div class="card-body">
<p>Devices used to connect LANs/WANs together or to the Internet, operating at different OSI layers.</p>

<h4>Layers of Operation</h4>
<table>
<thead><tr><th>Device</th><th>Layer(s)</th></tr></thead>
<tbody>
<tr><td>Passive Hub</td><td>Below Physical Layer</td></tr>
<tr><td>Repeater / Active Hub</td><td>Physical Layer (Layer 1)</td></tr>
<tr><td>Bridge / Two-layer Switch</td><td>Physical + Data Link (Layers 1–2)</td></tr>
<tr><td>Router / Three-layer Switch</td><td>Physical + Data Link + Network (Layers 1–3)</td></tr>
<tr><td>Gateway</td><td>All layers (up to Application)</td></tr>
</tbody>
</table>

<h4>Device Details</h4>
<ul>
  <li><strong>Passive Hub</strong> — just a wire connector; in star topology it's the collision point.</li>
  <li><strong>Repeater</strong> — regenerates a weakening/corrupted signal, physical layer device; used to overcome bus-topology length limits.</li>
  <li><strong>Active Hub</strong> — a multiport repeater; when A sends to B, hub forwards to <em>all</em> ports; only B keeps the data, others discard it. Has no data-link address awareness.</li>

<div class="diagram-wrap">
<svg viewBox="0 0 520 190" xmlns="http://www.w3.org/2000/svg">
  <text x="130" y="16" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#c4a35a">Active Hub — floods every port</text>
  <circle cx="130" cy="90" r="26" fill="#c4a35a"></circle><text x="130" y="95" text-anchor="middle" font-size="11" font-weight="700" fill="#0f0e11">HUB</text>
  <circle cx="35" cy="35" r="14" fill="#7c9ec9"></circle><text x="35" y="39" text-anchor="middle" font-size="10" fill="#0f0e11" font-weight="700">A</text>
  <circle cx="35" cy="145" r="14" fill="#8dbf8d"></circle><text x="35" y="149" text-anchor="middle" font-size="10" fill="#0f0e11" font-weight="700">B</text>
  <circle cx="225" cy="35" r="14" fill="#8dbf8d"></circle><text x="225" y="39" text-anchor="middle" font-size="10" fill="#0f0e11" font-weight="700">C</text>
  <circle cx="225" cy="145" r="14" fill="#8dbf8d"></circle><text x="225" y="149" text-anchor="middle" font-size="10" fill="#0f0e11" font-weight="700">D</text>
  <line x1="47" y1="42" x2="112" y2="80" stroke="#7c9ec9" stroke-width="2"></line>
  <line x1="112" y1="100" x2="47" y2="138" stroke="#9a97a3" stroke-width="1.6" stroke-dasharray="3,2"></line>
  <line x1="148" y1="80" x2="213" y2="42" stroke="#9a97a3" stroke-width="1.6" stroke-dasharray="3,2"></line>
  <line x1="148" y1="100" x2="213" y2="138" stroke="#9a97a3" stroke-width="1.6" stroke-dasharray="3,2"></line>
  <text x="130" y="175" text-anchor="middle" font-size="10" fill="#9a97a3">A sends to B — hub blindly re-broadcasts to B, C, and D alike; only B keeps it</text>

  <g transform="translate(280,0)">
    <text x="130" y="16" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#c4a35a">Bridge — filters by MAC table</text>
    <rect x="105" y="70" width="50" height="40" rx="6" fill="#8dbf8d"></rect><text x="130" y="94" text-anchor="middle" font-size="10" font-weight="700" fill="#0f0e11">Bridge</text>
    <circle cx="35" cy="35" r="14" fill="#7c9ec9"></circle><text x="35" y="39" text-anchor="middle" font-size="10" fill="#0f0e11" font-weight="700">A</text>
    <circle cx="35" cy="145" r="14" fill="#c98a7c"></circle><text x="35" y="149" text-anchor="middle" font-size="10" fill="#0f0e11" font-weight="700">C</text>
    <circle cx="225" cy="35" r="14" fill="#8dbf8d"></circle><text x="225" y="39" text-anchor="middle" font-size="10" fill="#0f0e11" font-weight="700">B</text>
    <circle cx="225" cy="145" r="14" fill="#c98a7c"></circle><text x="225" y="149" text-anchor="middle" font-size="10" fill="#0f0e11" font-weight="700">D</text>
    <line x1="47" y1="42" x2="103" y2="75" stroke="#7c9ec9" stroke-width="2"></line>
    <line x1="157" y1="75" x2="213" y2="42" stroke="#7c9ec9" stroke-width="2"></line>
    <text x="130" y="175" text-anchor="middle" font-size="10" fill="#9a97a3">A sends to B — bridge checks its table, forwards only toward B's segment (C, D never see it)</text>
  </g>
</svg>
<div class="diagram-caption">A hub is "dumb" — it repeats to everyone. A bridge is address-aware — it looks up the destination MAC and only forwards out the port that actually leads there.</div>
</div>
  <li><strong>Bridge</strong> — regenerates signal (physical layer) AND checks MAC addresses (data link layer) for filtering. Maintains a table for forwarding decisions.
    <ul>
      <li><strong>Transparent bridge</strong> — stations are unaware it exists; must (1) forward frames, (2) auto-learn its table, (3) prevent loops.</li>
      <li><strong>Learning bridge</strong> — dynamically builds its address→port table by inspecting source addresses of incoming frames (destination address used for the forwarding decision itself).</li>
    </ul>
  </li>
  <li><strong>Switch</strong> — an intelligent multiport bridge; uses MAC addresses + packet switching; supports unicast/multicast/broadcast; full-duplex; supports error checking.</li>
  <li><strong>Router</strong> — a 3-layer device; regenerates signal, checks physical (MAC) address, AND checks network-layer (IP) address. Connects LANs, WANs, or LANs+WANs into an <strong>internetwork</strong>.</li>
  <li><strong>Gateway</strong> — operates across all 5 (TCP/IP) or 7 (OSI) layers; reads and interprets application messages; connects two internetworks using <em>different</em> models; can provide security by filtering unwanted application-layer messages.</li>
</ul>

<h4>Router vs Repeater vs Bridge 🔥</h4>
<table>
<thead><tr><th>Aspect</th><th>Repeater / Bridge</th><th>Router</th></tr></thead>
<tbody>
<tr><td>Scope</td><td>Connects segments of the <em>same</em> LAN</td><td>Connects <em>independent</em> LANs/WANs into an internetwork</td></tr>
<tr><td>Addressing</td><td>Physical address only</td><td>Has both physical &amp; logical (IP) address per interface</td></tr>
<tr><td>Address on forward</td><td>Bridge does NOT change the physical address</td><td>Router DOES change physical (source &amp; dest) address when forwarding</td></tr>
<tr><td>Packet handling</td><td>Acts on frames matching its own addresses</td><td>Acts only on packets whose destination matches its interface</td></tr>
</tbody>
</table>

<div class="callout warn"><span class="co-label">Common Mistake</span>
A frequent exam trap: students say bridges and routers both "forward based on address" without distinguishing that a <strong>bridge forwards using the unchanged MAC address</strong>, while a <strong>router rewrites the MAC address at each hop</strong> (based on IP routing) while keeping the IP address intact end-to-end.
</div>

<div class="callout example"><span class="co-label">Example — Bridge vs Router Forwarding</span>
Host X sends a frame to Host Y across 3 hops. A <strong>bridge</strong> at each hop just checks the destination MAC address and forwards the exact same frame unchanged — X's and Y's MAC addresses stay in the frame the whole way. A <strong>router</strong> at each hop strips the old MAC header, looks at the destination <em>IP</em> address to decide the next hop, and builds a brand-new MAC header (its own outgoing interface MAC as source, the next router/host's MAC as destination) — while the source/destination <strong>IP addresses never change</strong> end-to-end.
</div>
