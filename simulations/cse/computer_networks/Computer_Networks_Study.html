<h1>Module 4 Part 2</h1>
<p class="sub">Network layer study notes, built from the lecture slides (Dr. Tripti C, DCS, RSET). Topics marked 🔥 are the ones most likely to be asked. No syllabus file was attached, so sections follow the slide order.</p>

<details class="mod" id="m4p2" open><summary>Module 4 Part 2: IPv4, Multicasting &amp; IPv6</summary>
<!-- M1 -->
<details class="sec" id="m1" open><summary>Section 1: IP in the TCP/IP suite &amp; Internet multicasting</summary>

<details class="topic" open><summary>Position of IP in the TCP/IP suite</summary><div>
<p>IP lives in the <b>network layer</b>. It carries data from the transport layer (TCP, UDP, SCTP) over whatever LAN or WAN the data link and physical layers provide.</p>
<div class="stack">
<div>Application: SMTP, FTP, TFTP, DNS, SNMP, DHCP …</div>
<div>Transport: SCTP, TCP, UDP</div>
<div class="ip">Network: IP (with helpers IGMP, ICMP, ARP)</div>
<div>Data link: underlying LAN / WAN technology</div>
<div>Physical</div></div>
<ul><li>Packets at the network layer are called <b>datagrams</b>.</li><li>A datagram = <b>header + data</b>, variable length. The header is 20 to 60 bytes.</li><li><b>Encapsulation:</b> the transport segment (TCP header + application data) becomes the data part of the IP datagram, and IP adds its own header in front.</li></ul>
<h4>Encapsulation</h4><div class="tw"><div class="hdr" style="grid-template-columns:repeat(10,1fr)"><div style="grid-column:span 2" class="x">TCP header</div><div style="grid-column:span 8">Application-layer data</div><div style="grid-column:span 2;background:#3a3520;border-color:#c4a35a">IP header</div><div style="grid-column:span 8" class="f">TCP header + application data = IP payload</div></div></div><div class="co d">A datagram is a variable-length packet with two parts: a header (20-60 bytes) and data.</div>
</div></details>

<details class="topic" open><summary>Internet multicasting <span class="fire">🔥 important</span></summary><div>
<p>Normal IP communication is <b>unicast</b>: one sender, one receiver. Some applications need one process to reach many receivers at once, for example updating distributed systems.</p>
<ul><li>IP supports multicasting using <b>class D addresses</b> (224.0.0.0 to 239.255.255.255).</li><li>Each class D address identifies a <b>group of hosts</b>.</li><li>Delivery is <b>best effort</b>. There is no guarantee every member receives the packet.</li></ul>
<div class="g2">
<div><h4>Permanent groups</h4><ul><li>Always exist, no set-up needed</li><li>Each has a fixed group address</li></ul></div>
<div><h4>Temporary groups</h4><ul><li>Must be created before use</li><li>Processes ask their host to join or leave</li><li>Hosts track which groups their processes belong to</li></ul></div></div>
<div class="tw"><table><tr><th>Permanent address</th><th>Meaning</th></tr>
<tr><td class="mono">224.0.0.1</td><td>All systems on a LAN</td></tr>
<tr><td class="mono">224.0.0.2</td><td>All routers on a LAN</td></tr>
<tr><td class="mono">224.0.0.5</td><td>All OSPF routers on a LAN</td></tr></table></div>
<h4>How membership is tracked (IGMP)</h4>
<ul><li>About <b>once a minute</b>, each multicast router sends a <b>query</b> to all hosts on its LAN.</li><li>Each host replies with the class D addresses it is interested in.</li><li>These queries and responses use <b>IGMP (Internet Group Management Protocol)</b>.</li></ul>
<div class="co n">IGMP is IP protocol number 2 (see the Protocol field in Module 2).</div>
</div></details>
</details>

<!-- M2 -->
<details class="sec" id="m2" open><summary>Section 2: IPv4 datagram &amp; header format</summary>
<details class="topic" open><summary>IPv4 header layout <span class="fire">🔥 important</span></summary><div>
<p>The datagram is up to <b>65,535 bytes</b>. The header is <b>20-60 bytes</b>: 20 fixed bytes plus 0-40 bytes of options and padding. Each row below is 32 bits.</p>
<div class="tw"><div class="hdr" style="grid-template-columns:repeat(32,1fr)">
<div style="grid-column:span 4">VER 4</div><div style="grid-column:span 4">HLEN 4</div><div style="grid-column:span 8">Service type 8</div><div style="grid-column:span 16">Total length 16</div>
<div style="grid-column:span 16" class="f">Identification 16</div><div style="grid-column:span 3" class="f">Flags 3</div><div style="grid-column:span 13" class="f">Fragment offset 13</div>
<div style="grid-column:span 8">Time to live 8</div><div style="grid-column:span 8">Protocol 8</div><div style="grid-column:span 16">Header checksum 16</div>
<div style="grid-column:span 32">Source IP address (32)</div><div style="grid-column:span 32">Destination IP address (32)</div>
<div style="grid-column:span 32" class="o">Options + padding (0 to 40 bytes)</div></div></div>
<p style="color:var(--mu);font-size:13px">Green fields are used in fragmentation.</p>
<div class="tw"><table><tr><th>Field</th><th>Size</th><th>Purpose</th></tr>
<tr><td>VER</td><td>4 bits</td><td>IP version (4 or 6)</td></tr>
<tr><td>HLEN</td><td>4 bits</td><td>Header length in <b>4-byte words</b></td></tr>
<tr><td>Service type</td><td>8 bits</td><td>Differentiated services (earlier called TOS)</td></tr>
<tr><td>Total length</td><td>16 bits</td><td>Whole datagram in bytes</td></tr>
<tr><td>Identification, Flags, Fragment offset</td><td>16 / 3 / 13</td><td>Fragmentation</td></tr>
<tr><td>Time to live</td><td>8 bits</td><td>Datagram lifetime, decremented per router</td></tr>
<tr><td>Protocol</td><td>8 bits</td><td>Which higher-level protocol uses IP</td></tr>
<tr><td>Header checksum</td><td>16 bits</td><td>Error check on the header</td></tr>
<tr><td>Source / Destination</td><td>32 bits each</td><td>IPv4 addresses</td></tr></table></div>
<h4>Formulas</h4>
<pre>Header length (bytes) = HLEN × 4        20-byte header → HLEN = 5
Data length           = Total length − Header length
Max total length      = 2^16 − 1 = 65,535 bytes</pre>
<div class="co e">HLEN = 5 means 5 × 4 = 20 bytes (no options). HLEN = 15 gives the maximum 60 bytes.</div>
<div class="co w">HLEN counts <b>4-byte words</b>, not bytes. Total length counts <b>bytes</b>.</div>
</div></details>

<details class="topic" open><summary>Service type (differentiated services)</summary><div>
<ul><li>8 bits = <b>6-bit codepoint</b> + 2 unused bits.</li><li><b>Precedence interpretation:</b> first 3 bits give the datagram priority 0-7. The next 3 bits are the flags <b>D, T, R</b>: the host cares about delay, throughput or reliability.</li><li><b>Differential service interpretation:</b> the 6-bit codepoint is read as a whole.</li></ul>
<div class="tw"><div class="hdr" style="grid-template-columns:repeat(8,1fr)"><div style="grid-column:span 3" class="f">Precedence: priority 0-7</div><div style="grid-column:span 3" class="x">D T R flags</div><div style="grid-column:span 2" class="o">Unused</div><div style="grid-column:span 6">Differentiated services: 6-bit codepoint</div><div style="grid-column:span 2" class="o">Unused</div></div></div><div class="tw"><table><tr><th>Category</th><th>Codepoint</th><th>Assigning authority</th></tr>
<tr><td>1</td><td class="mono">XXXXX0</td><td>Internet</td></tr><tr><td>2</td><td class="mono">XXXX11</td><td>Local</td></tr><tr><td>3</td><td class="mono">XXXX01</td><td>Temporary or experimental</td></tr></table></div>
</div></details>

<details class="topic" open><summary>Total length, TTL, Protocol, checksum &amp; addresses <span class="fire">🔥 important</span></summary><div>
<ul><li><b>Total length (16 bits):</b> limited to 65,535 bytes because the field is 16 bits.</li><li><b>Time to live (8 bits):</b> a counter set to roughly twice the maximum number of routers between any two hosts. <b>Each router decrements it.</b> The datagram is <b>discarded at zero</b>, so it limits a packet's journey and stops loops.</li><li><b>Protocol (8 bits):</b> tells the receiving IP which protocol gets the data.</li></ul>
<div class="tw"><table><tr><th>Value</th><th>Protocol</th></tr><tr><td class="mono">1</td><td>ICMP</td></tr><tr><td class="mono">2</td><td>IGMP</td></tr><tr><td class="mono">4</td><td>IP-in-IP encapsulation</td></tr><tr><td class="mono">6</td><td>TCP</td></tr><tr><td class="mono">17</td><td>UDP</td></tr></table></div>
<div class="co n">Memory aid: 1 ICMP, 2 IGMP, 6 TCP, 17 UDP.</div>
</div></details>
</details>

<!-- M3 -->
<details class="sec" id="m3" open><summary>Section 3: Fragmentation (IPv4)</summary>
<details class="topic" open><summary>Why fragment? MTU <span class="fire">🔥 important</span></summary><div>
<p>An IP datagram can be 65,535 bytes, but the data link layer sets a smaller limit called the <b>MTU</b>.</p>
<div class="co d"><b>MTU (Maximum Transmission Unit):</b> the largest IP datagram a data link protocol can carry in one frame.</div>
<div class="g2"><div><h4>Typical MTUs</h4><ul><li>Ethernet: 1500</li><li>802.3: 1492</li><li>FDDI: 4352</li><li>802.5: 4464</li><li>ATM AAL5: 9180</li><li>PPP: 296</li></ul></div>
<div><h4>The problem</h4><ul><li>The datagram may exceed the MTU</li><li>Different networks on one route have different MTUs</li></ul><p>Fix: <b>fragmentation</b>. Example: Host A → FDDI (4352) → router → Ethernet (1500) → Host B. The router must split big datagrams.</p></div></div>
<div class="tw"><div class="hdr" style="grid-template-columns:repeat(5,1fr)"><div>Host A</div><div class="f">FDDI<br>MTU 4352</div><div class="x">Router<br>fragments here</div><div class="f">Ethernet<br>MTU 1500</div><div>Host B<br>reassembles</div></div></div><h4>Rules</h4>
<ul><li>Fragmentation can happen at the <b>sender or any intermediate router</b>.</li><li>The same datagram can be fragmented <b>several times</b>.</li><li><b>Reassembly happens only at the destination host.</b></li></ul>
</div></details>

<details class="topic" open><summary>Fragmentation fields &amp; worked example <span class="fire">🔥 numericals</span></summary><div>
<ul><li><b>Identification (16):</b> same value in every fragment of one datagram.</li><li><b>Flags (3):</b> first bit unused. <b>D</b> (do not fragment): if set and the MTU is too small, the datagram is <b>discarded</b>. <b>M</b> (more fragments): if set, this is <b>not the last</b> fragment.</li><li><b>Fragment offset (13):</b> position of this fragment's data in the original datagram, <b>in units of 8 bytes</b>.</li></ul>
<pre>Offset field = (starting byte of fragment data) / 8
Data in every fragment except the last must be a multiple of 8</pre>
<div class="co e"><b>Slide example.</b> Original data is bytes 0 to 3999 (4000 bytes). Fragments of 1400 bytes:
<div class="tw"><table><tr><th>Fragment</th><th>Bytes</th><th>Offset</th><th>M bit</th></tr>
<tr><td>1</td><td>0 – 1399</td><td>0/8 = 0</td><td>1</td></tr><tr><td>2</td><td>1400 – 2799</td><td>1400/8 = 175</td><td>1</td></tr><tr><td>3</td><td>2800 – 3999</td><td>2800/8 = 350</td><td>0</td></tr></table></div></div>
<svg viewBox="0 0 600 120" width="100%" role="img" aria-label="4000-byte datagram split into three fragments">
<rect x="10" y="10" width="580" height="26" fill="#3a2133" stroke="#b0669a"/><text x="20" y="28">Original data: byte 0 … 3999</text>
<rect x="10" y="60" width="200" height="26" fill="#26323f" stroke="#7c9ec9"/><text x="18" y="78">F1: 0-1399, off 0, M=1</text>
<rect x="212" y="60" width="200" height="26" fill="#26323f" stroke="#7c9ec9"/><text x="220" y="78">F2: 1400-2799, off 175, M=1</text>
<rect x="414" y="60" width="176" height="26" fill="#2f3a2f" stroke="#8dbf8d"/><text x="420" y="78">F3: 2800-3999, off 350, M=0</text>
<text x="10" y="108" style="fill:#a09cab">Each fragment gets its own IP header with the same Identification.</text></svg>
<div class="co w">The offset field stores bytes ÷ 8, not the raw byte number. Writing 1400 instead of 175 loses marks.</div>
<div class="co n">With a 20-byte header and MTU 1500, the maximum data per fragment is 1480 (1480 is divisible by 8).</div>
</div></details>
</details>

<!-- M4 -->
<details class="sec" id="m4" open><summary>Section 4: IPv6 introduction &amp; address notation</summary>
<details class="topic" open><summary>Why IPv6? Features <span class="fire">🔥 important</span></summary><div>
<p>The main reason for migrating is the <b>small IPv4 address space</b> (32 bits). IPv6 uses <b>128-bit (16-byte) addresses</b>, giving 2<sup>128</sup> addresses and effectively no depletion.</p>
<ul><li>IPv6 keeps the good features of IP and drops the bad ones.</li><li>Compatible with TCP, UDP, ICMP, IGMP, OSPF, BGP, DNS and others.</li><li><b>Simplified header</b>, so routers process packets faster.</li><li><b>Better security</b> (authentication and encryption options).</li><li>Better options handling, room for extension, and support for resource allocation (flow label).</li></ul>
<div class="tw"><table><tr><th></th><th>IPv4</th><th>IPv6</th></tr><tr><td>Address size</td><td>32 bits</td><td>128 bits</td></tr><tr><td>Address count</td><td>2<sup>32</sup></td><td>2<sup>128</sup></td></tr></table></div>
</div></details>

<details class="topic" open><summary>Representations <span class="fire">🔥 important</span></summary><div>
<ul><li><b>Binary:</b> 128 bits.</li><li><b>Colon hexadecimal:</b> eight sections of four hex digits, separated by colons.</li><li><b>Mixed:</b> colon hex plus dotted decimal, e.g. <code>::192.31.20.46</code>.</li><li><b>CIDR:</b> hierarchical addressing with a prefix length, e.g. <code>FDEC::BBFF:0:FFFF/60</code>.</li></ul>
<pre>FEF6:BA98:7654:3210:ADEF:BBFF:2322:FF00     (8 groups × 4 hex digits × 4 bits = 128)</pre>
</div></details>

<details class="topic" open><summary>Abbreviation &amp; zero compression <span class="fire">🔥 numericals</span></summary><div>
<h4>Rule 1: drop leading zeros in a group</h4>
<pre>0074 → 74      000F → F      0000 → 0</pre>
<h4>Rule 2: zero compression</h4>
<ul><li>Replace <b>consecutive</b> all-zero groups with a double colon <code>::</code>.</li><li>Use <code>::</code> <b>only once</b> per address.</li></ul>
<pre>FDEC:0:0:0:0:BBFF:0:FFFF  →  FDEC::BBFF:0:FFFF
8000:0000:0000:0000:0123:4567:89AB:CDEF  →  8000::123:4567:89AB:CDEF</pre>
<div class="co w">The slides say "double semicolon" but it is a double <b>colon</b> (<code>::</code>). Using <code>::</code> twice is invalid because you could not tell how many zeros each one stands for.</div>
<h4>Expanding an address</h4>
<div class="co e"><b>Expand</b> <code>0:16::1:12:1214</code>. It has 5 groups written, so 3 are missing and <code>::</code> becomes 3 groups of zeros. Pad every group to 4 digits:
<pre>0000:0016:0000:0000:0000:0001:0012:1214</pre></div>
<pre>Missing groups = 8 − (groups written)</pre>
</div></details>
</details>

<!-- M5 -->
<details class="sec" id="m5" open><summary>Section 5: IPv6 address space allocation</summary>
<details class="topic" open><summary>Address blocks <span class="fire">🔥 important</span></summary><div>
<p>Like IPv4, the space is split into blocks of different size, each with a special purpose.</p>
<div class="tw"><table><tr><th>Block prefix</th><th>CIDR</th><th>Assignment</th><th>Fraction</th></tr>
<tr><td class="mono">0000 0000</td><td class="mono">0000::/8</td><td>Special addresses</td><td>1/256</td></tr>
<tr><td class="mono">001</td><td class="mono">2000::/3</td><td><b>Global unicast</b></td><td>1/8</td></tr>
<tr><td class="mono">1111 110</td><td class="mono">FC00::/7</td><td>Unique local unicast</td><td>1/128</td></tr>
<tr><td class="mono">1111 1110 10</td><td class="mono">FE80::/10</td><td>Link local</td><td>1/1024</td></tr>
<tr><td class="mono">1111 1111</td><td class="mono">FF00::/8</td><td>Multicast</td><td>1/256</td></tr></table></div>
<ul><li>Two large blocks for <b>private addressing</b>: unique local unicast and link local.</li><li>One large block for <b>multicasting</b>.</li></ul>
<div class="co n">Fraction = 1 / 2<sup>prefix length</sup>. For example /3 gives 1/8.</div>
</div></details>

<details class="topic" open><summary>Global unicast addresses <span class="fire">🔥 important</span></summary><div>
<ul><li>Used for <b>one-to-one</b> communication between two hosts on the Internet.</li><li>Block size is 2<sup>125</sup> addresses (a /3 block of a 128-bit space).</li></ul>
<div class="tw"><div class="hdr" style="grid-template-columns:3fr 1fr 2fr">
<div>Global routing prefix (n bits)<br>first 3 bits = 001, other 45 bits</div><div class="f">Subnet ID<br>16 bits</div><div class="x">Interface ID<br>64 bits</div></div></div>
<div class="tw"><table><tr><th>Part</th><th>Role</th></tr>
<tr><td>Global routing prefix</td><td>Routes the packet across the Internet to the organization's site. 45 free bits give up to 2<sup>45</sup> sites.</td></tr>
<tr><td>Subnet identifier</td><td>Identifies a subnet inside the organization. 16 bits give up to 2<sup>16</sup> = 65,536 subnets.</td></tr>
<tr><td>Interface identifier</td><td>Like the host ID in IPv4. 64 bits.</td></tr></table></div>
<pre>3 + 45 + 16 + 64 = 128 bits</pre>
</div></details>

<details class="topic" open><summary>Interface ID from the MAC address</summary><div>
<p>In IPv4 there is no specific link between host ID and data link address. <b>IPv6 allows one.</b> A 48-bit Ethernet MAC address is stretched to a 64-bit interface ID:</p>
<ul><li>Split the MAC into two 24-bit halves.</li><li>Insert <b>16 added bits</b> (FFFE) between the halves.</li><li>Flip the 7th bit of the first byte (the universal/local bit) from 0 to 1.</li></ul>
<div class="tw"><div class="hdr" style="grid-template-columns:repeat(8,1fr)"><div style="grid-column:span 3">MAC part 1 (24)</div><div style="grid-column:span 2;visibility:hidden"></div><div style="grid-column:span 3">MAC part 2 (24)</div><div style="grid-column:span 3" class="f">Part 1, U/L bit set to 1</div><div style="grid-column:span 2" class="x">FFFE added (16)</div><div style="grid-column:span 3">Part 2 (24)</div></div></div><pre>MAC (48) = [24 bits][24 bits]
ID  (64) = [24 bits][FFFE][24 bits]   with the U/L bit set to 1</pre>
<div class="co n">The slide's diagram shows the added bits as 11111111 11111110, which is FFFE.</div>
</div></details>

<details class="topic" open><summary>IPv4 addresses inside IPv6 (transition)</summary><div>
<p>During the move from IPv4 to IPv6, hosts can embed IPv4 addresses in IPv6 addresses. Two formats exist:</p>
<div class="g2"><div><h4>Compatible address</h4><p>96 zero bits followed by the 32-bit IPv4 address, e.g. <code>::192.31.20.46</code>. Used by an IPv6 host talking over an IPv4 network.</p></div>
<div><h4>Mapped address</h4><p>Used when a computer that has already migrated to IPv6 sends to a computer that still uses IPv4. Standard form: 80 zero bits, 16 one bits (<code>FFFF</code>), then the IPv4 address.</p></div></div>
</div></details>
</details>

<!-- M6 -->
<details class="sec" id="m6" open><summary>Section 6: IPv6 datagram format &amp; extension headers</summary>
<details class="topic" open><summary>Main (base) IPv6 header <span class="fire">🔥 important</span></summary><div>
<div class="tw"><div class="hdr" style="grid-template-columns:repeat(32,1fr)">
<div style="grid-column:span 4">Version 4</div><div style="grid-column:span 8">Traffic class 8</div><div style="grid-column:span 20">Flow label 20</div>
<div style="grid-column:span 16">Payload length 16</div><div style="grid-column:span 8">Next header 8</div><div style="grid-column:span 8">Hop limit 8</div>
<div style="grid-column:span 32;padding:16px" class="f">Source address (128 bits = 16 bytes)</div>
<div style="grid-column:span 32;padding:16px" class="f">Destination address (128 bits = 16 bytes)</div></div></div>
<div class="tw"><table><tr><th>Field</th><th>Size</th><th>Meaning</th></tr>
<tr><td>Version</td><td>4 bits</td><td>Value 6</td></tr>
<tr><td>Traffic class</td><td>8 bits</td><td>Separates payloads with different delivery needs (same as differentiated services in IPv4)</td></tr>
<tr><td>Flow label</td><td>20 bits</td><td>Handles the flow of data. Lets a source and destination set up a <b>pseudoconnection</b> with specific requirements (e.g. delay)</td></tr>
<tr><td>Payload length</td><td>16 bits</td><td>Bytes that follow the 40-byte base header (extension headers + data)</td></tr>
<tr><td>Next header</td><td>8 bits</td><td>Type of the first extension header, or of the data that follows (TCP/UDP). Similar to the IPv4 Protocol field</td></tr>
<tr><td>Hop limit</td><td>8 bits</td><td>Same as IPv4 TTL; decremented each hop, packet dropped at 0</td></tr>
<tr><td>Source / Destination</td><td>128 bits each</td><td>IPv6 addresses</td></tr></table></div>
<pre>Base header length = 4+8+20 + 16+8+8 + 128+128 = 320 bits = 40 bytes (fixed)</pre>
<div class="co d"><b>Flow:</b> a set of packets from one source with the same flow label. A flow is uniquely identified by the <b>source address + a non-zero flow label</b>.</div>
<div class="co w">IPv6 Payload length <b>excludes</b> the 40-byte base header. IPv4 Total length <b>includes</b> its header.</div>
</div></details>

<details class="topic" open><summary>What changed in IPv6</summary><div>
<ul><li><b>Better header format:</b> options are moved out of the base header and inserted only when needed between the base header and the data.</li><li><b>New options</b> for extra functions.</li><li><b>Allowance for extension</b> if new technologies or applications need it.</li><li><b>Resource allocation:</b> traffic class and flow label replace the type of service field so a source can request special handling.</li><li><b>More security:</b> encryption and authentication options give confidentiality and integrity.</li></ul>
</div></details>

<details class="topic" open><summary>Extension headers <span class="fire">🔥 important</span></summary><div>
<p>An IPv6 packet = <b>base header (fixed 40 bytes) + zero or more extension headers + data</b>. There are at most <b>6</b> kinds. Each extension header has two mandatory fields, <b>next header</b> and <b>length</b>, followed by option-specific information. The base header's Next header points to the first extension header, which points to the next, and the last one names the transport protocol.</p>
<div class="tw"><table><tr><th>Extension header</th><th>Purpose</th></tr>
<tr><td>Hop-by-hop options</td><td>Information the source passes to <b>all routers</b> on the path</td></tr>
<tr><td>Destination options</td><td>Information for the <b>destination only</b>; intermediate routers may not read it</td></tr>
<tr><td>Source routing</td><td>Combines IPv4's strict and loose source route options (list of routers to visit)</td></tr>
<tr><td>Fragmentation</td><td>Manages datagram fragments</td></tr>
<tr><td>Authentication</td><td>Validates the sender and ensures data integrity</td></tr>
<tr><td>ESP (Encrypted Security Payload)</td><td>Gives confidentiality and protects against eavesdropping</td></tr></table></div>
<h4>Header chain</h4><div class="tw"><div class="hdr" style="grid-template-columns:repeat(4,1fr)"><div class="o">Base header<br>next = Hop-by-hop</div><div>Hop-by-hop<br>next, length → Routing</div><div>Routing<br>next, length → TCP</div><div class="f">TCP / UDP data</div></div></div><div class="co d">In IPv6, <b>payload</b> = zero or more extension headers + the data from other protocols.</div>
</div></details>

<details class="topic" open><summary>Fragmentation in IPv6 <span class="fire">🔥 important</span></summary><div>
<ul><li>IPv6 datagrams are fragmented <b>only by the source</b>, never by routers.</li><li>Reassembly takes place at the <b>destination</b>.</li><li>Routers do not fragment so they can <b>process packets faster</b>.</li></ul>
<div class="co n">Because routers cannot fragment, the source must find a packet size that fits every link on the path (path MTU discovery).</div>
</div></details>
</details>

<!-- M7 -->
<details class="sec" id="m7" open><summary>Section 7: IPv4 vs IPv6 &amp; quick revision</summary>
<details class="topic" open><summary>IPv4 header vs IPv6 header <span class="fire">🔥 most asked</span></summary><div>
<div class="tw"><table><tr><th>IPv4 field</th><th>In IPv6</th></tr>
<tr><td>Version</td><td>Kept (value 6)</td></tr>
<tr><td>IHL (HLEN)</td><td><b>Removed</b>; header is a fixed 40 bytes</td></tr>
<tr><td>Type of service</td><td><b>Replaced</b> by traffic class (+ flow label)</td></tr>
<tr><td>Total length</td><td><b>Changed</b> to payload length</td></tr>
<tr><td>Identification, Flags, Fragment offset</td><td><b>Removed</b> from base header; moved to the fragmentation extension header</td></tr>
<tr><td>Time to live</td><td><b>Changed</b> to hop limit</td></tr>
<tr><td>Protocol</td><td><b>Changed</b> to next header</td></tr>
<tr><td>Header checksum</td><td><b>Removed</b></td></tr>
<tr><td>Source / Destination (32 bits)</td><td><b>Changed</b> to 128 bits</td></tr>
<tr><td>Options + padding</td><td><b>Removed</b>; replaced by extension headers</td></tr></table></div>
<div class="g2"><div><h4>IPv4</h4><ul><li>32-bit addresses</li><li>Header 20-60 bytes, variable</li><li>Routers can fragment</li><li>Header checksum</li><li>Options inside the header</li></ul></div>
<div><h4>IPv6</h4><ul><li>128-bit addresses</li><li>Header fixed at 40 bytes</li><li>Only the source fragments</li><li>No header checksum</li><li>Extension headers</li></ul></div></div>
</div></details>

<details class="topic" open><summary>Last-minute revision sheet</summary><div>
<ul>
<li>Multicast uses class D (224.0.0.0 – 239.255.255.255). Best effort. IGMP query roughly every minute.</li>
<li>IPv4 header 20-60 bytes. HLEN × 4 = bytes. Max datagram 65,535.</li>
<li>TTL drops by 1 at each router; at 0 the packet is discarded.</li>
<li>Fragment offset = start byte ÷ 8. D = do not fragment. M = more fragments (0 on last).</li>
<li>Reassembly only at the destination.</li>
<li>IPv6: 128 bits, 8 groups of 4 hex digits, <code>::</code> once, 40-byte fixed header, flow label 20 bits.</li>
<li>Global unicast 2000::/3 = 3 + 45 + 16 + 64 bits.</li>
<li>Link local FE80::/10, unique local FC00::/7, multicast FF00::/8.</li>
<li>Six extension headers: hop-by-hop, destination, source routing, fragmentation, authentication, ESP.</li>
<li>IPv6 fragmentation: source only.</li>
</ul>
<div class="co e"><b>Practice:</b> Write <code>2001:0DB8:0000:0000:0000:0000:0000:0001</code> in shortest form. Answer: <code>2001:DB8::1</code>.</div>
</div></details>
</details>
</details>
</main></div></template>

<header class="hero">
 <h1>Module 5: Application Layer</h1>
 <p>FTP · SMTP · DNS · Electronic Mail &amp; MIME · SNMP · World Wide Web (HTTP). 🔥 = frequently examined. Click any heading to collapse it.</p>
</header>

<main>

<!-- ===== INTRO ===== -->
<details class="module" open id="intro">
<summary>0. Application Layer – Overview</summary>
<div class="module-body">
<details class="topic" open><summary>What is the Application Layer?</summary><div class="topic-body">
<p>The <b>application layer</b> is the top layer of the TCP/IP model (Layer 7 of OSI). It provides services <b>directly to the user</b>. The layers below only provide transport services – they do no real work for users.</p>
<ul>
<li><b>Real applications:</b> electronic mail, file transfer, network management, web access.</li>
<li><b>Protocols:</b> FTP, SMTP, MIME, SNMP, HTTP (WWW).</li>
<li><b>Support protocols:</b> even this layer needs helpers, e.g. <b>DNS</b>, which handles naming on the Internet.</li>
</ul>
<h3>Protocol → Transport → Port summary</h3>
<div class="tw"><table>
<tr><th>Protocol</th><th>Transport</th><th>Port(s)</th><th>Purpose</th></tr>
<tr><td>FTP</td><td>TCP</td><td>21 (control), 20 (data)</td><td>File transfer</td></tr>
<tr><td>SMTP</td><td>TCP</td><td>25 (relay), 587 (submission), 465 (legacy SMTPS)</td><td>Send / relay e-mail</td></tr>
<tr><td>DNS</td><td>UDP (sometimes TCP)</td><td>53</td><td>Name → IP mapping</td></tr>
<tr><td>SNMP</td><td>UDP</td><td>161 (agent), 162 (manager / traps)</td><td>Network management</td></tr>
<tr><td>HTTP</td><td>TCP</td><td>80</td><td>Web page transfer</td></tr>
</table></div>
<div class="callout warn"><span class="t">Exam tip</span>This table is a favourite 1-mark / 2-mark question. Memorise ports and TCP vs UDP.</div>
</div></details>
</div></details>

<!-- ===== FTP ===== -->
<details class="module" open id="ftp">
<summary>1. File Transfer Protocol (FTP)</summary>
<div class="module-body">

<details class="topic" open><summary>FTP – Introduction &amp; Purpose <span class="fire">🔥</span></summary><div class="topic-body">
<div class="callout def"><span class="t">Definition</span><b>FTP (File Transfer Protocol)</b> is the standard TCP/IP mechanism for copying a file from one host to another. It works at the application layer and uses <b>TCP</b> for reliable communication.</div>
<h3>Why use FTP?</h3>
<ul>
<li>Upload files from client to server; download files from server.</li>
<li>Transfer large files reliably.</li>
<li>Manage files and directories on a remote server.</li>
<li>Accounts for the greatest volume of data exchange on the Internet.</li>
</ul>
<h3>Problems FTP must deal with</h3>
<ul>
<li>Two systems may use <b>different file-name conventions</b>.</li>
<li>They may represent <b>text and data differently</b>.</li>
<li>They may have <b>different directory structures</b>.</li>
</ul>
</div></details>

<details class="topic" open><summary>FTP Architecture &amp; Two Connections <span class="fire">🔥</span></summary><div class="topic-body">
<p>FTP uses a <b>client–server</b> model. Unlike most client-server applications, FTP opens <b>two connections</b>: one for control and one for data.</p>
<div class="diagram">
<svg viewBox="0 0 700 250" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" font-size="13">
<rect x="20" y="20" width="230" height="210" rx="10" fill="#1e1c22" stroke="#7c9ec9"/>
<text x="135" y="42" fill="#7c9ec9" text-anchor="middle" font-weight="bold">FTP CLIENT</text>
<rect x="40" y="60" width="190" height="34" rx="6" fill="#26232c" stroke="#2e2c35"/><text x="135" y="82" fill="#e6e3ea" text-anchor="middle">User Interface</text>
<rect x="40" y="108" width="190" height="34" rx="6" fill="#26232c" stroke="#c4a35a"/><text x="135" y="130" fill="#c4a35a" text-anchor="middle">Client Control Process</text>
<rect x="40" y="156" width="190" height="34" rx="6" fill="#26232c" stroke="#8dbf8d"/><text x="135" y="178" fill="#8dbf8d" text-anchor="middle">Client Data Transfer Process</text>
<rect x="450" y="20" width="230" height="210" rx="10" fill="#1e1c22" stroke="#7c9ec9"/>
<text x="565" y="42" fill="#7c9ec9" text-anchor="middle" font-weight="bold">FTP SERVER</text>
<rect x="470" y="108" width="190" height="34" rx="6" fill="#26232c" stroke="#c4a35a"/><text x="565" y="130" fill="#c4a35a" text-anchor="middle">Server Control Process</text>
<rect x="470" y="156" width="190" height="34" rx="6" fill="#26232c" stroke="#8dbf8d"/><text x="565" y="178" fill="#8dbf8d" text-anchor="middle">Server Data Transfer Process</text>
<line x1="230" y1="125" x2="470" y2="125" stroke="#c4a35a" stroke-width="2"/>
<text x="350" y="116" fill="#c4a35a" text-anchor="middle">Control connection (port 21)</text>
<text x="350" y="136" fill="#9a96a3" text-anchor="middle" font-size="11">stays open whole session</text>
<line x1="230" y1="173" x2="470" y2="173" stroke="#8dbf8d" stroke-width="2" stroke-dasharray="6 4"/>
<text x="350" y="164" fill="#8dbf8d" text-anchor="middle">Data connection (port 20)</text>
<text x="350" y="193" fill="#9a96a3" text-anchor="middle" font-size="11">opened/closed per file</text>
</svg>
<div class="cap">Basic model of FTP – client has 3 components, server has 2.</div></div>
<div class="grid2">
<div><h4>Control connection</h4><ul><li>Port <b>21</b></li><li>Carries commands &amp; replies</li><li>Simple rules – one line of command/response at a time</li><li><b>Persistent</b> – open for the whole session</li></ul></div>
<div class="g"><h4>Data connection</h4><ul><li>Port <b>20</b> (server side)</li><li>Carries file contents &amp; directory listings</li><li>More complex rules (many data types)</li><li><b>Non-persistent</b> – new one per file</li></ul></div>
</div>
<div class="callout note"><span class="t">Note</span>Because control info travels on a separate connection, FTP is said to send control information <b>out-of-band</b>. Separation of commands and data makes FTP more efficient. Passive FTP may use dynamically assigned server ports for data.</div>
</div></details>

<details class="topic" open><summary>FTP Session – How it works <span class="fire">🔥</span></summary><div class="topic-body">
<ol>
<li>Client initiates a <b>control TCP connection</b> to server port 21.</li>
<li>Client authenticates – sends <code>USER</code> and <code>PASS</code> over the control connection.</li>
<li>Client sends commands (e.g. change directory, list, retrieve).</li>
<li>For a file transfer command, the <b>server initiates a TCP data connection</b> to the client.</li>
<li>FTP sends <b>exactly one file</b> over the data connection and then closes it.</li>
<li>For another file in the same session, a new data connection is opened.</li>
</ol>
<div class="callout def"><span class="t">Key idea</span>Control connection = persistent for the entire session. Data connections = non-persistent, one per file transferred.</div>
</div></details>

<details class="topic" open><summary>FTP Commands &amp; Replies <span class="fire">🔥</span></summary><div class="topic-body">
<p>Commands and replies travel on the control connection in <b>7-bit ASCII</b>, human readable. Successive commands are separated by CR+LF. Each command is <b>four uppercase ASCII characters</b>, some with arguments.</p>
<div class="tw"><table>
<tr><th>Command</th><th>Meaning</th></tr>
<tr><td><code>USER username</code></td><td>Send user identification</td></tr>
<tr><td><code>PASS password</code></td><td>Send password</td></tr>
<tr><td><code>LIST</code></td><td>List files in current remote directory (sent over a new, non-persistent data connection)</td></tr>
<tr><td><code>RETR filename</code></td><td>Retrieve (download / get) a file</td></tr>
<tr><td><code>STOR filename</code></td><td>Store (upload / put) a file</td></tr>
<tr><td><code>DELE</code></td><td>Delete a file</td></tr>
<tr><td><code>CWD</code></td><td>Change working directory without changing login info</td></tr>
<tr><td><code>MKD</code></td><td>Make (create) a directory</td></tr>
<tr><td><code>RMD</code></td><td>Remove a directory</td></tr>
<tr><td><code>PWD</code></td><td>Return name of current working directory</td></tr>
<tr><td><code>ABOR</code></td><td>Abort previous command and any data transfer</td></tr>
<tr><td><code>QUIT</code></td><td>Terminate the session (closes control connection if no transfer in progress)</td></tr>
</table></div>
<p><b>Replies:</b> every command is followed by a reply from server to client – a <b>three-digit number</b> with an optional message.</p>
</div></details>

<details class="topic" open><summary>FTP File Transfer – Type, Structure, Mode <span class="fire">🔥</span></summary><div class="topic-body">
<p>Before transfer, the client must define the <b>file type</b>, the <b>data structure</b> and the <b>transmission mode</b>.</p>
<div class="tw"><table>
<tr><th>Attribute</th><th>Options</th><th>Details</th></tr>
<tr><td rowspan="3"><b>File type</b></td><td>ASCII</td><td>Default for text. 7-bit ASCII; sender converts to ASCII, receiver converts back.</td></tr>
<tr><td>EBCDIC</td><td>Used if one/both ends use IBM's EBCDIC encoding.</td></tr>
<tr><td>Image</td><td>Default for binary files. Continuous stream of bits, no interpretation or encoding.</td></tr>
<tr><td rowspan="3"><b>Data structure</b></td><td>File structure</td><td>No internal structure – continuous byte stream.</td></tr>
<tr><td>Record structure</td><td>Divided into sequential records (text files only).</td></tr>
<tr><td>Page structure</td><td>Divided into pages, each with page number &amp; header; random or sequential access.</td></tr>
<tr><td rowspan="3"><b>Transmission mode</b></td><td>Stream (default)</td><td>Continuous byte stream to TCP; TCP segments it. End-of-file = sender closes data connection (for file structure). Record structure uses 1-byte EOR and 1-byte EOF.</td></tr>
<tr><td>Block</td><td>Data in blocks; each preceded by a <b>3-byte header</b>: 1 byte block descriptor + 2 bytes block size.</td></tr>
<tr><td>Compressed</td><td>Uses <b>run-length encoding</b>: repeated data units replaced by one occurrence + count (spaces in text, nulls in binary).</td></tr>
</table></div>
</div></details>

<details class="topic" open><summary>FTP Java Socket Program (Example)</summary><div class="topic-body">
<div class="callout ex"><span class="t">Example</span>Simple file transfer with Java TCP sockets. <b>Run the server first, then the client.</b> FTPServer receives and saves a file; FTPClient reads and sends a file (port 5000).</div>
<h3>FTPServer.java</h3>
<pre class="java">import java.io.*;
import java.net.*;
public class FTPServer {
  public static void main(String[] args) throws Exception {
    ServerSocket ss = new ServerSocket(5000);
    System.out.println("Server started...");
    Socket s = ss.accept();                       // wait for client
    DataInputStream dis = new DataInputStream(s.getInputStream());
    String fileName = dis.readUTF();              // read file name
    FileOutputStream fos = new FileOutputStream("received_" + fileName);
    byte[] buffer = new byte[4096];
    int bytesRead;
    while ((bytesRead = dis.read(buffer)) != -1) {
      fos.write(buffer, 0, bytesRead);            // save bytes
    }
    fos.close(); dis.close(); s.close(); ss.close();
    System.out.println("File received successfully.");
  }
}</pre>
<h3>FTPClient.java</h3>
<pre class="java">import java.io.*;
import java.net.*;
public class FTPClient {
  public static void main(String[] args) throws Exception {
    Socket s = new Socket("localhost", 5000);
    DataOutputStream dos = new DataOutputStream(s.getOutputStream());
    File file = new File("test.txt");
    dos.writeUTF(file.getName());                 // send file name first
    FileInputStream fis = new FileInputStream(file);
    byte[] buffer = new byte[4096];
    int bytesRead;
    while ((bytesRead = fis.read(buffer)) != -1) {
      dos.write(buffer, 0, bytesRead);            // send bytes
    }
    fis.close(); dos.close(); s.close();
    System.out.println("File sent successfully.");
  }
}</pre>
<ul>
<li><b>Server:</b> <code>ServerSocket</code> → <code>accept()</code> → read file name (<code>readUTF</code>) → read bytes in 4096-byte buffer → write to <code>received_&lt;name&gt;</code>.</li>
<li><b>Client:</b> <code>Socket</code> → send file name → read file in 4096-byte chunks → send → close.</li>
</ul>
<div class="callout warn"><span class="t">Common mistake</span>This is only a <i>basic idea</i> using one TCP connection. Real FTP uses two connections and commands like USER/PASS/RETR/STOR.</div>
</div></details>

<details class="topic" open><summary>FTP – Slide figures (file transfer &amp; NVT ASCII)</summary><div class="topic-body">
<div class="callout note"><span class="t">From the slides</span>
<ul>
<li><b>File-transfer figure:</b> the <b>client defines</b> the file type, data structure and transmission mode. Each side has a <b>data transfer process</b> that talks to its own local storage (which may use a different local data type and structure); the two processes exchange data over the data connection.</li>
<li><b>Commands figure:</b> the control processes at client and server exchange commands/responses over the control connection using <b>NVT ASCII</b> (Network Virtual Terminal ASCII – the common 7-bit format); each side converts to/from its own local code.</li>
<li>Every command the user issues maps one-to-one to an FTP command sent on the control connection, and each is followed by a reply (3-digit number + optional text).</li>
</ul></div>
</div></details>

</div></details>

<details class="module" open id="smtp">
<summary>2. Simple Mail Transfer Protocol (SMTP)</summary>
<div class="module-body">

<details class="topic" open><summary>SMTP – Introduction &amp; Features <span class="fire">🔥</span></summary><div class="topic-body">
<div class="callout def"><span class="t">Definition</span><b>SMTP</b> is an application-layer TCP/IP protocol used to <b>send and relay</b> e-mail messages across networks reliably.</div>
<ul>
<li><b>Layer:</b> Application (Layer 7).</li>
<li><b>Transport:</b> TCP – connection-oriented, reliable.</li>
<li><b>Type:</b> <b>Push protocol</b> – only pushes (sends) mail from client to server or server to server.</li>
<li><b>Pull protocols</b> (POP3, IMAP) are used by e-mail clients to fetch/download mail.</li>
<li><b>Standardised communication:</b> lets Gmail, Outlook, Yahoo etc. interoperate.</li>
<li><b>Server-to-server relaying</b> through intermediate MTAs until the destination server.</li>
<li><b>Queueing &amp; retry:</b> if the recipient server is down, the message is queued and retried at intervals.</li>
<li><b>Delivery assurance:</b> TCP handshakes + multi-digit status codes (220, 250, 354, 550).</li>
<li>Originally RFC 821, now <b>RFC 5321</b>. It is a simple <b>ASCII</b> protocol (easy to develop, test, debug). No checksums needed because TCP is reliable.</li>
</ul>
</div></details>

<div class="cap">E-mail delivery ecosystem</div></div>
<div class="tw"><table>
<tr><th>Component</th><th>Role</th><th>Examples</th></tr>
<tr><td><b>MUA</b> – Mail User Agent</td><td>Client app where users draft, read and send e-mails</td><td>Thunderbird, Apple Mail, webmail</td></tr>

<details class="topic" open><summary>How SMTP Works – Execution Flow &amp; Dialog <span class="fire">🔥</span></summary><div class="topic-body">
<ol>
<li><b>TCP connection setup</b> – client connects to SMTP server on port 25, 587 or 465.</li>
<li><b>Service greeting</b> – server replies <code>220</code> (ready). The server speaks first.</li>
<li><b>EHLO / HELO</b> – client identifies itself.</li>
<li><b>MAIL FROM</b> – envelope sender address.</li>
<li><b>RCPT TO</b> – one or more recipients (each individually accepted/rejected).</li>
<li><b>DATA</b> – server replies <code>354</code>; client sends headers + body, ending with a line containing only a period <code>.</code></li>
<li><b>QUIT</b> – server replies <code>221</code> and closes.</li>
</ol>
<div class="callout ex"><span class="t">Sample dialog (C = client, S = server)</span>
<pre>S: 220 mail.example.com ESMTP ready
C: EHLO client.domain.com
S: 250 Hello client.domain.com
C: MAIL FROM:&lt;alice@example.com&gt;
S: 250 2.1.0 Sender OK
C: RCPT TO:&lt;bob@example.com&gt;
S: 250 2.1.5 Recipient OK
C: DATA
S: 354 Start mail input; end with &lt;CRLF&gt;.&lt;CRLF&gt;
C: From: alice@example.com
C: To: bob@example.com
C: Subject: Hello
C:
C: Hi Bob!
C: .
S: 250 2.0.0 Message accepted for delivery
C: QUIT
S: 221 2.0.0 Service closing transmission channel</pre></div>
<div class="callout note"><span class="t">Notes</span>All commands are four characters. Only the <b>numeric code</b> in a reply really counts – each implementation can put any text after it. If the server isn't willing to accept mail, the client releases the connection and retries later. Undeliverable mail → error report returned to sender.</div>
</div></details>

<details class="topic" open><summary>SMTP Commands Table <span class="fire">🔥</span></summary><div class="topic-body">
<div class="tw"><table>
<tr><th>Command</th><th>Syntax</th><th>Description</th><th>Typical response</th></tr>
<tr><td>EHLO/HELO</td><td><code>EHLO client.domain.com</code></td><td>Starts session, capability exchange</td><td>250 Hello client.domain.com</td></tr>
<tr><td>MAIL FROM</td><td><code>MAIL FROM:&lt;alice@example.com&gt;</code></td><td>Sets sender</td><td>250 2.1.0 Sender OK</td></tr>
<tr><td>RCPT TO</td><td><code>RCPT TO:&lt;bob@example.com&gt;</code></td><td>Sets recipient</td><td>250 2.1.5 Recipient OK</td></tr>
<tr><td>DATA</td><td><code>DATA</code></td><td>Start of mail body</td><td>354 Start mail input…</td></tr>
<tr><td>.</td><td><code>.</code> (alone on a line)</td><td>Ends the mail body</td><td>250 2.0.0 Message accepted</td></tr>
<tr><td>QUIT</td><td><code>QUIT</code></td><td>Closes connection</td><td>221 2.0.0 Service closing</td></tr>
<tr><td>RSET</td><td><code>RSET</code></td><td>Aborts current transaction without disconnecting</td><td>250 Reset OK</td></tr>
<tr><td>NOOP</td><td><code>NOOP</code></td><td>No-operation, keeps connection alive</td><td>250 OK</td></tr>
</table></div>
<h3>Reply codes to remember</h3>
<div class="chips"><span>220 – service ready</span><span>250 – OK</span><span>354 – start mail input</span><span>221 – closing</span><span>550 – mailbox unavailable / rejected</span></div>
</div></details>

<details class="topic" open><summary>SMTP Ports <span class="fire">🔥</span></summary><div class="topic-body">
<div class="tw"><table>
<tr><th>Port</th><th>Use</th></tr>
<tr><td><b>25</b></td><td>Traditional, unencrypted <b>server-to-server</b> relaying</td></tr>
<tr><td><b>587</b></td><td>Modern default for <b>client submission</b> (MUA → MTA) with STARTTLS</td></tr>
<tr><td><b>465</b></td><td>Historical/legacy SMTPS (SMTP over implicit TLS/SSL)</td></tr>
</table></div>
<h3>Two uses of SMTP</h3>
<ul><li><b>Mail submission</b> – UA → MTA (step 1).</li><li><b>Mail transfer</b> – MTA → MTA (step 2).</li><li>Final delivery uses <b>IMAP or POP3</b> (step 3), not SMTP.</li></ul>
<div class="callout warn"><span class="t">Common mistake</span>SMTP is a <b>push</b> protocol – it cannot be used to read/download mail. That is POP3/IMAP.</div>
</div></details>

<details class="topic" open><summary>SMTP – The full sample dialog from the slides <span class="fire">🔥</span></summary><div class="topic-body">
<p>The slide shows Alice (cs.washington.edu) sending to Bob (ee.uwa.edu.au). Client lines = <b>C:</b>, server lines = <b>S:</b>. Commands are highlighted in pink on the slide.</p>
<pre>S: 220 ee.uwa.edu.au SMTP service ready
C: HELO abcd.com
S: 250 cs.washington.edu says hello to ee.uwa.edu.au
C: MAIL FROM: &lt;alice@cs.washington.edu&gt;
S: 250 sender ok
C: RCPT TO: &lt;bob@ee.uwa.edu.au&gt;
S: 250 recipient ok
C: DATA
S: 354 Send mail; end with "." on a line by itself
C: From: alice@cs.washington.edu
C: To: bob@ee.uwa.edu.au
C: MIME-Version: 1.0
C: Message-Id: &lt;0704760941.AA00747@ee.uwa.edu.au&gt;
C: Content-Type: multipart/alternative; boundary=qwertyuiopasdfghjklzxcvbnm
C: Subject: Earth orbits sun integral number of times
C:
C: This is the preamble.  The user agent ignores it.  Have a nice day.
C:
C: --qwertyuiopasdfghjklzxcvbnm
C: Content-Type: text/html
C:
C: &lt;p&gt;Happy birthday to you
C: Happy birthday to you
C: ...(rest of message)...
C: --qwertyuiopasdfghjklzxcvbnm
C: .
S: 250 message accepted
C: QUIT
S: 221 ee.uwa.edu.au closing connection</pre>
<ul>
<li>The server's first line gives its identity and says whether it will accept mail.</li>
<li>Replies that matter on the slide: <b>250</b> (sender ok / recipient ok / message accepted), <b>354</b> (send mail), <b>221</b> (closing).</li>
<li>The body itself is a MIME multipart message (see the MIME section).</li>
</ul>
</div></details>

<details class="topic" open><summary>POP3 vs IMAP vs SMTP – final delivery <span class="fire">🔥</span></summary><div class="topic-body">
<div class="callout note"><span class="t">Beyond the PDF (standard textbook knowledge)</span>The slides only say final delivery uses IMAP or POP3. These points are commonly asked.</div>
<div class="tw"><table>
<tr><th>Feature</th><th>SMTP</th><th>POP3</th><th>IMAP</th></tr>
<tr><td>Purpose</td><td>Send / relay mail (push)</td><td>Download mail (pull)</td><td>Access and manage mail on server (pull)</td></tr>
<tr><td>Used between</td><td>UA→MTA and MTA→MTA</td><td>Mail server → UA</td><td>Mail server → UA</td></tr>
<tr><td>Mail stays on server?</td><td>Queued until delivered</td><td>Usually downloaded, then deleted</td><td>Stays on server; synced across devices</td></tr>
<tr><td>Default port</td><td>25 / 587</td><td>110</td><td>143</td></tr>
</table></div>
</div></details>

<!-- ===== DNS ===== -->
<details class="module" open id="dns">
<summary>3. Domain Name System (DNS)</summary>
<div class="module-body">

<details class="topic" open><summary>Why DNS? Internet names &amp; addresses <span class="fire">🔥</span></summary><div class="topic-body">
<p>Computers use <b>IP addresses</b> (e.g. 129.10.117.100); humans prefer <b>names</b> (e.g. www.northeastern.edu). DNS maps names to IPs.</p>
<h3>Two reasons for DNS</h3>
<ol><li>IP addresses are hard for people to remember.</li><li>If a company moves its web server to a new IP, a readable name stays the same – names are <b>decoupled</b> from addresses (www.cs.washington.edu stays the same even if the IP changes).</li></ol>
<h3>History</h3>
<ul>
<li>ARPANET days: a single file <code>hosts.txt</code> listed all names and IPs; hosts fetched it every night.</li>
<li>Failed to scale: file too large, constant name conflicts.</li>
<li><b>DNS invented in 1983</b> – hierarchical, domain-based naming + a <b>distributed database</b>. Defined in RFCs 1034, 1035, 2181.</li>
</ul>
<div class="callout def"><span class="t">Definition</span>DNS is a hierarchical, domain-based naming scheme with a distributed database, primarily used to map host names to IP addresses.</div>
</div></details>

<details class="topic" open><summary>DNS Features &amp; Basic Process <span class="fire">🔥</span></summary><div class="topic-body">
<ul>
<li>Distributed database – <b>no bottleneck</b> of centralisation.</li>
<li>Simple client/server architecture.</li>
<li>Uses <b>UDP port 53</b>, retransmits lost messages; some implementations also use TCP.</li>
<li>Hierarchical namespace (vs old flat namespace), e.g. <code>.com → google.com → mail.google.com</code>.</li>
</ul>
<h3>Process summary</h3>
<ol>
<li>An application calls a library procedure called the <b>RESOLVER</b>, passing the domain name.</li>
<li>Resolver sends a query to the <b>local DNS server</b>.</li>
<li>Local server looks up the name and returns the IP address to the resolver (UDP packets).</li>
<li>Program then opens a TCP or UDP connection to the host.</li>
</ol>
<div class="callout note"><span class="t">Transport</span>A <b>16-bit identifier</b> is in each query and copied to the response so answers can be matched to queries. If no response arrives quickly the client retries, then tries another server.</div>
</div></details>

<details class="topic" open><summary>DNS Name Space &amp; Hierarchy <span class="fire">🔥</span></summary><div class="topic-body">

<text x="440" y="180" fill="#9a96a3">ccs.neu.edu</text>
<text x="440" y="200" fill="#9a96a3">www.ccs.neu.edu</text>
<text x="560" y="150" fill="#9a96a3" text-anchor="middle" font-size="11">generic + country TLDs</text>
</svg>
<div class="cap">Portion of the Internet domain name space (tree)</div></div>
<ul>
<li>Over <b>250 Top-Level Domains (TLDs)</b>; two flavours: <b>generic</b> (com, edu, gov, org, net, mil) and <b>country</b> (uk, fr, in…).</li>
<li>Each domain is a <b>subtree</b>: <code>.edu → neu.edu → ccs.neu.edu → www.ccs.neu.edu</code>.</li>
<li>Maximum tree depth: <b>128</b>. Each node has a <b>label ≤ 63 characters</b>. Full path name ≤ <b>255 characters</b>.</li>
<li>Domain names are <b>case-insensitive</b> (edu = Edu = EDU).</li>
<li>Each domain is named by the path <b>upward</b> to the unnamed root, components separated by dots: <code>eng.cisco.com.</code></li>
<li>Hierarchy <b>avoids name conflicts</b>: eng.cisco.com vs eng.washington.edu; neu.com vs neu.edu.</li>
<li>Domains can be under generic or country domains (cs.washington.edu / cs.washington.wa.us). Companies often register under multiple TLDs (sony.com, sony.net, sony.nl).</li>
<li>Creating a new domain needs permission of the parent domain. After that, it can create subdomains freely (cs.unsd.edu).</li>
</ul>
<div class="callout note"><span class="t">Registration</span>TLDs are run by <b>registrars appointed by ICANN</b>. Contact the registrar, check availability / trademark, pay a small annual fee. Registering a domain just to sell it at a high price is called <b>cybersquatting</b>. Top of hierarchy is managed by ICANN.</div>
<h3>Hierarchical administration – Zones</h3>
<p>The tree is divided into <b>zones</b>; each zone has an administrator responsible for that part. E.g. CCIS controls *.ccs.neu.edu; NEU controls *.neu.edu.</p>
</div></details>

<details class="topic" open><summary>FQDN vs PQDN <span class="fire">🔥</span></summary><div class="topic-body">
<div class="grid2">
<div><h4>FQDN (Fully Qualified)</h4><ul><li>All labels from the node up to the root, separated by dots.</li><li><b>Ends with a period</b> (empty root label): <code>eng.cisco.com.</code></li><li>Unambiguous – read right to left, top to bottom.</li><li>If TLD A contains B which contains C → FQDN of C = <code>C.B.A.</code></li><li>Example: <code>cse.uc.inststud.edu.</code></li></ul></div>
<div class="r"><h4>PQDN (Partially Qualified)</h4><ul><li>Only a portion (usually the host part); <b>doesn't reach the root</b>.</li><li>Does <b>not</b> end with a period.</li><li>Used when name belongs to the same site as the client.</li><li>Resolver adds the DNS suffix before the query.</li><li>Example: <code>cse.uc</code></li></ul></div>
</div>
<div class="callout warn"><span class="t">Remember</span>FQDN = ends with dot. PQDN = no trailing dot, meaningful only within a known parent domain.</div>
</div></details>

<details class="topic" open><summary>DNS Resource Records (RR) <span class="fire">🔥</span></summary><div class="topic-body">
<p>Every domain (single host or TLD) has a set of <b>resource records</b> = the DNS database. A query has two fields: <b>name and type</b>. The response is the resource records for that name. The primary function of DNS is mapping domain names to resource records.</p>
<h3>RR is a five-tuple</h3>
<pre>Domain_name   Time_to_live   Class   Type   Value</pre>
<ul>
<li><b>Domain name</b> – domain the record applies to; primary search key.</li>
<li><b>Time to live (TTL)</b> – stability: stable = large (86400 s = 1 day), volatile = small (60 s).</li>
<li><b>Class</b> – always <code>IN</code> for Internet information.</li>
<li><b>Type</b> – kind of record.</li>
<li><b>Value</b> – number, domain name or ASCII string, depending on type.</li>
</ul>
<div class="tw"><table>
<tr><th>Type</th><th>Meaning</th><th>Value / Use</th></tr>
<tr><td><b>SOA</b></td><td>Start of Authority</td><td>Primary source of info about the zone, admin e-mail, serial number, timeouts</td></tr>
<tr><td><b>A</b></td><td>Address</td><td>32-bit IPv4 address of a host interface</td></tr>
<tr><td><b>AAAA</b></td><td>"Quad A"</td><td>128-bit IPv6 address</td></tr>
<tr><td><b>MX</b></td><td>Mail Exchange</td><td>Host prepared to accept e-mail for the domain</td></tr>
<tr><td><b>NS</b></td><td>Name Server</td><td>Name server for the domain/subdomain</td></tr>
<tr><td><b>CNAME</b></td><td>Canonical name</td><td>Alias for another name</td></tr>
<tr><td><b>PTR</b></td><td>Pointer</td><td>IP → name (reverse lookup)</td></tr>
<tr><td><b>SRV</b></td><td>Service</td><td>Host for a given service (generalises MX)</td></tr>
<tr><td><b>SPF</b></td><td>Sender Policy Framework</td><td>Which machines may send mail for the domain (spam/forgery check)</td></tr>
<tr><td><b>TXT</b></td><td>Text</td><td>Arbitrary / machine-readable info, usually SPF</td></tr>
</table></div>
<ul>
<li>A host with several interfaces has several A/AAAA records – DNS can return multiple addresses for one name.</li>
<li><b>CNAME vs PTR:</b> CNAME is basically a macro definition; PTR is a regular DNS datatype whose meaning depends on context.</li>
</ul>
<div class="callout ex"><span class="t">Example – CNAME</span><code>cs.mit.edu  86400  IN  CNAME  lcs.mit.edu</code> – people guessing paul@cs.mit.edu are pointed to the real domain lcs.mit.edu.</div>
<h3>Query / response examples</h3>
<div class="tw"><table>
<tr><th>Query name</th><th>Type</th><th>Response value</th></tr>
<tr><td>www.ccs.neu.edu</td><td>A</td><td>129.10.116.81</td></tr>
<tr><td>ccs.neu.edu</td><td>NS</td><td>129.10.116.51</td></tr>
<tr><td>foo.mysite.com</td><td>CNAME</td><td>bar.mysite.com</td></tr>
<tr><td>ccs.neu.edu</td><td>MX</td><td>amber.ccs.neu.edu</td></tr>
<tr><td>129.10.116.51</td><td>PTR</td><td>ccs.neu.edu</td></tr>
</table></div>
</div></details>

<details class="topic" open><summary>Name Servers, Zones &amp; Root Servers <span class="fire">🔥</span></summary><div class="topic-body">
<p>A single server can't hold the entire DNS database (overloaded; single point of failure). So the name space is divided into <b>non-overlapping zones</b>; each zone has name servers holding its database.</p>
<ul>
<li><b>Primary name server</b> – gets info from a file on its disk.</li>
<li><b>Secondary name server(s)</b> – get info from the primary. Some can be outside the zone for reliability.</li>
<li>Admins decide zone boundaries.</li>
</ul>
<h3>Functions of a DNS server</h3>
<ul><li>Has <b>authority</b> over part of the hierarchy (needn't store all names).</li><li>Stores all records for hosts/domains in its zone (can be replicated).</li><li>Knows addresses of the <b>root servers</b> (to resolve unknown names).</li><li>Root servers know all TLDs – the search stops there.</li></ul>
<h3>Root name servers</h3>
<ul>
<li><b>13 root servers</b>, named a.root-servers.net … m.root-servers.net.</li>
<li>Heavily replicated across many locations, reached by <b>anycast routing</b> (packet goes to nearest instance) – improves reliability and performance.</li>
</ul>
<div class="callout def"><span class="t">Authoritative record</span>A record that comes from the authority managing it – <b>always correct</b>. Cached records may be out of date.</div>
</div></details>

<details class="topic" open><summary>Name Resolution – Recursive vs Iterative <span class="fire">🔥</span></summary><div class="topic-body">
<p><b>Name resolution</b> = looking up a name and finding its address.</p>
<div class="diagram">
<svg viewBox="0 0 720 330" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" font-size="12">
<defs><marker id="a2" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8z" fill="#c4a35a"/></marker></defs>
<g fill="#1e1c22" stroke="#7c9ec9"><rect x="20" y="130" width="120" height="50" rx="8"/><rect x="200" y="130" width="130" height="50" rx="8"/><rect x="470" y="10" width="140" height="44" rx="8"/><rect x="470" y="100" width="140" height="44" rx="8"/><rect x="470" y="190" width="140" height="44" rx="8"/><rect x="470" y="280" width="160" height="44" rx="8"/></g>
<g fill="#e6e3ea" text-anchor="middle"><text x="80" y="152">Resolver</text><text x="80" y="168" fill="#9a96a3" font-size="10">flits.cs.vu.nl</text><text x="265" y="152">Local name server</text><text x="265" y="168" fill="#9a96a3" font-size="10">cs.vu.nl</text>
<text x="540" y="32">Root server</text><text x="540" y="122">edu server</text><text x="540" y="212">washington.edu server</text><text x="550" y="302">cs.washington.edu server</text></g>
<g stroke="#c4a35a" stroke-width="1.5" fill="none" marker-end="url(#a2)">
<line x1="140" y1="145" x2="200" y2="145"/>
<line x1="330" y1="135" x2="470" y2="40"/>
<line x1="470" y1="48" x2="330" y2="140" stroke="#7c9ec9"/>
<line x1="330" y1="150" x2="470" y2="120"/>
<line x1="470" y1="132" x2="330" y2="155" stroke="#7c9ec9"/>
<line x1="330" y1="165" x2="470" y2="205"/>
<line x1="470" y1="220" x2="330" y2="170" stroke="#7c9ec9"/>
<line x1="330" y1="175" x2="470" y2="295"/>
<line x1="470" y1="310" x2="330" y2="178" stroke="#8dbf8d"/>
<line x1="200" y1="170" x2="140" y2="170" stroke="#8dbf8d"/>
</g>
<text x="170" y="138" fill="#c4a35a" text-anchor="middle" font-size="10">1</text>
<text x="400" y="80" fill="#c4a35a" font-size="10">2</text><text x="420" y="110" fill="#7c9ec9" font-size="10">3</text>
<text x="400" y="132" fill="#c4a35a" font-size="10">4</text><text x="420" y="150" fill="#7c9ec9" font-size="10">5</text>
<text x="400" y="190" fill="#c4a35a" font-size="10">6/8</text><text x="420" y="215" fill="#7c9ec9" font-size="10">7/9</text>
<text x="170" y="188" fill="#8dbf8d" font-size="10" text-anchor="middle">10</text>
<text x="20" y="240" fill="#9a96a3">Gold = queries, blue = referrals,</text><text x="20" y="256" fill="#9a96a3">green = final answer.</text>
<text x="20" y="276" fill="#9a96a3">Resolver → local server = RECURSIVE</text><text x="20" y="292" fill="#9a96a3">Local server → others = ITERATIVE</text>
</svg>
<div class="cap">Resolver looking up robot.cs.washington.edu (10 steps, worst case with empty cache)</div></div>
<h3>The 10 steps</h3>
<ol>
<li>Resolver sends query (name, type A, class IN) to the local name server cs.vu.nl.</li>
<li>Local server asks a <b>root server</b> (its address is in a config file loaded at start-up).</li>
<li>Root doesn't know UW but knows the <b>edu</b> server – returns its name and IP.</li>
<li>Local server queries the edu server (a.edu-servers.net).</li>
<li>edu server returns the name server for UW.</li>
<li>Local server queries the UW server.</li>
<li>UW returns the name/IP of the <b>CS department's</b> name server (CS runs its own).</li>
<li>Local server queries the UW CS name server.</li>
<li>It is <b>authoritative</b> for cs.washington.edu → returns the final answer.</li>
<li>Local server forwards the answer to the resolver. Resolved!</li>
</ol>
<div class="grid2">
<div><h4>Recursive query</h4><ul><li>Burden on the contacted server.</li><li>Server resolves <b>on behalf of</b> the client and returns only the final answer – no partial answers.</li><li>If not authoritative, it asks another server and waits; the response travels back to the client.</li><li>Resolver → local name server.</li></ul></div>
<div class="g"><h4>Iterative query</h4><ul><li>Burden on the client/originator.</li><li>Server returns the answer if authoritative, otherwise the <b>address of the next server</b> to ask.</li><li>Client repeats the same query to multiple servers.</li><li>Local server → root, TLD, etc. Root servers usually don't do recursion (too busy).</li></ul></div>
</div>
<h3>Caching</h3>
<ul><li>Servers <b>cache</b> answers, greatly reducing steps and improving performance.</li><li>The 10-step scenario is the <b>worst case</b> (nothing cached).</li><li>Cached answers are <b>not authoritative</b> – may be stale, so purge after a short time (TTL).</li></ul>
<div class="callout warn"><span class="t">Common mistake</span>One resolution usually uses <b>both</b> mechanisms: recursive (host → local server) and iterative (local server → root/TLD/authoritative).</div>
</div></details>

<details class="topic" open><summary>DNS – The cs.vu.nl database example (slide question answered) <span class="fire">🔥</span></summary><div class="topic-body">
<p>The slide shows part of a hypothetical authoritative database for <b>cs.vu.nl</b> with seven record types (SOA, MX, NS, A, CNAME, PTR-style aliases, etc.).</p>
<pre>; Authoritative data for cs.vu.nl
cs.vu.nl.   86400  IN  SOA    star boss (9527,7200,7200,241920,86400)
cs.vu.nl.   86400  IN  MX     1 zephyr
cs.vu.nl.   86400  IN  MX     2 top
cs.vu.nl.   86400  IN  NS     star               &lt;- name server

star        86400  IN  A      130.37.56.205      &lt;- IP addresses
zephyr      86400  IN  A      130.37.20.10          of computers
top         86400  IN  A      130.37.20.11
www         86400  IN  CNAME  star.cs.vu.nl      &lt;- aliases (CNAME)
ftp         86400  IN  CNAME  zephyr.cs.vu.nl

flits       86400  IN  A      130.37.16.112
flits       86400  IN  A      192.31.231.165     &lt;- multiple addresses
flits       86400  IN  MX     1 flits            &lt;- mail gateways
flits       86400  IN  MX     2 zephyr
flits       86400  IN  MX     3 top

rowboat            IN  A      130.37.56.201
                   IN  MX     1 rowboat
                   IN  MX     2 zephyr

little-sister      IN  A      130.37.62.23
laserjet           IN  A      192.31.231.216</pre>
<div class="callout ex"><span class="t">Slide question: What is cs.vu.nl's web server's name and IP address?</span><b>Answer:</b> <code>www</code> is a CNAME for <b>star.cs.vu.nl</b>, and star's A record is <b>130.37.56.205</b>. So the web server is <b>star</b>, IP <b>130.37.56.205</b>.</div>
<ul>
<li>CNAME and PTR-type aliases let one IP address have multiple names; PTR enables reverse lookups.</li>
<li><code>flits</code> has two A records (two network interfaces) and three MX records – lower number = higher priority mail gateway.</li>
<li>SOA numbers (9527,7200,7200,241920,86400) = serial number, refresh, retry, expire, minimum TTL.</li>
</ul>
</div></details>

<h3>Recursive and iterative figures (slides)</h3>
<ul>
<li><b>Recursive figure:</b> client → local server <code>fhda.edu</code> (1) → root (2–3) via edu → … → answer returned back along the same path (… 9, 10). Each server asks the next on the client's behalf.</li>
<li><b>Iterative figure:</b> client asks fhda.edu (1,2), then itself asks the root (5,6), edu (3,4), mcgraw.com (7–10) in turn – <b>the client repeats the query</b> to each server it is referred to.</li>
<li><b>DNS process figure:</b> browser sends <code>www.example.com</code> to a DNS server, gets back <code>12.45.56.67</code>, then contacts the web server at that IP and gets the page.</li>
</ul>
</div></details>
