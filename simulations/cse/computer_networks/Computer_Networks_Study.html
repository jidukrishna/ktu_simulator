<!-- INTRO -->
<details class="card" id="m1-intro">
<summary><span class="stitle"><span class="chev">▶</span> Introduction to Computer Networks <span class="badge">🔥 High Yield</span></span></summary>
<div class="card-body">
<p>A computer network is a large number of separate but interconnected computers, forming a collection of <strong>autonomous computers</strong> connected by a single technology. Two computers are "interconnected" if they can exchange information, over wired or wireless links.</p>

<div class="callout def"><span class="co-label">Definition</span>
The <strong>Internet</strong> is not a single network but a <em>network of networks</em>. The <strong>World Wide Web</strong> is a distributed system that runs on top of the Internet, presenting everything as a document (web page).
</div>

<h4>Uses of Computer Networks</h4>
<ul>
  <li><strong>Business applications:</strong> resource sharing, communication (email/messenger), e‑commerce with suppliers/customers, video conferencing.</li>
  <li><strong>Home applications:</strong> access to remote information, person-to-person communication, interactive entertainment, e-commerce, video-on-demand.</li>
  <li><strong>Mobile users:</strong> hotspots, texting, smartphones, e-books, GPS/m-commerce, wireless sensor networks, wearables.</li>
</ul>

<h4>Advantages vs Disadvantages</h4>
<div class="grid2">
  <div class="col pros">
    <h5>✔ Advantages</h5>
    <ul>
      <li>Enhances communication &amp; availability of information</li>
      <li>Convenient resource &amp; file sharing</li>
      <li>Highly flexible, inexpensive, cost-efficient</li>
      <li>Boosts storage capacity</li>
    </ul>
  </div>
  <div class="col cons">
    <h5>✘ Disadvantages</h5>
    <ul>
      <li>Lacks independence</li>
      <li>Security difficulties, malware/virus spread</li>
      <li>Requires efficient administration</li>
      <li>Can lack robustness</li>
    </ul>
  </div>
</div>

<div class="callout note"><span class="co-label">Note</span>
A well-known example of a <strong>distributed system</strong> is the WWW — a <em>middleware</em> layer above the OS presents a single model/paradigm to users, hiding the underlying network of independent computers.
</div>
</div>
</details>

<!-- NETWORK HARDWARE -->
<details class="card" id="m1-hardware">
<summary><span class="stitle"><span class="chev">▶</span> Network Hardware: Transmission Technology &amp; Scale <span class="badge">🔥 High Yield</span></span></summary>
<div class="card-body">
<p>Networks can be classified by two broad aspects: <strong>transmission technology</strong> and <strong>scale</strong>.</p>

<h4>Transmission Technology</h4>
<table>
<thead><tr><th>Broadcast Networks</th><th>Point-to-Point Networks</th></tr></thead>
<tbody>
<tr><td>Single shared communication channel among all machines</td><td>Many connections between individual pairs of machines</td></tr>
<tr><td>Packets sent by any machine received by all others; address field picks the recipient</td><td>A packet may hop through intermediate machines to reach destination</td></tr>
<tr><td>Special address code = <strong>broadcasting</strong> (all); subset = <strong>multicasting</strong></td><td>One sender, one receiver = <strong>unicasting</strong></td></tr>
<tr><td>Typically small, geographically localized networks</td><td>Typically larger networks</td></tr>
</tbody>
</table>

<h4>Scale of Networks (small → large)</h4>
<table>
<thead><tr><th>Type</th><th>Key Characteristics</th></tr></thead>
<tbody>
<tr><td><strong>PAN</strong> (Personal Area Network)</td><td>Smallest/basic; wireless modem, phones, printers around one person, one building</td></tr>
<tr><td><strong>LAN</strong> (Local Area Network)</td><td>Privately owned, within a single building; distinguished by Size, Transmission technology, Topology</td></tr>
<tr><td><strong>WLAN</strong></td><td>LAN using wireless tech (Wi-Fi); no physical cabling needed</td></tr>
<tr><td><strong>CAN</strong> (Campus Area Network)</td><td>Larger than LAN, smaller than MAN; spans nearby buildings</td></tr>
<tr><td><strong>MAN</strong> (Metropolitan Area Network)</td><td>Spans a town/city; 20–40 km; connects multiple LANs; uplinks LAN→WAN</td></tr>
<tr><td><strong>WAN</strong> (Wide Area Network)</td><td>Connects LANs/MANs across long distances / entire countries</td></tr>
</tbody>
</table>

<div class="callout example"><span class="co-label">Example</span>
Keyboard + wireless mouse = <strong>PAN</strong>. Office floor network = <strong>LAN</strong>. University connecting several LANs across buildings = <strong>CAN</strong>. A city-wide cable-TV network = <strong>MAN</strong>. The Internet backbone spanning countries = <strong>WAN</strong>.
</div>

<h4>Types of Services (Connection-Oriented vs Connectionless) 🔥</h4>
<table>
<thead><tr><th>Connection-Oriented Service</th><th>Connectionless Service</th></tr></thead>
<tbody>
<tr><td>Analogous to the telephone system</td><td>Analogous to the postal system</td></tr>
<tr><td>3 phases: connection establishment → data transfer → termination</td><td>Single phase: data transfer only</td></tr>
<tr><td>Reliable and secure</td><td>No guarantee of reliability/security</td></tr>
<tr><td>Order of data bits preserved</td><td>Data need not arrive in order</td></tr>
<tr><td>All packets follow the same route</td><td>Packets may follow different routes</td></tr>
<tr><td>Requires authentication</td><td>Does not require authentication</td></tr>
<tr><td>Example: <strong>TCP</strong></td><td>Example: <strong>UDP</strong></td></tr>
</tbody>
</table>
</div>
</details>

<!-- NETWORK SOFTWARE -->
<details class="card" id="m1-software">
<summary><span class="stitle"><span class="chev">▶</span> Network Software: Protocols, Layers &amp; Design Issues <span class="badge">🔥 High Yield</span></span></summary>
<div class="card-body">

<div class="callout def"><span class="co-label">Key Definitions</span>
<strong>Protocol</strong> — an agreement between communicating parties on rules of communication (syntax, semantics, timing).<br>
<strong>Peers</strong> — entities at the same layer on different machines.<br>
<strong>Interface</strong> — primitive operations offered by a layer to the layer above it.<br>
<strong>Network architecture</strong> — the set of layers + protocols.<br>
<strong>Protocol stack</strong> — the list of protocols used by a system.
</div>

<h4>Protocol Hierarchies (Layering)</h4>
<ul>
  <li>Networks are organized as a stack of layers, each built upon the one below it, to reduce design complexity.</li>
  <li>Each layer offers services to the layer above, hiding implementation details — like a virtual machine.</li>
  <li>Layer <em>n</em> on one machine "talks" to layer <em>n</em> on another — governed by the <strong>layer n protocol</strong>.</li>
  <li>Violating the protocol makes communication difficult or impossible.</li>
</ul>

<h4>Service Primitives</h4>
<p>Adjacent layers communicate via function calls called <strong>primitives</strong> (usually OS system calls). Common connection-oriented primitives:</p>
<table>
<thead><tr><th>Primitive</th><th>Meaning</th></tr></thead>
<tbody>
<tr><td>LISTEN</td><td>Server prepares for incoming connections (blocks)</td></tr>
<tr><td>CONNECT</td><td>Client establishes connection with server (blocks)</td></tr>
<tr><td>ACCEPT</td><td>Server unblocks + sends ACK, which unblocks client</td></tr>
<tr><td>RECEIVE</td><td>Server accepts first client request (blocks)</td></tr>
<tr><td>SEND</td><td>Client transmits request / server replies</td></tr>
<tr><td>DISCONNECT</td><td>Releases the connection on both ends</td></tr>
</tbody>
</table>

<h4>Service vs Protocol 🔥 (common exam confusion)</h4>
<div class="grid2">
  <div class="col pros">
    <h5>Service</h5>
    <ul>
      <li>Set of primitives a layer provides to the layer above it</li>
      <li>Defines <em>what</em> operations can be performed, not <em>how</em></li>
      <li>Relates to the interface between two layers (provider &amp; user)</li>
    </ul>
  </div>
  <div class="col cons">
    <h5>Protocol</h5>
    <ul>
      <li>Rules governing format/meaning of packets exchanged between peer entities</li>
      <li>Entities use protocols to <em>implement</em> service definitions</li>
      <li>Relates to packets between peers on different machines</li>
    </ul>
  </div>
</div>

<div class="callout warn"><span class="co-label">Common Mistake</span>
Students often confuse "service" and "protocol" — remember: a <strong>service</strong> is a vertical relationship (between layers on the <em>same</em> machine); a <strong>protocol</strong> is a horizontal relationship (between peer layers on <em>different</em> machines).
</div>

<h4>Key Network Design Issues</h4>
<ul>
  <li>Addressing — identifying senders/receivers</li>
  <li>Rules for data transfer — one-way / two-way channels</li>
  <li>Error control — detection &amp; correction codes</li>
  <li>Sequencing of messages — numbering</li>
  <li>Flow control — buffers</li>
  <li>Splitting long messages; MUX/DEMUX for multiple processes</li>
  <li>Routing algorithms; Scalability; Security (confidentiality, integrity)</li>
</ul>
</div>
</details>

<!-- OSI MODEL -->
<details class="card" id="m1-osi">
<summary><span class="stitle"><span class="chev">▶</span> OSI Reference Model (7 Layers) <span class="badge">🔥🔥 Very High Yield</span></span></summary>
<div class="card-body">

<div class="callout def"><span class="co-label">Definition</span>
The <strong>OSI (Open Systems Interconnection)</strong> model is a proposal by ISO, standardizing protocols for connecting open systems. Revised in 1995. Its protocols are rarely used today, but the 7-layer <em>model</em> remains conceptually important.
</div>

<h4>Design Principles</h4>
<ul>
  <li>A layer is created where a different abstraction is needed</li>
  <li>Each layer performs a well-defined function</li>
  <li>Layer functions chosen with international standardization in mind</li>
  <li>Layer boundaries minimize information flow across interfaces</li>
  <li>Number of layers should be optimum — not too many, not too few</li>
</ul>

<h4>Detailed Breakdown of Each Layer 🔥🔥</h4>

<div class="callout def"><span class="co-label">Layer 1 — Physical Layer</span>
<strong>Definition:</strong> Coordinates the functions required to transmit a raw bit stream over a physical medium.<br>
<strong>Responsibilities:</strong> Physical characteristics of interfaces &amp; medium; representation of bits (encoding scheme used); data rate (transmission rate, i.e. bits per second); synchronization of bits between sender &amp; receiver clocks; line configuration (point-to-point vs multipoint link); physical topology (mesh/star/bus/ring); transmission mode (simplex/half-duplex/full-duplex).<br>
<strong>Deals purely with:</strong> voltages, connectors, cabling, timing — no concept of "meaning" in the data at all.
</div>

<div class="callout def"><span class="co-label">Layer 2 — Data Link Layer</span>
<strong>Definition:</strong> Transforms the raw, error-prone physical layer into a reliable link; responsible for <strong>node-to-node (hop-to-hop) delivery</strong>.<br>
<strong>Responsibilities:</strong> <strong>Framing</strong> — divides the bit stream into manageable frames; <strong>Physical (MAC) addressing</strong> — adds sender/receiver hardware address to each frame; <strong>Flow control</strong> — prevents a fast sender from overwhelming a slow receiver; <strong>Error control</strong> — detects and retransmits/discards damaged or lost frames; <strong>Access control</strong> — determines which device has control of the link at any given time when multiple devices share it.<br>
<strong>Split into 2 sublayers:</strong> LLC (Logical Link Control, protocol-independent) and MAC (Medium Access Control, handles the shared-medium access problem).
</div>

<div class="callout def"><span class="co-label">Layer 3 — Network Layer</span>
<strong>Definition:</strong> Responsible for the <strong>source-to-destination delivery</strong> of a packet, possibly across multiple, heterogeneous networks (whereas the data link layer only handles delivery between two <em>directly connected</em> nodes).<br>
<strong>Responsibilities:</strong> <strong>Logical addressing</strong> — adds a sender/receiver IP address to the packet header, needed because moving across network boundaries requires a universal addressing system beyond just local hardware addresses; <strong>Routing</strong> — connecting/routing devices (routers) move packets to their final destination, choosing paths across the internetwork.
</div>

<div class="callout def"><span class="co-label">Layer 4 — Transport Layer</span>
<strong>Definition:</strong> Responsible for <strong>process-to-process (end-to-end) delivery</strong> of the <em>entire message</em> — the first layer that talks directly, logically, to its peer on the destination machine rather than hop-by-hop.<br>
<strong>Responsibilities:</strong> <strong>Service-point (port) addressing</strong> — the header includes a port address so the message reaches the correct <em>process</em> on the destination host, not just the correct host; <strong>Segmentation and reassembly</strong> — a message is split into transmittable segments, each numbered, allowing correct reassembly at the destination and detection of lost segments; <strong>Connection control</strong> — either connection-oriented (a virtual connection is established first) or connectionless (each segment travels independently); <strong>Flow control</strong> — end-to-end, not just hop-to-hop like layer 2; <strong>Error control</strong> — end-to-end, ensuring the whole message arrives error-free.
</div>

<div class="callout def"><span class="co-label">Layer 5 — Session Layer</span>
<strong>Definition:</strong> Acts as the "dialog controller" — establishes, maintains, and synchronizes interaction between communicating systems.<br>
<strong>Responsibilities:</strong> <strong>Dialog control</strong> — allows two systems to enter into a dialog, permitting communication to happen either in half-duplex or full-duplex mode, and manages whose "turn" it is to transmit; <strong>Synchronization</strong> — adds checkpoints ("sync points") into a long stream of data, so that if a crash occurs, only the data after the last checkpoint needs to be resent, rather than the entire stream.
</div>

<div class="callout def"><span class="co-label">Layer 6 — Presentation Layer</span>
<strong>Definition:</strong> Concerned with the <strong>syntax and semantics</strong> of the information exchanged between two systems — essentially, it's the network's "translator."<br>
<strong>Responsibilities:</strong> <strong>Translation</strong> — converts data from the sender's local format into a common, agreed-upon format for transmission, then back into the receiver's local format; <strong>Encryption/Decryption</strong> — transforms data to ensure privacy, protecting sensitive information from unauthorized access during transmission; <strong>Compression/Decompression</strong> — reduces the number of bits to be transmitted, important for compressing multimedia data like audio/video/text.
</div>

<div class="callout def"><span class="co-label">Layer 7 — Application Layer</span>
<strong>Definition:</strong> Enables the user (human or software) to access the network — the layer closest to the end user, providing user interfaces and support for services.<br>
<strong>Responsibilities/Services:</strong> <strong>Network virtual terminal</strong> — a software emulation of a remote terminal, allowing a user to log onto a remote host; <strong>File transfer, access, and management (FTAM)</strong> — allows a user to access, retrieve and manage files on a remote host; <strong>Mail services</strong> — provides the basis for email forwarding and storage; <strong>Directory services</strong> — provides distributed database sources for global information about various objects and services.<br>
<strong>Common protocols:</strong> HTTP, FTP, SMTP, DNS, TELNET.
</div>

<h4>Layer Details Worth Remembering — Quick Recap 🔥</h4>
<ul>
  <li><strong>Physical:</strong> volts per bit, bit duration, simplex/duplex, connector pins — all mechanical/electrical/timing aspects.</li>
  <li><strong>Data Link:</strong> breaks input into frames; processes acknowledgement frames; creates/recognizes frame boundaries using special bit patterns.</li>
  <li><strong>Network:</strong> overcomes heterogeneity — different addressing schemes, packet size limits, differing protocols between networks.</li>
  <li><strong>Transport:</strong> the <em>first end-to-end layer</em> — unlike the lower 3 layers which are "chained" hop-by-hop.</li>
  <li><strong>Session:</strong> manages "whose turn it is to transmit" (dialog control) + checkpointing for crash recovery.</li>
  <li><strong>Presentation:</strong> concerned with syntax/semantics of transmitted info — converts local representation to network standard.</li>
</ul>
</div>
</details>

<!-- TCP/IP MODEL -->
<details class="card" id="m1-tcpip">
<summary><span class="stitle"><span class="chev">▶</span> TCP/IP Reference Model <span class="badge">🔥 High Yield</span></span></summary>
<div class="card-body">
<p>Named after its two main protocols: <strong>TCP</strong> (Transmission Control Protocol) and <strong>IP</strong> (Internet Protocol). Designed in the 1970s; became the standard Internet protocol suite, connecting multiple networks seamlessly.</p>

<h4>The 4 Layers</h4>
<table>
<thead><tr><th>Layer</th><th>Function</th></tr></thead>
<tbody>
<tr><td><strong>Host-to-Network</strong> (Network Access)</td><td>Not well-specified by the model; host connects to network via some protocol (varies by host/network) to send IP packets — e.g. twisted pair, fiber</td></tr>
<tr><td><strong>Internet</strong></td><td>Connectionless layer defining protocol <strong>IP</strong>; delivers packets independently — may arrive out of order (higher layers handle ordering)</td></tr>
<tr><td><strong>Transport</strong></td><td>Two end-to-end protocols: <strong>TCP</strong> (connection-oriented, ordered, reliable, flow control) and <strong>UDP</strong> (connectionless, unreliable, used for real-time voice/video)</td></tr>
<tr><td><strong>Application</strong></td><td>No session/presentation layers; contains higher-level protocols — TELNET, FTP, SMTP, HTTP, DNS</td></tr>
</tbody>
</table>

<div class="callout example"><span class="co-label">Example</span>
TCP guarantees ordered, error-free delivery — ideal for file downloads. UDP is connectionless and faster but unreliable — used for live video/voice calls where late data is worse than lost data.
</div>

<h4>Detailed Breakdown of Each TCP/IP Layer 🔥</h4>

<div class="callout def"><span class="co-label">Host-to-Network Layer (Network Access / Link Layer)</span>
<strong>Definition:</strong> The lowest layer of the model, combining the functionality of the OSI Physical + Data Link layers. It is intentionally left <strong>vague and unspecified</strong> by the TCP/IP model itself — the host simply needs to connect to the network using <em>some</em> protocol so it can send IP packets over it.<br>
<strong>Why unspecified:</strong> This flexibility is a strength — it lets TCP/IP run over virtually any underlying hardware: Ethernet, Wi-Fi, fiber, satellite links, etc, without redesigning the model.
</div>

<div class="callout def"><span class="co-label">Internet Layer</span>
<strong>Definition:</strong> The layer that holds the entire architecture together — defines an official packet format and protocol called <strong>IP (Internet Protocol)</strong>. Its job is to deliver IP packets to wherever they are supposed to go.<br>
<strong>Key property:</strong> <strong>Connectionless</strong> — packets are routed independently of one another and may arrive at the destination in a <em>different order</em> than they were sent; it is the job of higher layers to rearrange them if in-order delivery is needed.<br>
<strong>Analogy:</strong> Deliberately analogous to the (connectionless) postal system — closely resembling packet-switching networks.
</div>

<div class="callout def"><span class="co-label">Transport Layer</span>
<strong>Definition:</strong> Designed to let peer entities on the source and destination hosts carry on a conversation, the same as in the OSI transport layer. Two end-to-end transport protocols are defined:<br>
• <strong>TCP (Transmission Control Protocol)</strong> — reliable, connection-oriented; allows a byte stream from one machine to be delivered without error to any other machine; fragments the incoming stream into discrete messages, passes each to the internet layer, and reassembles received messages at the other end; also handles flow control.<br>
• <strong>UDP (User Datagram Protocol)</strong> — unreliable, connectionless; intended for applications that don't want TCP's sequencing/flow control and wish to provide their own — widely used for one-shot, client-server request-response style queries and applications where prompt delivery matters more than accurate delivery (real-time speech/video transmission).
</div>

<div class="callout def"><span class="co-label">Application Layer</span>
<strong>Definition:</strong> Sits directly on top of the transport layer — the TCP/IP model has <strong>no session or presentation layer</strong> at all (unlike OSI), since these weren't found necessary in practice. It contains all the higher-level protocols.<br>
<strong>Protocols included:</strong> <strong>TELNET</strong> (virtual terminal — remote login), <strong>FTP</strong> (File Transfer Protocol), <strong>SMTP</strong> (Simple Mail Transfer Protocol — email), <strong>DNS</strong> (Domain Name System — maps host names to network addresses), <strong>HTTP</strong> (retrieving pages on the World Wide Web), and many others developed over time.
</div>

<h4>Addressing at Different Layers 🔥</h4>
<p>As data travels down the stack, each layer wraps the data with its <em>own</em> kind of address — this is why the same piece of data ends up carrying several different addresses by the time it hits the wire.</p>

This 3-tier addressing is exactly why a router changes the MAC address of a frame at every hop but never touches the IP address inside it — see the <strong>Router vs Bridge</strong> comparison in Module 2's Connecting Devices section.

<!-- PHYSICAL LAYER: MODES OF COMM -->
<details class="card" id="m1-physical">
<summary><span class="stitle"><span class="chev">▶</span> Physical Layer: Data Communication &amp; Modes <span class="badge">🔥 High Yield</span></span></summary>
<div class="card-body">

<div class="callout def"><span class="co-label">Definition</span>
<strong>Data communication</strong> is the exchange of data between two devices via a transmission medium. Effectiveness depends on 4 characteristics: <strong>Delivery, Accuracy, Timeliness, Jitter</strong>.
</div>

<h4>The 4 Fundamental Characteristics of Effective Data Communication 🔥</h4>
<table>
<thead><tr><th>Characteristic</th><th>Definition &amp; Explanation</th></tr></thead>
<tbody>
<tr><td><strong>Delivery</strong></td><td>The system must deliver data to the <em>correct</em> destination. Data must be received by the intended device or user only — not misdirected to any other. This is a matter of correct addressing and correct routing through the network.</td></tr>
<tr><td><strong>Accuracy</strong></td><td>The system must deliver the data <em>accurately</em> — without alteration. Data that has been altered in transit and not correctly detected/corrected is unusable. This is the entire motivation behind error detection and error correction techniques (parity, checksum, CRC, Hamming codes).</td></tr>
<tr><td><strong>Timeliness</strong></td><td>The system must deliver data in a <em>timely</em> manner. Data delivered late is useless. For time-sensitive applications like audio and video, timely delivery means delivering data <strong>as it is produced</strong>, in the same order, without significant delay — this is called <strong>real-time transmission</strong>. Late audio/video packets cause stuttering or dropouts.</td></tr>
<tr><td><strong>Jitter</strong></td><td>Jitter refers to the <em>variation</em> in packet arrival time. Even if all packets are individually delivered on time, uneven gaps between consecutive packet arrivals (packet delay variance) degrade the quality of real-time audio/video, since the receiving application expects data to arrive at a smooth, regular rate.</td></tr>
</tbody>
</table>

<div class="callout note"><span class="co-label">Note — Delivery vs Accuracy vs Timeliness vs Jitter</span>
Think of a live video call: <strong>Delivery</strong> = the video reaches the right person. <strong>Accuracy</strong> = the video isn't corrupted/garbled. <strong>Timeliness</strong> = the video arrives quickly enough to feel "live," not minutes later. <strong>Jitter</strong> = the video doesn't stutter because frames arrive at wildly inconsistent intervals, even if each one is individually "on time."
</div>

<h4>Components of a Data Communication System</h4>

  <li><strong>Transmission medium</strong> — the physical path (twisted-pair, coax, fiber, radio)</li>

</ol>

<h4>Data Communication at the Physical Layer 🔥</h4>
<p>The physical layer is concerned with moving <strong>data</strong>, in the form of <strong>signals</strong>, across a transmission medium. Data can be represented either as analog or digital quantities, and signals that carry them can likewise be analog or digital.</p>

<div class="callout def"><span class="co-label">Definition — Analog vs Digital Data</span>
<strong>Analog data</strong> takes on continuous values (e.g. the human voice, sound, temperature — smoothly varying quantities). <strong>Digital data</strong> takes on discrete, limited values (e.g. text stored as 0s and 1s in a computer).
</div>

<div class="callout def"><span class="co-label">Definition — Analog vs Digital Signal</span>
An <strong>analog signal</strong> can have an infinite number of values in a continuous range, changing smoothly rather than in discrete steps. A <strong>digital signal</strong> can only take on a limited number of defined values — most commonly just two levels, representing binary 0 and 1.
</div>

<div class="diagram-wrap">
<svg viewBox="0 0 520 160" xmlns="http://www.w3.org/2000/svg">
  <text x="130" y="16" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#c4a35a">Analog Signal — continuous wave</text>
  <line x1="20" y1="90" x2="240" y2="90" stroke="#2e2c35"></line>
  <path d="M20,90 C40,40 60,40 80,90 C100,140 120,140 140,90 C160,40 180,40 200,90 C215,120 225,120 240,90" fill="none" stroke="#7c9ec9" stroke-width="2.2"></path>
  <text x="130" y="130" text-anchor="middle" font-size="10" fill="#9a97a3">infinite intermediate values — smooth curve</text>

  <g transform="translate(280,0)">
    <text x="130" y="16" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#c4a35a">Digital Signal — discrete levels</text>
    <line x1="20" y1="90" x2="240" y2="90" stroke="#2e2c35"></line>
    <path d="M20,110 L20,60 L70,60 L70,110 L70,60 L120,60 L120,110 L170,110 L170,60 L220,60 L220,110 L240,110" fill="none" stroke="#8dbf8d" stroke-width="2.2"></path>
    <text x="130" y="130" text-anchor="middle" font-size="10" fill="#9a97a3">only 2 fixed levels — sharp transitions</text>
  </g>
</svg>
</div>

<h4>Periodic vs Nonperiodic Signals</h4>
<div class="callout def"><span class="co-label">Definition</span>
A signal is <strong>periodic</strong> if it completes a pattern (a "cycle") within a measurable time frame called a <strong>period</strong>, and repeats that identical pattern over subsequent periods of the same length. A signal is <strong>nonperiodic</strong> (or aperiodic) if it changes without exhibiting any such repeating pattern.
</div>
<ul>
  <li>In data communications, we commonly use <strong>periodic analog signals</strong> (built from sine waves) and <strong>nonperiodic digital signals</strong> (since real data streams — text, files — don't naturally repeat).</li>
  <li>A <strong>sine wave</strong> is the most fundamental form of a periodic analog signal, characterized by 3 parameters: <strong>peak amplitude</strong> (signal strength/height), <strong>frequency</strong> (rate of change per second), and <strong>phase</strong> (position of the waveform relative to time 0).</li>
</ul>

<pre><code>Wave speed = frequency × wavelength
        v = f × λ

Higher frequency → shorter wavelength (at constant speed)
Lower frequency  → longer wavelength

Period and frequency are reciprocals of each other:
        T = 1/f          f = 1/T</code></pre>

<div class="callout example"><span class="co-label">Example</span>
The power we use at home has a frequency of 50 Hz (in most of the world including India). The period of this sine wave is <code>T = 1/f = 1/50 = 0.02 s = 20 ms</code> — the voltage completes one full cycle every 20 milliseconds.
</div>
</div>

<h4>1. Mesh Topology</h4>
<p>Every device has a dedicated point-to-point link to every other device.</p>
<pre><code>Links needed (unidirectional) = n(n − 1)
Links needed (duplex mode)    = n(n − 1) / 2</code></pre>
<div class="grid2">
  <div class="col pros">
    <h5>Advantages</h5>
    <ul>
      <li>No traffic problems — dedicated links</li>
      <li>Robust — one link failure doesn't cripple system</li>
      <li>Privacy/security via dedicated lines</li>
      <li>Easy fault identification &amp; isolation</li>
    </ul>
  </div>
  <div class="col cons">
    <h5>Disadvantages</h5>
    <ul>
      <li>Difficult installation/reconnection</li>
      <li>Excessive cabling &amp; expensive hardware (I/O ports)</li>
      <li>Usually only used for backbones in hybrid networks</li>
    </ul>
  </div>
</div>

<h4>2. Star Topology</h4>
<p>Each device has a dedicated point-to-point link only to a central <strong>hub</strong>; devices aren't directly linked to each other — the hub acts as an exchange.</p>
<div class="grid2">
  <div class="col pros">
    <h5>Advantages</h5>
    <ul>
      <li>Less expensive than mesh</li>
      <li>Easy install/reconfigure — one link/port per device</li>
      <li>Robust — one link failure doesn't affect others</li>
      <li>Easy fault isolation</li>
    </ul>
  </div>
  <div class="col cons">
    <h5>Disadvantages</h5>
    <ul>
      <li>Single point of failure — the hub</li>
      <li>More cabling than ring/bus</li>
    </ul>
  </div>
</div>

<h4>3. Bus Topology</h4>
<p>One long backbone cable links all devices via <strong>drop lines</strong> and <strong>taps</strong>. Signal weakens (attenuates) with distance — limiting the number of taps and distance.</p>
<div class="grid2">
  <div class="col pros">
    <h5>Advantages</h5>
    <ul>
      <li>Ease of installation</li>
      <li>Uses less cabling than other topologies</li>
    </ul>
  </div>
  <div class="col cons">
    <h5>Disadvantages</h5>
    <ul>
      <li>Difficult reconnection &amp; fault isolation</li>
      <li>Signal reflection at taps → quality degradation</li>
      <li>Backbone fault stops all transmission</li>
    </ul>
  </div>
</div>

<h4>4. Ring Topology</h4>
<p>Each device connects to only its two neighbors; signal passes in one direction, regenerated at each device's repeater.</p>
<div class="grid2">
  <div class="col pros">
    <h5>Advantages</h5>
    <ul>
      <li>Easy install/reconfigure (neighbor-only links)</li>
      <li>Simplified fault isolation</li>
    </ul>
  </div>
  <div class="col cons">
    <h5>Disadvantages</h5>
    <ul>
      <li>Unidirectional traffic can be limiting</li>
      <li>Single break can disable the entire ring</li>
    </ul>
  </div>
</div>

<h4>5. Hybrid Topology</h4>
<p>Combines two or more topologies (bus + mesh + ring + star + tree), chosen based on business/institution needs, device count, location, and desired performance.</p>

<h4>Guided Media</h4>
<table>
<thead><tr><th>Medium</th><th>Key Points</th></tr></thead>
<tbody>
<tr><td><strong>Twisted Pair</strong></td><td>Two insulated copper conductors twisted together; one carries signal, other is ground reference. <strong>UTP</strong> (unshielded) is most common; <strong>STP</strong> (shielded — IBM) has metal foil/braided mesh shielding against noise/crosstalk.</td></tr>
<tr><td><strong>Coaxial Cable</strong></td><td>Central copper core + insulating sheath + metal foil/braid outer conductor (shield + 2nd conductor) + plastic cover. Carries higher frequencies than twisted pair. Used in Ethernet LANs, cable TV.</td></tr>
<tr><td><strong>Fiber Optic Cable</strong></td><td>Glass/plastic core surrounded by less-dense cladding; uses total internal reflection to guide light. Extremely high throughput, very high noise resistance, excellent security, long distances without repeaters — industry standard for high-speed networking.</td></tr>
</tbody>
</table>

<table>

<!-- SIGNAL ENCODING -->
<details class="card" id="m1-encoding">
<summary><span class="stitle"><span class="chev">▶</span> Signal Encoding: Digital-to-Digital Conversion <span class="badge">🔥 High Yield</span></span></summary>
<div class="card-body">
<p>Signal encoding techniques fall into 4 categories: Digital data→Digital signal, Digital data→Analog signal, Analog data→Digital signal, Analog data→Analog signal. Focus here: <strong>Digital-to-Digital</strong> (line coding).</p>

<h4>Data Element vs Signal Element</h4>
<div class="callout def"><span class="co-label">Definition</span>
A <strong>data element</strong> is the smallest unit of information — in digital communication, this is simply a single <em>bit</em> (what we <em>need</em> to send). A <strong>signal element</strong> is the shortest unit (constant in amplitude/frequency/phase) of a digital signal — it carries data elements, i.e. it's what we <em>actually</em> transmit. Data elements are what we have to send; signal elements are what we can actually send onto the medium.
</div>
<ul>
  <li><strong>r</strong> = ratio of data elements carried per signal element = <code>r = (number of data elements) / (number of signal elements)</code>.</li>
  <li>The goal in signal encoding is to carry the maximum number of data elements using the minimum number of signal elements — i.e. maximize r — since sending fewer signal elements to carry the same data lowers required bandwidth.</li>
</ul>

<table>
<thead><tr><th>Case</th><th>Meaning</th><th>Example</th></tr></thead>
<tbody>
<tr><td><strong>r = 1</strong></td><td>One data element needs exactly one signal element to be carried</td><td>NRZ-L, NRZ-I — each bit is represented by exactly one signal level/transition</td></tr>
<tr><td><strong>r &lt; 1</strong></td><td>One data element needs <em>more than one</em> signal element (extra signal elements needed for synchronization)</td><td>Manchester encoding: r = 1/2 — every bit requires <strong>2</strong> signal elements (the mid-bit transition), so only half a data element is carried per signal element</td></tr>
<tr><td><strong>r &gt; 1</strong></td><td>A single signal element carries <em>more than one</em> data element (multilevel schemes)</td><td>A signal with 4 possible levels can represent 2 bits per signal element — e.g. 2B1Q encoding: r = 2 (2 bits carried per 1 quaternary signal element)</td></tr>
</tbody>
</table>

<div class="callout example"><span class="co-label">Example — r = 1/2 (Manchester)</span>
Manchester encoding needs 2 signal transitions to represent just 1 data bit (the mandatory mid-bit transition for self-clocking, plus possibly a boundary transition). So <code>r = 1 data element / 2 signal elements = 1/2</code>. This is precisely why Manchester needs roughly double the bandwidth of a simple NRZ scheme for the same bit rate.
</div>

<div class="callout example"><span class="co-label">Example — r = 2 (Multilevel)</span>
2B1Q ("2 Binary, 1 Quaternary") encodes 2 data bits using a single signal element chosen from 4 possible voltage levels. Since 1 signal element now carries 2 data elements, <code>r = 2/1 = 2</code>. This lets the signal rate stay lower than the data rate — useful for squeezing more bits through a limited-bandwidth line.
</div>

<h4>Data Rate vs Signal Rate</h4>
<div class="callout def"><span class="co-label">Definition</span>
<strong>Data rate (N)</strong>, also called the <strong>bit rate</strong>, is the number of data elements (bits) sent in 1 second — measured in bits per second (bps). <strong>Signal rate (S)</strong>, also called the <strong>pulse rate, modulation rate, or baud rate</strong>, is the number of signal elements sent in 1 second — measured in <strong>bauds</strong>.
</div>
<ul>
  <li>Goal: increase data rate while reducing baud rate — i.e. carry as much information as possible using as few signal changes as possible, since each signal change/transition consumes bandwidth.</li>
</ul>

<pre><code>Relationship between data rate (N) and signal rate (S):

        S = c × N × (1/r)

where c = case factor (worst/best/average), r = data elements per signal element
Average case typically uses c = 1/2</code></pre>

<div class="callout example"><span class="co-label">Solved Example</span>
r = 1 (one data element per signal element), bit rate N = 100 kbps, average c = 1/2.<br>
<code>S = (1/2) × 100,000 × (1/1) = 50,000 baud</code>
</div>

<h4>Line Coding Schemes</h4>

  <!-- bit values -->
  <g font-family="monospace" font-size="13" fill="#e6e4ea" text-anchor="middle" font-weight="700">
    <text x="117.5" y="352">0</text><text x="172.5" y="352">1</text><text x="227.5" y="352">0</text><text x="282.5" y="352">0</text><text x="337.5" y="352">1</text><text x="392.5" y="352">1</text><text x="447.5" y="352">0</text>
  </g>
  <text x="280" y="368" text-anchor="middle" font-size="9.5" fill="#9a97a3">bit sequence: 0 1 0 0 1 1 0</text>
</svg>
<div class="diagram-caption">Same 7-bit sequence shown across the four schemes — notice Manchester is the only one with a transition <em>every single bit</em> (self-clocking), while NRZ schemes can have long silent runs of no transitions.</div>
</div>

<table>
<thead><tr><th>Scheme</th><th>Description</th></tr></thead>
<tbody>
<tr><td><strong>Unipolar NRZ</strong></td><td>All signal levels on one side of axis; positive voltage = 1, zero voltage = 0; signal doesn't return to zero mid-bit</td></tr>
<tr><td><strong>Polar NRZ-L</strong></td><td>Two voltage levels; the <em>level</em> itself determines the bit value</td></tr>
<tr><td><strong>Polar NRZ-I</strong></td><td>A <em>change</em> (or no change) in level determines the bit — transition = 1, no transition = 0</td></tr>
<tr><td><strong>Manchester coding</strong></td><td>Combines NRZ-L + RZ; every symbol has a mid-bit transition (high→low or low→high); 2 voltage levels; used by <strong>IEEE 802.3 Ethernet</strong> 🔥</td></tr>
<tr><td><strong>Differential Manchester</strong></td><td>Combines NRZ-I + RZ; every symbol has a mid-bit transition, but the starting level depends on the bit value</td></tr>
</tbody>
</table>

<div class="callout note"><span class="co-label">Note</span>
<strong>Manchester encoding is used by classic Ethernet</strong> — a frequently tested fact. Remember: a binary 1 = high-then-low; binary 0 = low-then-high (within each bit period).
</div>
</div>
</details>

<!-- PERFORMANCE -->
<details class="card" id="m1-perf">
<summary><span class="stitle"><span class="chev">▶</span> Performance Indicators: Bandwidth, Throughput, Latency, BDP, Jitter <span class="badge">🔥🔥 Very High Yield — Numericals!</span></span></summary>
<div class="card-body">
<p>Performance metrics measure a network's <strong>Quality of Service (QoS)</strong> as perceived by the user: <strong>Bandwidth, Throughput, Latency (Delay), Bandwidth-Delay Product, Jitter.</strong></p>

<h4>1. Bandwidth</h4>
<div class="callout def"><span class="co-label">Definition</span>
<strong>Bandwidth</strong> is a term that describes the range of frequencies within a composite signal, or the range of frequencies that a communication channel can carry. Loosely, it is a measure of a network's <em>capacity</em> — how much data the "pipe" can theoretically carry.
</div>
<ul>
  <li><strong>Bandwidth in Hertz</strong> — range of frequencies in a composite signal/channel: <code>Bandwidth = upper frequency − lower frequency</code>. This meaning is used when discussing the range that a wire, air medium, or optical fiber can pass through it without excessive attenuation.</li>
  <li><strong>Bandwidth in bits per second</strong> — the number of bits/sec a channel, link, or network can transmit — the more commonly used meaning when discussing computer networks and their "speed."</li>
  <li>"Bandwidth" = Capacity; "Speed" = Transfer rate. Data rate is <strong>directly proportional</strong> to bandwidth (Hz) — a wider frequency band lets you push more bits through per second, which is why the two senses of "bandwidth" are so closely linked even though one is measured in Hz and the other in bps.</li>
</ul>

<div class="callout example"><span class="co-label">Solved Example — Bandwidth</span>
A composite signal has frequencies 100–5000 Hz (5 sine waves: 100,300,500,700,900 Hz).<br>
<code>Bandwidth B = f_high − f_low = 900 − 100 = 800 Hz</code>
</div>

<h4>2. Throughput</h4>
<div class="callout def"><span class="co-label">Definition</span>
<strong>Throughput</strong> is a measure of how fast data can actually pass through a network/device — the number of bits that flow through a point in the network in a given period of time. It tells us how "busy" or how efficiently the link is actually being used, as opposed to how much it could theoretically carry.
</div>
<ul>
  <li>Number of bits <em>successfully</em> transmitted per unit time — how fast data can <em>actually</em> be sent.</li>
  <li>Bandwidth = <em>potential</em> measurement (an upper limit imposed by the medium); Throughput = <em>actual</em> measurement (always ≤ bandwidth, limited by SNR, congestion, hardware, and protocol overhead).</li>
</ul>
<pre><code>Throughput = (frames × bits per frame) / time

Example: 10 Mbps link, 12,000 frames/min, 10,000 bits/frame
Throughput = (12,000 × 10,000) / 60 = 2,000,000 bps = 2 Mbps
(≈ one-fifth of the 10 Mbps bandwidth)</code></pre>

<h4>3. Latency (Delay) 🔥</h4>
<div class="callout def"><span class="co-label">Definition</span>
<strong>Latency</strong> (or delay) defines how long it takes for an entire message to completely arrive at the destination, starting from the time the first bit is sent out from the source to the time the last bit is delivered at the destination. It is essentially the time to successfully send a packet across a network, and can be measured in different ways — round-trip, one-way, etc. It's also known as the "ping rate" and is measured in milliseconds (ms).
</div>
<p>Latency is affected by any component along the path — workstations, WAN links, routers, LAN segments, servers — and for large networks may ultimately be limited by the speed of light itself.</p>
<pre><code>Latency = Propagation Time + Transmission Time + Queuing Time + Processing Delay

Propagation Time  = Distance / Propagation Speed
Transmission Time = Message size / Bandwidth</code></pre>
<ul>
  <li><strong>Propagation delay</strong> — the time required for one bit to travel from source to destination; calculated as the ratio between the link length (distance) and the propagation speed over the medium. The propagation speed of electromagnetic signals depends on the medium and the frequency of the signal — in a vacuum, light travels at 3×10⁸ m/s; it's slower in air, and much slower in cable.</li>
  <li><strong>Transmission delay</strong> — in communications we don't send just 1 bit, we send an entire message. The first bit may take a time equal to the propagation time to reach its destination; the last bit takes the same propagation time too, but there is additionally a gap between when the first bit <em>leaves</em> the sender and when the last bit <em>arrives</em> at the receiver — this gap is the transmission time, and it depends on the message size and the channel's bandwidth.</li>
  <li><strong>Queuing time</strong> — time a frame waits at an intermediate device (router) before it can be processed; this is not a fixed factor and increases with network load/congestion.</li>
  <li><strong>Processing delay</strong> — time for a router (or any intermediate device) to determine where to forward a packet.</li>
  <li>Networks with small delays are called <strong>Low-Latency Networks</strong>; those with long delays are <strong>High-Latency Networks</strong>. High latency creates bottlenecks — it stops the data from taking full advantage of the network's available bandwidth.</li>
</ul>

<div class="callout example"><span class="co-label">Solved Example — Propagation Time</span>
Distance = 12,000 km, propagation speed = 2.4×10⁸ m/s.<br>
<code>Propagation time = (12,000 × 1000) / (2.4×10⁸) = 50 ms</code>
</div>

<div class="callout example"><span class="co-label">Solved Example — Short Message, High Bandwidth</span>
2.5 kbyte message, bandwidth = 1 Gbps, distance = 12,000 km, speed = 2.4×10⁸ m/s.<br>
Propagation time dominates; transmission time is negligible and can be ignored.
</div>

<div class="callout example"><span class="co-label">Solved Example — Long Message, Low Bandwidth</span>
5 Mbyte message (image), bandwidth = 1 Mbps, distance = 12,000 km.<br>
Transmission time dominates; propagation time is negligible and can be ignored.
</div>

<h4>4. Bandwidth–Delay Product 🔥</h4>
<div class="callout def"><span class="co-label">Definition</span>
The product of a link's <strong>bandwidth</strong> and its <strong>delay</strong> gives the maximum number of bits that can "fill" the link at any instant (i.e., the number of bits in transit).
</div>
<pre><code>Bandwidth-Delay Product = Bandwidth × Delay

Case 1: Bandwidth = 1 bps, Delay = 5s
BDP = 1 × 5 = 5 bits can fill the link at any given time

Case 2: Bandwidth = 5 bps, Delay = 5s (same delay, wider pipe)
BDP = 5 × 5 = 25 bits can fill the link at any given time</code></pre>

<div class="diagram-wrap">
<svg viewBox="0 0 480 130" xmlns="http://www.w3.org/2000/svg">
  <text x="240" y="16" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="12" fill="#9a97a3">Think of the link as a pipe — BDP is its volume in bits</text>
  <rect x="40" y="35" width="20" height="14" fill="#1e1c22" stroke="#c4a35a"></rect>
  <rect x="60" y="35" width="360" height="60" fill="none" stroke="#7c9ec9" stroke-width="2"></rect>
  <rect x="420" y="65" width="20" height="14" fill="#1e1c22" stroke="#c4a35a"></rect>
  <g fill="#c4a35a">
    <circle cx="90" cy="55" r="7"></circle><circle cx="130" cy="60" r="7"></circle><circle cx="170" cy="50" r="7"></circle><circle cx="210" cy="65" r="7"></circle><circle cx="250" cy="55" r="7"></circle>
  </g>
  <text x="240" y="115" text-anchor="middle" font-size="10.5" fill="#9a97a3">bits already sent but not yet received — "in flight" inside the link</text>
  <text x="50" y="30" font-size="10" fill="#8dbf8d">Sender</text>
  <text x="430" y="120" font-size="10" fill="#8dbf8d">Receiver</text>
</svg>
<div class="diagram-caption">Same delay (5s), but a wider pipe (Case 2: 5 bps vs Case 1: 1 bps) holds 5× more bits in flight — 25 bits instead of 5. Bandwidth is literally how "fat" the pipe is; delay is how "long" it is.</div>
</div>

<h4>5. Jitter</h4>
<div class="callout def"><span class="co-label">Definition</span>
<strong>Jitter</strong> is another performance issue related to delay. In technical terms, jitter is a <strong>"packet delay variance"</strong> — it occurs when different packets of data face different (inconsistent) delays in a network, and the receiver application is time-sensitive (e.g. audio or video data). It is defined as an interference in the normal, expected order of arriving data packets, and is measured in milliseconds (ms).
</div>
<ul>
  <li>Jitter = "packet delay variance" — occurs when different packets face different delays and the receiving application is time-sensitive (audio/video).</li>
  <li>Measured in milliseconds (ms).</li>
  <li>Can cause flickering in video displays, or stuttering/glitches in audio.</li>
  <li><strong>Jitter buffer</strong> mitigates jitter by buffering packets before feeding them out at a steady rate (e.g. YouTube buffering before playback). The destination system usually receives packets from this buffer rather than directly from the source. Another mitigation approach, when multiple paths exist, is to selectively route traffic along the most stable path, or the path that comes closest to the targeted packet delivery rate.</li>
</ul>

<div class="callout example"><span class="co-label">Example</span>
If the delay for the first packet is 10 ms, for the second is 35 ms, and for the third is 50 ms, the real-time destination application experiences <strong>jitter</strong> — the uneven gaps between packet arrivals (10ms, then 25ms, then 15ms) disrupt smooth playback even though every packet eventually arrives.
</div>

<div class="callout warn"><span class="co-label">Common Mistake</span>
Don't confuse <strong>Bandwidth</strong> (potential/capacity) with <strong>Throughput</strong> (actual achieved rate) — throughput is always less than or equal to bandwidth in practice.
</div>
</div>
</details>

</div>

<!-- DLL BASICS -->
<details class="card" id="m2-dll">
<summary><span class="stitle"><span class="chev">▶</span> Data Link Layer: Design Issues &amp; Services <span class="badge">🔥 High Yield</span></span></summary>
<div class="card-body">
<p>The DLL's data unit is the <strong>frame</strong> (not individual bits, as in the physical layer). DLL design deals with algorithms for reliable, efficient communication between two <em>adjacent</em> machines.</p>

<div class="diagram-wrap">
<svg viewBox="0 0 480 150" xmlns="http://www.w3.org/2000/svg">
  <text x="240" y="20" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="12" fill="#9a97a3">A Network-layer packet is wrapped into a Data Link frame:</text>
  <rect x="30" y="45" width="420" height="50" rx="6" fill="#1e1c22" stroke="#2e2c35" stroke-dasharray="3,3"></rect>
  <text x="240" y="35" text-anchor="middle" font-size="10.5" fill="#7c9ec9">Network-layer Packet</text>
  <rect x="40" y="55" width="340" height="30" fill="#7c9ec9" opacity="0.25"></rect>

  <rect x="30" y="105" width="70" height="34" fill="#c4a35a"></rect><text x="65" y="126" text-anchor="middle" font-size="11" font-weight="700" fill="#0f0e11">Header</text>
  <rect x="100" y="105" width="280" height="34" fill="#8dbf8d"></rect><text x="240" y="126" text-anchor="middle" font-size="11" font-weight="700" fill="#0f0e11">Payload (the packet)</text>
  <rect x="380" y="105" width="70" height="34" fill="#c98a7c"></rect><text x="415" y="126" text-anchor="middle" font-size="11" font-weight="700" fill="#0f0e11">Trailer</text>
  <text x="240" y="150" text-anchor="middle" font-size="10" fill="#9a97a3">Frame = Header (addr/control) + Payload (data) + Trailer (FCS/checksum)</text>
</svg>
</div>

<h4>Problems the DLL Must Solve</h4>
<ul>
  <li>Communication channels make errors occasionally</li>
  <li>Channels have finite data rate + nonzero propagation delay</li>
  <li>These limitations affect data transfer efficiency</li>
</ul>

<h4>Functions of the Data Link Layer</h4>
<ol>
  <li>Well-defined service interface to the network layer</li>
  <li>Frame management (encapsulating packets into frames: header + payload + trailer)</li>
  <li>Dealing with transmission errors (error detection &amp; correction)</li>
  <li>Flow control — preventing fast senders from swamping slow receivers</li>
</ol>

<div class="callout def"><span class="co-label">Frame Management</span>
<strong>Frame management</strong> is the process by which the data link layer takes packets handed down from the network layer and encapsulates them into <strong>frames</strong> for transmission — attaching a header (control/addressing info) and a trailer (error-checking info) around the payload. It also covers the reverse process at the receiver: recognizing frame boundaries within the incoming bit stream, stripping the header/trailer, and handing the recovered packet back up to the network layer. This is exactly the problem solved by the 4 <strong>framing methods</strong> discussed below (byte count, byte stuffing, bit stuffing, physical layer coding violations).
</div>

<div class="callout def"><span class="co-label">Error Control</span>
<strong>Error control</strong> refers to the mechanisms used to detect and correct errors that occur during frame transmission (bits flipped due to noise, attenuation, interference). It is largely handled through <strong>error detection codes</strong> (parity, checksum, CRC — flag that an error happened, trigger retransmission) and <strong>error correction codes</strong> (Hamming code — pinpoint and fix the corrupted bit without needing retransmission). Error control also encompasses <strong>ARQ (Automatic Repeat reQuest)</strong> — the combination of acknowledgements and timeouts used to guarantee that a damaged or lost frame is eventually retransmitted successfully.
</div>

<div class="callout def"><span class="co-label">Flow Control</span>
<strong>Flow control</strong> refers to a set of procedures that restrict the amount of data a sender can send before waiting for an acknowledgement — preventing a fast transmitter from overwhelming the buffer capacity of a slower receiver. Without flow control, a receiver could be flooded with more frames than it can process or store, causing frames to be dropped even though nothing was corrupted in transit. Flow control is implemented via <strong>protocols</strong> like Stop-and-Wait (send one frame, wait for ACK) and <strong>Sliding Window</strong> (send several frames within an agreed "window" before needing an ACK).
</div>

<p>Broadly, there are <strong>two approaches</strong> to flow control:</p>
<table>
<thead><tr><th>Approach</th><th>Explanation</th></tr></thead>
<tbody>
<tr><td><strong>Feedback-based flow control</strong></td><td>The receiver sends back information to the sender, giving it permission to send more data — or at least telling the sender how the receiver is doing (how full its buffer is, whether it can keep up). This is the classic model used at the <strong>data link layer</strong> — ACKs, "ready" signals, and window updates are all examples of this feedback.</td></tr>
<tr><td><strong>Rate-based flow control</strong></td><td>The protocol has a <strong>built-in mechanism</strong> that limits the rate at which senders may transmit data, without needing any feedback from the receiver. This is more typical of a <strong>transport layer</strong> mechanism, where the sending rate is capped by protocol rules rather than continuous receiver feedback.</td></tr>
</tbody>
</table>
<div class="callout note"><span class="co-label">Note</span>
Regardless of which approach is used, the protocol always contains <strong>well-defined rules</strong> about exactly <em>when</em> a sender may transmit its next frame — this is precisely what Stop-and-Wait, Go-Back-N, and Selective Repeat each define differently.
</div>

<h4>Services Provided to the Network Layer 🔥</h4>
<table>
<thead><tr><th>Service</th><th>Description</th><th>Best Used For</th></tr></thead>
<tbody>
<tr><td><strong>Unacknowledged connectionless</strong></td><td>Independent frames sent, no ack, no logical connection, no loss recovery</td><td>Low error-rate channels; real-time traffic (voice); most LANs</td></tr>
<tr><td><strong>Acknowledged connectionless</strong></td><td>No logical connection, but each frame individually acknowledged &amp; resent if needed</td><td>Unreliable channels like wireless</td></tr>
<tr><td><strong>Acknowledged connection-oriented</strong></td><td>Connection established first; each frame numbered; guaranteed exactly-once, in-order delivery</td><td>Long unreliable links (satellite, long-distance telephone)</td></tr>
</tbody>
</table>
<p>The connection-oriented service has 3 phases: <strong>(1) Connection establishment</strong> (initialize counters/variables), <strong>(2) Data transfer</strong>, <strong>(3) Connection release</strong> (free buffers/resources).</p>

<div class="callout example"><span class="co-label">Example</span>
A VoIP call over Wi-Fi uses <strong>unacknowledged connectionless</strong> service — a dropped voice frame just causes a tiny glitch, not worth the delay of retransmission. A file transfer over a shaky satellite link uses <strong>acknowledged connection-oriented</strong> service — every single frame must arrive, in order, exactly once.
</div>
</div>
</details>

<!-- FRAMING -->
<details class="card" id="m2-framing">
<summary><span class="stitle"><span class="chev">▶</span> Framing Methods <span class="badge">🔥🔥 Very High Yield</span></span></summary>
<div class="card-body">
<p>Breaking a bit stream into frames is harder than it looks — the receiver must easily find frame boundaries while using minimal bandwidth. Four methods exist:</p>

<div class="diagram-wrap">
<svg viewBox="0 0 560 120" xmlns="http://www.w3.org/2000/svg">
  <text x="280" y="18" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="12" fill="#9a97a3">Continuous bit stream → chopped into delimited frames</text>
  <rect x="20" y="35" width="60" height="30" fill="#c98a7c"></rect><text x="50" y="55" text-anchor="middle" font-size="10" fill="#0f0e11" font-weight="700">FLAG</text>
  <rect x="80" y="35" width="140" height="30" fill="#7c9ec9"></rect><text x="150" y="55" text-anchor="middle" font-size="10.5" fill="#0f0e11" font-weight="700">Frame 1 data</text>
  <rect x="220" y="35" width="60" height="30" fill="#c98a7c"></rect><text x="250" y="55" text-anchor="middle" font-size="10" fill="#0f0e11" font-weight="700">FLAG</text>
  <rect x="280" y="35" width="140" height="30" fill="#8dbf8d"></rect><text x="350" y="55" text-anchor="middle" font-size="10.5" fill="#0f0e11" font-weight="700">Frame 2 data</text>
  <rect x="420" y="35" width="60" height="30" fill="#c98a7c"></rect><text x="450" y="55" text-anchor="middle" font-size="10" fill="#0f0e11" font-weight="700">FLAG</text>
  <rect x="480" y="35" width="60" height="30" fill="#c4a35a" opacity="0.5"></rect><text x="510" y="55" text-anchor="middle" font-size="9.5" fill="#0f0e11" font-weight="700">…</text>
  <text x="280" y="95" text-anchor="middle" font-size="10.5" fill="#9a97a3">A repeated FLAG pattern in the two-flags-in-a-row = end of one frame, start of the next</text>
</svg>
</div>

<h4>1. Byte/Character Count</h4>
<ul>
  <li>A header field specifies the number of bytes/characters in the frame.</li>
  <li><strong>Disadvantage:</strong> if the count is garbled by a transmission error, the destination loses synchronization — and retransmission requests don't help since the destination doesn't know how many bytes to skip. <strong>Rarely used.</strong></li>
</ul>

<div class="callout example"><span class="co-label">Example — How the Count Field Works (and Fails)</span>
Consider 4 frames sent back-to-back with counts <strong>5, 5, 8, 8</strong> (the count field is the first byte of each frame, telling the receiver how many bytes make up that frame).
</div>

<div class="diagram-wrap">
<svg viewBox="0 0 560 190" xmlns="http://www.w3.org/2000/svg">
  <text x="280" y="16" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="12" fill="#9a97a3">Byte-count framing — a single flipped bit derails every frame after it</text>

  <text x="10" y="45" font-family="Segoe UI,sans-serif" font-size="10.5" fill="#8dbf8d">Sent:</text>
  <rect x="60" y="30" width="30" height="24" fill="#8dbf8d"></rect><text x="75" y="46" text-anchor="middle" font-size="10" fill="#0f0e11" font-weight="700">5</text>
  <rect x="90" y="30" width="80" height="24" fill="#1e1c22" stroke="#8dbf8d"></rect><text x="130" y="46" text-anchor="middle" font-size="9.5" fill="#e6e4ea">4 bytes data</text>
  <rect x="175" y="30" width="30" height="24" fill="#8dbf8d"></rect><text x="190" y="46" text-anchor="middle" font-size="10" fill="#0f0e11" font-weight="700">5</text>
  <rect x="205" y="30" width="80" height="24" fill="#1e1c22" stroke="#8dbf8d"></rect><text x="245" y="46" text-anchor="middle" font-size="9.5" fill="#e6e4ea">4 bytes data</text>
  <rect x="290" y="30" width="30" height="24" fill="#8dbf8d"></rect><text x="305" y="46" text-anchor="middle" font-size="10" fill="#0f0e11" font-weight="700">8</text>
  <rect x="320" y="30" width="120" height="24" fill="#1e1c22" stroke="#8dbf8d"></rect><text x="380" y="46" text-anchor="middle" font-size="9.5" fill="#e6e4ea">7 bytes data</text>

  <text x="10" y="95" font-family="Segoe UI,sans-serif" font-size="10.5" fill="#c98a7c">Received:</text>
  <rect x="60" y="80" width="30" height="24" fill="#8dbf8d"></rect><text x="75" y="96" text-anchor="middle" font-size="10" fill="#0f0e11" font-weight="700">5</text>
  <rect x="90" y="80" width="80" height="24" fill="#1e1c22" stroke="#8dbf8d"></rect><text x="130" y="96" text-anchor="middle" font-size="9.5" fill="#e6e4ea">4 bytes data</text>
  <rect x="175" y="80" width="30" height="24" fill="#c98a7c"></rect><text x="190" y="96" text-anchor="middle" font-size="10" fill="#0f0e11" font-weight="700">7</text>
  <text x="190" y="72" text-anchor="middle" font-size="9" fill="#c98a7c">✕ flipped!</text>
  <rect x="205" y="80" width="105" height="24" fill="#c98a7c" opacity="0.5"></rect><text x="257" y="96" text-anchor="middle" font-size="9.5" fill="#0f0e11">wrong 7 bytes ✕</text>
  <rect x="310" y="80" width="30" height="24" fill="#c98a7c" opacity="0.7"></rect><text x="325" y="96" text-anchor="middle" font-size="10" fill="#0f0e11">?</text>
  <text x="380" y="96" text-anchor="middle" font-size="10" fill="#9a97a3">...everything after is now misread</text>

  <text x="280" y="140" text-anchor="middle" font-size="10.5" fill="#9a97a3">The second frame's count "5" flips to "7" during transmission.</text>
  <text x="280" y="156" text-anchor="middle" font-size="10.5" fill="#9a97a3">The receiver now reads 7 bytes as that frame's data — swallowing 2 bytes that</text>
  <text x="280" y="172" text-anchor="middle" font-size="10.5" fill="#9a97a3">actually belonged to the </text></svg><em>next</em> frame's count + data, desyncing everything after.

</div>

<h4>2. Flag Bytes with Byte (Character) Stuffing</h4>
<ul>
  <li>Each frame starts/ends with a special <strong>FLAG byte</strong>; two consecutive flags = end of one frame + start of next.</li>
  <li>Problem: the flag pattern might occur naturally in the data (especially binary data).</li>
  <li><strong>Solution:</strong> sender inserts an <strong>escape byte (ESC)</strong> before every accidental flag byte in the data — called <strong>byte stuffing</strong>. Receiver removes the ESC bytes before passing data up.</li>
  <li>If an ESC byte occurs naturally in data, it too is stuffed with another ESC (doubled ESC = natural occurrence).</li>
  <li>Used in <strong>PPP</strong> (Point-to-Point Protocol).</li>
  <li><strong>Disadvantage:</strong> tied to 8-bit characters — not all character codes use 8 bits.</li>
</ul>
<div class="callout example"><span class="co-label">Example — Byte Stuffing</span>
If the data itself contains a FLAG byte, the sender inserts an ESC just before it: <code>...DATA ESC FLAG DATA...</code>. The receiver sees the ESC, discards it, and treats the following byte as ordinary data instead of a real delimiter. If the data contains an ESC byte, it gets doubled: <code>...DATA ESC ESC DATA...</code>.
</div>

<h4>3. Flag Bits with Bit Stuffing 🔥</h4>
<ul>
  <li>Bit-level framing — frames can hold an arbitrary number of bits. Developed for <strong>HDLC</strong>.</li>
  <li>Each frame begins/ends with the bit pattern <code>01111110</code> (0x7E) — the FLAG byte.</li>
  <li>Whenever the sender's DLL sees <strong>five consecutive 1s</strong> in the data, it automatically stuffs a 0 bit after them.</li>
  <li>Receiver, upon seeing 5 consecutive 1s followed by a 0, automatically destuffs (removes) that 0 — fully transparent to the network layer.</li>
  <li>Also ensures a minimum density of transitions for synchronization — reason <strong>USB</strong> uses bit stuffing.</li>
</ul>
<div class="callout example"><span class="co-label">Example — Bit Stuffing</span>
Data: <code>01001111110111110</code><br>
After adding flags: <code>01111110 01001111110111110 01111110</code><br>
After bit stuffing: <code>01111110 0100111110101111100 01111110</code>
</div>

<h4>4. Physical Layer Coding Violations</h4>
<ul>
  <li>Used only where the encoding method includes redundancy (e.g. some LANs encode 1 bit using 2 physical levels: high-low = 1, low-high = 0).</li>
  <li>Combinations high-high / low-low are unused for data → reserved to delimit frames.</li>
  <li><strong>Advantage:</strong> easy to find frame boundaries, no need to stuff data.</li>
</ul>

<h4>Byte Stuffing vs Bit Stuffing 🔥</h4>
<table>
<thead><tr><th>Byte Stuffing</th><th>Bit Stuffing</th></tr></thead>
<tbody>
<tr><td>Larger increase in frame length — worst case roughly doubles frame size if data is all flag-pattern bytes</td><td>Smaller increase — roughly 12.5% overhead (1 bit added per 5 consecutive 1s)</td></tr>
</tbody>
</table>

<div class="callout note"><span class="co-label">Note</span>
Most real protocols use a combination of byte count + one other method for extra safety. If the delimiter/checksum doesn't match at the expected position, the stream is re-scanned for the next delimiter.
</div>

<details class="card" id="m2-error">
<summary><span class="stitle"><span class="chev">▶</span> Error Detection &amp; Correction: Hamming, Parity, Checksum, CRC <span class="badge">🔥🔥 Very High Yield — Numericals!</span></span></summary>
<div class="card-body">

<h4>Types of Errors</h4>
<ul>
  <li><strong>Single-bit error</strong> — only 1 bit changes.</li>
  <li><strong>Burst error</strong> — 2 or more bits change; harder to correct, but since data is sent in blocks, low error rates mean only 1–2 blocks may be affected.</li>
</ul>

<h4>Detection vs Correction</h4>
<div class="grid2">
  <div class="col pros">
    <h5>Error Detection</h5>
    <ul>
      <li>Simple yes/no — just checks if an error occurred</li>
      <li>Not concerned with number/location of errors</li>
      <li>Triggers retransmission</li>
      <li>Best on reliable channels (fiber) — cheaper to just retransmit</li>
    </ul>
  </div>
  <div class="col cons">
    <h5>Error Correction (FEC)</h5>
    <ul>
      <li>Needs to know exact count &amp; location of corrupted bits</li>
      <li>Also called <strong>Forward Error Correction</strong></li>
      <li>Needs more redundant bits than detection</li>
      <li>Best on unreliable channels (wireless) — retransmission itself may fail</li>
    </ul>
  </div>
</div>
<p>4 error-correcting code families: <strong>Hamming codes, Binary convolutional codes, Reed-Solomon codes, Low-Density Parity Check (LDPC) codes.</strong></p>

<pre><code>Frame = k data bits + r redundant (check) bits;  n = k + r  (n-bit "codeword")

Constraint on r:     2^r ≥ k + r + 1
Example: if k = 7, the smallest valid r = 4</code></pre>

<h4>Hamming Distance 🔥</h4>
<div class="callout def"><span class="co-label">Definition</span>
The Hamming distance between two codewords = the number of bit positions in which they differ. Found via <strong>XOR</strong> of the two codewords, then counting the 1s.
</div>
<div class="callout example"><span class="co-label">Solved Examples</span>
d(000, 011) = 2 &nbsp;|&nbsp; d(10101, 11110) = 3
</div>
<p>The Hamming distance <strong>of a complete code</strong> = the minimum HD between all possible pairs of legal codewords. With r check bits, only 1/2ʳ of all possible messages are legal codewords — this "sparseness" is what enables error detection/correction.</p>

<h4>Significance of Hamming Distance (dmin) 🔥🔥</h4>
<pre><code>To reliably DETECT  d errors → need a code with distance ≥ d + 1
To reliably CORRECT d errors → need a code with distance ≥ 2d + 1</code></pre>
<div class="callout example"><span class="co-label">Solved Example</span>
A code has dmin = 4.<br>
Detection: can detect 3-bit errors (3+1=4)<br>
Correction: can correct only 1-bit errors (since 1.5 isn't valid — needs odd dmin)<br>
<strong>Rule:</strong> error-correcting codes need an <em>odd</em> minimum distance (3, 5, 7…)
</div>

<div class="callout example"><span class="co-label">Solved Example — Where Correction Breaks Down</span>
A code has only 4 valid codewords: <code>0000000000</code>, <code>0000011111</code>, <code>1111100000</code>, <code>1111111111</code>. Its dmin = 5, so it can detect 4-bit errors (4+1=5) and correct 2-bit errors (2×2+1=5).<br><br>
<strong>Correction works:</strong> if <code>0000000111</code> arrives, the receiver correctly concludes the original was <code>0000011111</code> (closest codeword, only 2 bits off).<br><br>
<strong>Correction fails:</strong> if a <em>triple</em>-bit error changes <code>0000000000</code> into <code>0000000111</code>, the receiver makes the exact same guess — <code>0000011111</code> — which is now <strong>wrong</strong>. A 3-bit error exceeds this code's 2-bit correction capability (2×3+1=7 &gt; 5), so it gets "corrected" to the wrong codeword instead of being flagged.
</div>

<h4>Hamming Code — Single Bit Error Correction 🔥🔥</h4>
<ol>
  <li>Number codeword bits starting at 1. Positions that are <strong>powers of 2</strong> (1, 2, 4, 8, 16…) are parity bits; all others hold data.</li>
  <li>Each parity bit at position <em>p</em> checks bit positions whose binary representation has that power-of-2 bit set (e.g., bit 11 = 1+2+8, so checked by parity bits 1, 2, 8).</li>
  <li>Set each parity bit per the even/odd parity rule.</li>
  <li><strong>At the receiver:</strong> recheck each parity bit; sum the positions of all incorrect parity checks — this sum directly gives the position of the bad bit (the "error syndrome"). Flip that bit to correct it.</li>
</ol>

<div class="callout example"><span class="co-label">Worked Example — 8 data bits: 10011010</span>
Codeword positions: P1 P2 D1 P4 D2 D3 D4 P8 D5 D6 D7 D8 → skeleton <code>_ _ 1 _ 0 0 1 _ 1 0 1 0</code><br>
Computed (even parity): <strong>Codeword = 011100101010</strong><br>
If received as <code>011100101110</code>: positions 2 &amp; 8 fail parity → 2+8=10 → bit 10 is flipped → recovers <code>011100101010</code> ✓
</div>

<div class="callout example"><span class="co-label">Worked Example 2 — Receiver Side: 8 data bits 11000111</span>
Sender computes and transmits codeword <strong>111010010111</strong>. In transit, the bit at position 5 flips.<br>
Receiver recomputes all 4 parity checks on the corrupted codeword <code>111000010111</code>:
</div>

<table>
<thead><tr><th>Parity bit</th><th>Checks positions</th><th>Result</th></tr></thead>
<tbody>
<tr><td>P1</td><td>1,3,5,7,9,11</td><td>fails (contributes 1)</td></tr>
<tr><td>P2</td><td>2,3,6,7,10,11</td><td>passes (contributes 0)</td></tr>
<tr><td>P4</td><td>4,5,6,7,12</td><td>fails (contributes 4)</td></tr>
<tr><td>P8</td><td>8,9,10,11,12</td><td>passes (contributes 0)</td></tr>
</tbody>
</table>
<div class="callout example"><span class="co-label">Syndrome</span>
Add up the positions of every <em>failed</em> check: <code>1 + 4 = 5</code>. That sum <strong>is</strong> the exact position of the corrupted bit — flip bit 5 and the original codeword <code>111010010111</code> is recovered. This "add up the failed parity positions" trick is the fast way to solve Hamming problems in an exam without redrawing the whole 12-bit table each time.
</div>

<h4>Error-Detecting Codes: Parity, Checksum, CRC</h4>
<p>All three are linear, systematic block codes — cheaper than correction, ideal for low-error channels (copper/fiber).</p>

<table>
<thead><tr><th>Method</th><th>How it works</th><th>Notes</th></tr></thead>
<tbody>
<tr><td><strong>Parity Bit</strong></td><td>One bit appended so total 1-bits is even (or odd) — equivalent to XOR of data bits</td><td>Distance = 2, detects only single-bit errors reliably. For burst protection, arrange data as a matrix and use row/column parity (<strong>interleaving</strong>) — detects up to <em>k</em> bit errors per row/column.</td></tr>
<tr><td><strong>Checksum</strong></td><td>Running sum of data "words", then complement taken; appended at message end. Receiver sums everything (incl. checksum) — result of 0 means no error.</td><td>e.g., 16-bit Internet checksum used on all IP packets.</td></tr>
<tr><td><strong>CRC (Cyclic Redundancy Check)</strong></td><td>Treats bit strings as coefficients of a polynomial; sender &amp; receiver agree on generator polynomial G(x). Frame is made divisible by G(x) via modulo-2 division.</td><td>Also called polynomial code; strongest of the three. Detects <strong>all single-bit errors</strong> and all burst errors of length ≤ r (the degree of G(x)).</td></tr>
</tbody>
</table>

<pre><code>CRC Algorithm:
1. Let r = degree of G(x). Append r zero bits to the frame → represents x^r · M(x)
2. Divide this bit string by G(x) using modulo-2 (XOR) division
3. Subtract the remainder from x^r · M(x) (mod-2) → gives the transmitted codeword T(x)
4. Receiver divides received T(x) by G(x): remainder 0 = no error, nonzero = error detected</code></pre>

<div class="callout warn"><span class="co-label">Common Mistake</span>
Polynomial arithmetic in CRC is <strong>modulo 2</strong> — there are NO carries in addition and NO borrows in subtraction; both operations are simply <strong>XOR</strong>.
</div>

<div class="callout example"><span class="co-label">Worked Example — CRC Division</span>
Data = <code>1101011011</code>, Generator G(x) = <code>10011</code> (degree r = 4).<br>
1. Append 4 zero bits: <code>11010110110000</code><br>
2. Modulo-2 divide by <code>10011</code> → remainder = <code>1110</code><br>
3. Transmitted codeword = data + remainder = <strong><code>11010110111110</code></strong><br>
4. Receiver divides the codeword by <code>10011</code> again — remainder <code>0000</code> confirms no error.
</div>

<div class="callout example"><span class="co-label">Example — Internet Checksum</span>
Sender splits data into 16-bit words, adds them with end-around carry, then sends the <em>1's complement</em> of the sum as the checksum. Receiver adds all words (including the checksum) — a result of all 1s (equivalently, complement = 0) means the data arrived intact.
</div>

<div class="callout example"><span class="co-label">Worked Example — Checksum (simplified, 8-bit words)</span>
Three data bytes: <code>11001100</code>, <code>10101010</code>, <code>01110111</code>.<br>
1. Add them together (with <strong>end-around carry</strong> — any overflow bit wraps back and gets added in): sum = <code>11101110</code><br>
2. Checksum = 1's complement of the sum = <code>00010001</code> — this is what gets sent alongside the data.<br>
3. Receiver adds all 3 data bytes <em>and</em> the checksum together: result = <code>11111111</code> (all 1s) → no error detected. Any single corrupted bit would break this all-1s result.
</div>

<div class="callout note"><span class="co-label">Note — Overhead Comparison</span>
For a 1000-bit block with 10⁻⁶ error rate: <strong>Error correction</strong> needs ~10,000 check bits/megabit (10 check bits per 1000-bit block). <strong>Error detection + retransmission</strong> needs only ~2001 bits/megabit (1 parity bit/block + occasional retransmission) — far more efficient when errors are rare!
</div>
</div>
</details>

<summary><span class="stitle"><span class="chev">▶</span> Flow Control &amp; Sliding Window Protocols <span class="badge">🔥🔥 Very High Yield — Numericals!</span></span></summary>
<div class="card-body">

<h4>Flow Control vs Error Control</h4>
<ul>
  <li><strong>Flow control</strong> restricts how much data a sender can send before waiting for acknowledgement.</li>
  <li><strong>Error control</strong> uses <strong>ARQ (Automatic Repeat reQuest)</strong> = acknowledgements + timeouts to guarantee reliable delivery.</li>
</ul>

<h4>ARQ Basics</h4>
<ul>
  <li><strong>ACK</strong> — small control frame (header only, no data) confirming receipt.</li>
  <li><strong>Timeout</strong> — if no ACK arrives in a reasonable time, the sender retransmits.</li>
</ul>

<h4>Flow Control Protocols for a Noiseless (Ideal) Channel 🔥</h4>
<p>Before dealing with real, noisy/unreliable channels, it helps to study 2 simplified protocols that assume a <strong>perfect, error-free channel</strong> — no frames are ever lost, damaged, or duplicated. These are unrealistic but build up the core ideas step by step.</p>

<div class="callout def"><span class="co-label">Protocol 1 — The Simplest Protocol (Utopian)</span>
Assumes an <strong>ideal channel</strong> in <em>both</em> directions — no errors and unlimited receiver buffer/processing speed. The sender simply pumps out frames as fast as it can, with <strong>no flow control and no error control</strong> whatsoever. The receiver has nothing to do but accept every frame instantly. This protocol only exists as a teaching baseline — real receivers can never process infinitely fast.
</div>

<div class="callout def"><span class="co-label">Protocol 2 — Stop-and-Wait for a Noiseless Channel</span>
Still assumes an <strong>error-free</strong> channel, but now the receiver has <strong>finite buffer/processing speed</strong> — it can no longer accept frames arbitrarily fast. This introduces <strong>flow control</strong>: the sender must send one frame, then wait for a signal from the receiver ("I'm ready, send the next one") before sending the next — this is where the term "Stop-and-Wait" comes from. Since the channel is assumed noiseless, no sequence numbers or timers are needed yet — that comes with ARQ.
</div>

<h4>Stop-and-Wait Protocol 🔥</h4>
<ul>
  <li>Sender sends one frame, then waits for an ACK before sending the next.</li>
  <li>Uses a <strong>1-bit sequence number (0 or 1)</strong> to detect duplicate frames (in case an ACK is lost/delayed).</li>
</ul>
<pre><code>Stop-and-Wait ARQ = Stop-and-Wait + Timer/Timeouts + Sequence Numbers</code></pre>
<div class="callout warn"><span class="co-label">Common Mistake</span>
Without sequence numbers, a retransmitted frame after a lost ACK looks identical to the "next" frame to the receiver — causing duplicate delivery to the network layer. Sequence numbers fix this.
</div>
<div class="callout note"><span class="co-label">Disadvantage</span>
Stop-and-Wait is bandwidth-inefficient — the sender is idle after every frame, waiting for an ACK. <strong>Piggybacking</strong> (combining an ACK with an outgoing data frame in bidirectional links) helps, but the real fix is <strong>Sliding Window</strong>.
</div>

<h4>Stop-and-Wait ARQ — the 4 Operating Scenarios 🔥🔥</h4>
